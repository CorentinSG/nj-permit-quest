/* ---------- mission (quiz de 10) ---------- */
function startRun(wid){
  $('#overlay').classList.remove('show');
  const qs=pickQuestions(wid,10);
  go('run',{wid, qs, i:0, ok:0, combo:0, answered:false, picked:-1, order:null});
}
function optOrder(q){
  const idx=shuffle([0,1,2,3].slice(0,q.a.length));
  return idx; // ordre d'affichage : positions dans q.a
}
function comboMult(c){ return c>=10?3 : c>=5?2 : c>=3?1.5 : 1; }
function scrRun(){
  const c=CUR, q=c.qs[c.i].q;
  if(!c.order) c.order=optOrder(q);
  const w=WORLDS.find(x=>x.id===q.w);
  let html='<div class="qmeta"><div class="qprog">'+w.icon+' '+(c.i+1)+'/'+c.qs.length+'</div>'
   +(c.combo>=3?'<div class="combo"><span class="f">🔥</span>COMBO ×'+comboMult(c.combo)+'</div>':'')
   +'</div>'
   +'<div class="qbar"><i style="width:'+(c.i/c.qs.length*100)+'%"></i></div>'
   +'<div class="qcard" id="qcard">'
   +(q.s?'<div class="qsign">'+signSvg(q.s)+'</div>':'')
   +'<div class="qtext">'+esc(U(q.q))+'</div><div class="opts">';
  c.order.forEach((optIdx,pos)=>{
    let cls='opt', dis=c.answered?' disabled':'';
    if(c.answered){
      if(optIdx===0&&pos===c.picked) cls+=' sel-ok';
      else if(optIdx===0) cls+=' reveal';
      else if(pos===c.picked) cls+=' sel-ko';
      else cls+=' fade';
    }
    html+='<button class="'+cls+'"'+dis+' onclick="G.answer('+pos+',event)"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(U(q.a[optIdx]))+'</span></button>';
  });
  html+='</div>';
  if(c.answered){
    const good=c.order[c.picked]===0;
    html+='<div class="verdict '+(good?'ok':'ko')+'">'+(good?t(['✅ EXACT !','✅ NICKEL !','✅ PROPRE !','✅ BOOM !'][c.i%4],['✅ EXACT!','✅ NAILED IT!','✅ CLEAN!','✅ BOOM!'][c.i%4]):t('❌ RATÉ !','❌ MISSED!'))+'</div>'
     +'<div class="exp"><span class="tag">'+t('📌 LA RÈGLE','📌 THE RULE')+'</span>'+U(qx(q))+'</div>'
     +'<div class="nextbar"><button class="btn btn-bus" style="justify-content:center" onclick="G.next()" id="nextbtn">'+(c.i+1<c.qs.length?t('SUIVANT →','NEXT →'):t('RÉSULTAT 🏁','RESULT 🏁'))+'</button></div>';
  }
  return html+'</div>';
}
function answer(pos,ev){
  const c=CUR; if(c.answered) return;
  c.answered=true; c.picked=pos;
  const qi=c.qs[c.i].i;
  const good=c.order[pos]===0;
  recordAnswer(qi,good);
  if(good){
    c.ok++; c.combo++;
    if(c.combo>S.bestCombo){ S.bestCombo=c.combo; save(); }
    const xp=Math.round(10*comboMult(c.combo));
    (c.combo>=3?SFX.combo:SFX.ok)();
    gainXp(xp,ev);
  }else{
    c.combo=0; SFX.ko();
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),380);
  }
  checkBadges();
  render();
  const nb=$('#nextbtn'); if(nb) nb.focus();
}
function next(){
  const c=CUR;
  if(c.i+1<c.qs.length){ c.i++; c.answered=false; c.picked=-1; c.order=null; render(); }
  else endRun();
}
function endRun(){
  const c=CUR;
  S.runsDone++;
  if(c.ok===c.qs.length){ S.perfectRuns++; }
  save(); checkBadges();
  const stars=c.ok>=Math.ceil(c.qs.length*.9)?3:c.ok>=Math.ceil(c.qs.length*.8)?2:c.ok>=Math.ceil(c.qs.length*.6)?1:0;
  if(stars>=2){ SFX.win(); confetti(stars===3?150:70); }
  const bonus=stars===3?40:stars===2?20:0;
  if(bonus) gainXp(bonus);
  const w=c.wid?WORLDS.find(x=>x.id===c.wid):null;
  const m=c.wid?mastery(c.wid):null;
  $('#app').innerHTML='<div class="screen">'
   +'<div class="panel" style="text-align:center">'
   +'<div class="eyebrow">'+t('MISSION TERMINÉE','MISSION COMPLETE')+(w?' — '+esc(wn(w)):'')+'</div>'
   +'<div class="stars">'+'⭐'.repeat(stars)+'<span class="off">'+'⭐'.repeat(3-stars)+'</span></div>'
   +'<div class="bigscore '+(c.ok>=8?'ok':'ko')+'">'+c.ok+'/'+c.qs.length+'</div>'
   +(m!==null?'<p class="small">'+t('Maîtrise de la zone','Zone mastery')+' : <b style="color:var(--exit)">'+m+'%</b>'+(m>=80?t(' — le boss t\'attend ! ',' — the boss awaits! ')+(w?w.bossIc:''):'')+'</p>':'')
   +(bonus?'<p class="small">'+t('Bonus étoiles','Star bonus')+' : <b style="color:var(--bus)">+'+bonus+' XP</b></p>':'')
   +'<div class="menu" style="margin-top:16px">'
   +(c.wid?'<button class="btn btn-exit" onclick="G.startRun(\''+c.wid+'\')"><span class="ic">🔁</span>'+t('ENCORE ×10','AGAIN ×10')+'</button>':'')
   +(c.wid&&m>=80&&!S.bossWins[c.wid]?'<button class="btn btn-stop" onclick="G.startBoss(\''+c.wid+'\')"><span class="ic">'+(w?w.bossIc:'👊')+'</span>'+t('DÉFIER LE BOSS','CHALLENGE THE BOSS')+'</button>':'')
   +'<button class="btn btn-ghost" onclick="G.go(\'worlds\')"><span class="ic">🗺️</span>'+t('Carte','Map')+'</button>'
   +'</div></div></div>';
  renderHud();
}

    if(c.answered){
      if(optIdx===0&&pos===c.picked) cls+=' sel-ok';
      else if(optIdx===0) cls+=' reveal';
      else if(pos===c.picked) cls+=' sel-ko';
      else cls+=' fade';
    }
    html+='<button class="'+cls+'"'+dis+' onclick="G.bossAnswer('+pos+',event)"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(U(q.a[optIdx]))+'</span></button>';
  });
  html+='</div>';
  if(c.answered){
    const good=c.order[c.picked]===0;
    html+='<div class="verdict '+(good?'ok':'ko')+'">'+(good?t('💥 −'+c.lastDmg+' HP !','💥 −'+c.lastDmg+' HP!'):t('❌ Le boss te frappe ! −1 ❤️','❌ The boss hits you! −1 ❤️'))+'</div>'

  }
  return html+'</div>';
}
function bossAnswer(pos,ev){
  const c=CUR; if(c.answered) return;
  c.answered=true; c.picked=pos;
  const qi=c.qs[c.i%c.qs.length].i;
  const good=c.order[pos]===0;
  recordAnswer(qi,good);
  if(good){
    c.combo++;
    if(c.combo>S.bestCombo){ S.bestCombo=c.combo; save(); }
    c.lastDmg=9+Math.min(c.combo,5)*3;
    c.hp=Math.max(0,c.hp-c.lastDmg);
    SFX.hit(); gainXp(10,ev);
    const bf=$('#bossface'); if(bf){ bf.classList.add('hit'); }
  }else{
    c.combo=0; c.hearts--;
    SFX.ko();
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),380);
  }
  checkBadges();
  render();
  const nb=$('#nextbtn'); if(nb) nb.focus();
}

let V3D={raf:0, rot:-26, tilt:58, drag:false, auto:true, lx:0, ly:0, el:null};
function v3dStop(){ if(V3D.raf){ cancelAnimationFrame(V3D.raf); V3D.raf=0; } V3D.el=null; }
const V3SH=[.70,.86,1,.80];   // luminosité des 4 murs (N, E, S, O)

function g3obj(x,y,inner,rz){
  return '<div class="g-obj" style="transform:translate3d('+x+'px,'+y+'px,0)'+(rz?' rotateZ('+rz+'deg)':'')+'">'+inner+'</div>';
}
function g3box(w,d,h,col,z){
  z=z||0; let s='';
  for(let k=0;k<4;k++){
    const fw=(k%2===0)?w:d, off=((k%2===0)?d:w)/2;
    s+='<div class="g-face" style="width:'+fw+'px;height:'+h+'px;margin-left:'+(-fw/2)+'px;margin-top:'+(-h/2)
      +'px;background:'+col+';filter:brightness('+V3SH[k]+');transform:translateZ('+(z+h/2)+'px) rotateZ('+(k*90)+'deg) translateY('+(-off)+'px) rotateX(90deg)"></div>';
  }
  s+='<div class="g-face" style="width:'+w+'px;height:'+d+'px;margin-left:'+(-w/2)+'px;margin-top:'+(-d/2)
    +'px;background:'+col+';filter:brightness(1.2);transform:translateZ('+(z+h)+'px)"></div>';
  return s;
}
function g3pyr(b,ph,z,col){
  const half=b/2, slant=Math.sqrt(ph*ph+half*half), th=90-Math.atan2(half,ph)*180/Math.PI;
  let s='';
  for(let k=0;k<4;k++){
    s+='<div class="g-face g-tri" style="width:'+b+'px;height:'+slant+'px;margin-left:'+(-half)+'px;margin-top:'+(-slant)
      +'px;background:'+col+';filter:brightness('+V3SH[k]+');transform:translateZ('+z+'px) rotateZ('+(k*90)+'deg) translateY('+(-half)+'px) rotateX('+th+'deg)"></div>';
  }
  return s;
}
// cls : classe d'animation appliquée au contenu (à l'intérieur du billboard,
// pour ne pas écraser la contre-rotation qui garde le sprite face caméra)
function g3bill(em,size,z,cls,delay){
  const inner=cls?'<i class="'+cls+'"'+(delay?' style="animation-delay:'+delay+'s"':'')+'>'+em+'</i>':em;
  return '<div class="g-bill" style="font-size:'+size+'px;margin-left:'+(-size/2)+'px;margin-top:'+(-size)
    +'px;transform:translateZ('+(z||0)+'px) rotateZ(calc(-1 * var(--rot))) rotateX(calc(-1 * var(--tilt)))">'+inner+'</div>';
}
// panache de fumée : plusieurs bouffées décalées qui montent et se dissipent
function g3smoke(n,size,z,x,y){
  let s='';
  for(let i=0;i<n;i++) s+=g3obj(x||0,y||0,g3bill('☁️',size,z,'sm',i*(2.6/n)));
  return s;
}
function g3disc(r,col,z){
  return '<div class="g-face" style="width:'+(r*2)+'px;height:'+(r*2)+'px;margin-left:'+(-r)+'px;margin-top:'+(-r)
    +'px;border-radius:50%;background:'+col+';transform:translateZ('+(z==null?0.5:z)+'px)"></div>';
}
function g3shadow(r){ return g3disc(r,'rgba(0,0,0,.34)',0.4); }
function g3door(d,h){ // porte sur le mur sud
  return '<div class="g-face" style="width:9px;height:'+h+'px;margin-left:-4.5px;margin-top:'+(-h/2)

function v3dApply(){
  if(!V3D.el) return;
  V3D.el.style.setProperty('--rot', V3D.rot.toFixed(1)+'deg');
  V3D.el.style.setProperty('--tilt', V3D.tilt.toFixed(1)+'deg');
}
function v3dTurn(d){ V3D.auto=false; V3D.rot+=d; v3dApply(); }
function v3dInit(){
  const stage=$('#v3d'); V3D.el=$('#v3dw');
  if(!stage||!V3D.el) return;
  v3dApply();
  const down=e=>{ V3D.drag=true; V3D.auto=false; const t0=e.touches?e.touches[0]:e; V3D.lx=t0.clientX; V3D.ly=t0.clientY; stage.classList.add('dragging'); };
  const move=e=>{ if(!V3D.drag) return; const t0=e.touches?e.touches[0]:e;
    V3D.rot+=(t0.clientX-V3D.lx)*0.45;
    V3D.tilt=Math.max(24,Math.min(80,V3D.tilt+(t0.clientY-V3D.ly)*0.25));
    V3D.lx=t0.clientX; V3D.ly=t0.clientY; v3dApply(); if(e.cancelable) e.preventDefault(); };
  const up=()=>{ V3D.drag=false; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerdown',down);
  stage.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) V3D.auto=false;
  const loop=()=>{ if(!V3D.el) return; if(V3D.auto&&!V3D.drag){ V3D.rot+=0.16; v3dApply(); } V3D.raf=requestAnimationFrame(loop); };
  v3dStop(); V3D.el=$('#v3dw'); V3D.raf=requestAnimationFrame(loop);
}

// Score de douleur : privilégie les questions ratées souvent ET avec un fort taux d'échec.
function nemesisPool(){
  return Q.map((q,i)=>({q,i}))
    .map(o=>{ const s=S.qstat[o.i]; if(!s||!s.ko) return null;
      const tot=s.ok+s.ko, rate=s.ko/tot;
      return {...o, ko:s.ko, ok:s.ok, tot, rate, box:s.box, score:s.ko*(0.5+rate)}; })
    .filter(Boolean)
    .sort((a,b)=>b.score-a.score);
}

function startBlitz(){
  stopTimers();
  const deck=shuffle(DRILLS);
  CUR={screen:'blitz', phase:'play', deck, di:0, t:60, score:0, streak:0};
  nextDrill();
  render();
}
function nextDrill(){
  const c=CUR;
  if(c.di>=c.deck.length){ c.deck=shuffle(DRILLS); c.di=0; }
  const d=c.deck[c.di];
  c.opts=shuffle([d.a, ...d.o]);
}
function startBlitzTimer(){
  stopTimers();
  blitzTimer=setInterval(()=>{
    const c=CUR;
    if(c.screen!=='blitz'||c.phase!=='play'){ stopTimers(); return; }
    c.t--;
    if(c.t<=10&&c.t>0) SFX.tick();
    if(c.t<=0){ endBlitz(); return; }
    const el=$('#timer'); if(el){ el.textContent=c.t+'s'; el.classList.toggle('low',c.t<=10); }
  },1000);
}
function blitzAnswer(i,ev){
  const c=CUR, d=c.deck[c.di];
  const good=c.opts[i]===d.a;
  if(good){
    c.score++; c.streak++;
    SFX.ok(); gainXp(4,ev);
    if(c.streak%5===0){ gainXp(20); toast(t('🔥 Série de '+c.streak+' ! <b>+20 XP</b>','🔥 Streak of '+c.streak+'! <b>+20 XP</b>')); }
  }else{
    c.streak=0; SFX.ko();
    toast(t('❌ C\'était : <b>'+esc(dshow(d.a))+'</b>','❌ It was: <b>'+esc(dshow(d.a))+'</b>'));
  }
  c.di++; nextDrill(); render();
}
function endBlitz(){
  stopTimers();
  const c=CUR;
  gainCoins(c.score); save();
  if(c.score>S.blitzBest){ S.blitzBest=c.score; save(); SFX.win(); confetti(100); }
  checkBadges();
  c.phase='end'; render();
}

   +'<span style="display:flex;gap:8px;margin-top:14px">'

}
function examAnswer(pos){
  const c=CUR;
  SFX.click();
  const good=c.order[pos]===0;
  c.answers.push({qi:c.qs[c.i].i, good});
  recordAnswer(c.qs[c.i].i, good);
  if(c.i+1<c.qs.length){ c.i++; c.order=null; render(); }
  else{
    S.examsTaken++;
    const score=c.answers.filter(a=>a.good).length;
    const pass=score>=c.need;
    if(c.mode==='hard'){ if(score>S.examHardBest) S.examHardBest=score; }
    else if(c.mode==='nemesis'){ /* pas de record : le pool change tout le temps */ }
    else if(c.mode==='eclair'){ if(score>S.examEclairBest) S.examEclairBest=score; }
    else{ if(score>S.examBest) S.examBest=score; if(pass) S.examPassed=true; }
    gainCoins(score+(pass?50:0));
    save(); checkBadges();
    gainXp(score*2+(pass?(c.mode==='full'?200:100):0));
    go('examEnd',{score, answers:c.answers, mode:c.mode, need:c.need, total:c.qs.length});
  }
}

   +'<div class="setrow"><label for="set-sound">🔊 '+t('Effets sonores','Sound effects')+'</label><input type="checkbox" id="set-sound" '+(S.sound?'checked':'')+' onchange="G.setSound(this.checked)" style="width:22px;height:22px"></div>'
   +'<div class="setrow"><label for="set-date">📅 '+t('Date de l\'examen','Exam date')+'</label><input type="date" id="set-date" value="'+esc(S.examDate)+'" onchange="G.setDate(this.value)"></div>'
   +'<div class="setrow"><label>💾 '+t('Progression','Progress')+'</label><button class="backbtn" onclick="G.resetAsk()" style="color:var(--stop);border-color:var(--stopD)">'+t('TOUT EFFACER','ERASE ALL')+'</button></div>'
   +'</div>'
   +'<p class="footnote">'+t('ROUTE 440 est un jeu d\'entraînement indépendant, non affilié au NJ MVC.<br>Sauvegarde locale sur cet appareil (localStorage).','ROUTE 440 is an independent practice game, not affiliated with the NJ MVC.<br>Progress is saved locally on this device (localStorage).')+'</p>';
}
function setSound(v){ S.sound=v; save(); if(v){ SFX.ok(); } }
function setLang(v){ S.lang=(v==='en'?'en':'fr'); save(); applyLang(); render(); toast(t('🌐 Langue : Français · unités métriques','🌐 Language: English · US units')); }
function toggleLang(){ setLang(S.lang==='en'?'fr':'en'); }
function setDate(v){ S.examDate=v; save(); renderHud(); toast(t('📅 Date d\'examen mise à jour','📅 Exam date updated')); }
function resetAsk(){
  showOverlay('🗑️',t('Tout effacer ?','Erase everything?'),t('XP, badges, records, erreurs — tout repart de zéro.','XP, badges, records, mistakes — everything resets to zero.')
   +'<span style="display:flex;gap:8px;margin-top:14px">'
   +'<button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="G.hideOverlay()">'+t('NON','NO')+'</button>'
   +'<button class="btn btn-stop" style="flex:1;justify-content:center" onclick="G.resetAll()">'+t('OUI, RESET','YES, RESET')+'</button></span>');
}
function resetAll(){ const lang=S.lang; S=defaults(); S.lang=lang; save(); hideOverlay(); go('home'); toast(t('💾 Sauvegarde effacée. Nouveau départ !','💾 Save erased. Fresh start!')); }
function hideOverlay(){ $('#overlay').classList.remove('show'); }

/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='4'){
    const pos=+e.key-1;
    if(CUR.screen==='run'&&!CUR.answered) answer(pos,{});
    else if(CUR.screen==='boss'&&!CUR.answered) bossAnswer(pos,{});
    else if(CUR.screen==='exam') examAnswer(pos);
    else if(CUR.screen==='blitz'&&CUR.phase==='play'&&pos<CUR.opts.length) blitzAnswer(pos,{});
  }
  if(e.key==='Enter'){
    if(CUR.screen==='run'&&CUR.answered) next();
    else if(CUR.screen==='boss'&&CUR.answered) bossNext();
  }
});

/* ---------- API globale + boot ---------- */
const G={go, openWorld, startRun, answer, next, startBoss, bossAnswer, bossNext,
  startBlitz, blitzAnswer, startExam, examAnswer, quitExam, startErrors,
  startArena, arenaNext, buy, startHardRun, startNemesisRun, startNemesisExam, v3dTurn,
  setSound, setLang, toggleLang, setDate, resetAsk, resetAll, hideOverlay};
window.G=G;
applyLang();
touchDaily(); save();
render();

</script>
</body>
</html>
