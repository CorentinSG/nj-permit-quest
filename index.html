{w:'signs',q:"On a highway, a broken white line between lanes means:",a:["Traffic moves in the same direction and you may change lanes with care","Traffic moves in opposite directions","Lane changes are prohibited","The lane is reserved for buses"],x:"Ligne blanche = même sens de circulation. Discontinue = tu peux changer de voie prudemment.",xe:"White line = same-direction traffic. Broken = you may change lanes with care."},
{w:'signs',q:"A solid white line between lanes of traffic means:",a:["Stay in your lane — crossing it is discouraged","You may cross it freely to pass","Traffic moves in opposite directions","The road narrows ahead"],x:"Ligne blanche continue = reste dans ta voie, la franchir est déconseillé.",xe:"Solid white line = stay in your lane; crossing is discouraged."},
{w:'signs',q:"An overhead lane signal shows a steady red X above your lane. You must:",a:["Not drive in that lane","Slow to 25 mph in that lane","Use that lane for left turns only","Stop under the signal and wait for green"],x:"X rouge au-dessus d'une voie = voie interdite. Change de voie dès que possible.",xe:"A red X over a lane means that lane is closed to you — move out of it."},
{w:'signs',q:"A DO NOT ENTER sign is posted to:",a:["Keep you from entering a road or ramp against traffic","Mark a dead-end street","Mark a private driveway","Warn of a low bridge ahead"],x:"DO NOT ENTER = tu entrerais à contresens (sortie d'autoroute, sens unique). Interdit d'y entrer.",xe:"DO NOT ENTER means you'd be going against traffic (exit ramps, one-way streets). Never enter."},
{w:'signs',q:"White rectangular signs with black letters are:",a:["Regulatory signs — they state laws you must obey","Warning signs about road hazards","Guide signs showing destinations","Service signs for food and fuel"],x:"Rectangle blanc = panneau de réglementation : c'est la loi, pas un conseil.",xe:"White rectangles are regulatory signs — they state the law, not a suggestion."},
{w:'signs',q:"At a red light with a NO TURN ON RED sign, the intersection is completely clear. You may:",a:["Not turn until the light turns green","Turn right after a full stop","Turn right without stopping since it's clear","Turn if no pedestrians are present"],x:"Le panneau NO TURN ON RED interdit le virage au rouge même si tout est dégagé. Attends le vert.",xe:"NO TURN ON RED bans the turn even when clear. Wait for green."},
{w:'signs',q:"You are in a lane with a large white arrow painted on the pavement pointing left. You must:",a:["Turn in the direction of the arrow","Treat the arrow as a suggestion","Go straight unless a sign says otherwise","Merge left only if traffic allows"],x:"Une flèche peinte au sol est obligatoire : tu dois suivre sa direction.",xe:"A pavement arrow is mandatory — you must move in the direction it shows."},
{w:'signs',q:"The red lights at a railroad crossing are flashing but you don't see a train. You must:",a:["Stop — a train is approaching; proceed only when the lights stop and it's safe","Slow down and cross quickly","Cross if you can't hear a horn","Stop, then cross within 10 seconds"],x:"Feux rouges clignotants au passage à niveau = un train arrive. Arrête-toi et attends que ça s'éteigne.",xe:"Flashing red lights at a crossing mean a train is coming. Stop and wait until they stop."},
{w:'speed',q:"A yellow sign under a curve warning reads '35 M.P.H.'. This number is:",a:["The recommended safe speed for the curve","The legal maximum enforced by radar","The minimum speed for the curve","Only valid at night"],x:"Panneau jaune = vitesse conseillée pour aborder le virage en sécurité, pas la limite légale.",xe:"Yellow advisory panels show the recommended safe speed for the curve, not the legal limit."},
{w:'speed',q:"You drive exactly 55 mph in a 55 mph zone during dense fog. You can still be ticketed because:",a:["You must adjust speed to conditions — the limit applies to ideal conditions only","Fog automatically lowers all limits to 25 mph","Radar doesn't work in fog","You cannot — driving the posted limit is always legal"],x:"La limite vaut par conditions idéales. Par brouillard, rouler à la limite peut être « trop vite pour les conditions ».",xe:"Posted limits assume ideal conditions. In fog, driving the limit can be 'too fast for conditions'."},
{w:'speed',q:"To reduce the risk of hydroplaning, you should:",a:["Slow down, keep good tread and proper tire pressure, avoid standing water","Drive with slightly underinflated tires for grip","Brake firmly through puddles","Use cruise control to keep speed steady"],x:"Contre l'aquaplaning : ralentis, pneus bien gonflés avec de la gomme, évite les flaques. Jamais de régulateur sous la pluie.",xe:"Against hydroplaning: slow down, good tread, proper pressure, avoid puddles. Never cruise control in rain."},
{w:'speed',q:"In a 65 mph zone, fines are doubled if you exceed the limit by:",a:["10 mph or more","5 mph or more","15 mph or more","20 mph or more"],x:"Dans les zones à 65 mph, dépasser de 10 mph ou plus = amende doublée.",xe:"In 65 mph zones, going 10+ mph over doubles the fine."},
{w:'speed',q:"A highway posts a minimum speed of 45 mph. Driving slower is:",a:["Illegal unless conditions make the minimum unsafe","Always legal — minimums are advisory","Legal in the right lane only","Legal with hazard lights on"],x:"Rouler sous la vitesse minimale affichée est illégal, sauf si les conditions l'exigent.",xe:"Driving below a posted minimum is illegal unless conditions require it."},
{w:'speed',q:"To control your speed on a long, steep downgrade, you should:",a:["Shift to a lower gear and use the engine to help slow you","Ride the brakes steadily all the way down","Shift to neutral to save fuel","Use cruise control"],x:"Longue descente : rétrograde et laisse le frein moteur travailler. Freiner en continu surchauffe les freins.",xe:"On long downgrades, shift to a lower gear and let the engine slow you. Riding the brakes overheats them."},
{w:'speed',q:"On an expressway, 'wolf packs' are dangerous. You should:",a:["Avoid driving in tight clusters of vehicles — spread out or drop back","Stay inside the pack for wind protection","Speed up to lead the pack","Match the pack's speed exactly"],x:"Les « wolf packs » sont des grappes de voitures : reste à l'écart, garde de l'espace autour de toi.",xe:"Wolf packs are tight vehicle clusters — stay out of them and keep space around you."},
{w:'dist',q:"Tires are legally worn out and unsafe when tread depth reaches:",a:["2/32 of an inch","4/32 of an inch","1/32 of an inch","6/32 of an inch"],x:"2/32 de pouce de gomme = pneu mort. En dessous, adhérence et évacuation d'eau s'effondrent.",xe:"2/32 inch of tread = worn out. Below that, grip and water evacuation collapse."},
{w:'dist',q:"Tire pressure should be checked when the tires are:",a:["Cold — before driving or after only a mile or two","Hot — right after highway driving","Warm — after about 20 minutes of driving","It makes no difference"],x:"Vérifie la pression à froid : la chaleur de la route fausse la mesure vers le haut.",xe:"Check pressure cold — driving heats tires and inflates the reading."},
{w:'dist',q:"To reduce airbag injury risk, the driver should sit with the chest at least ___ from the steering wheel.",a:["10 inches","6 inches","15 inches","20 inches"],x:"Garde au moins 10 pouces (25 cm) entre ta poitrine et le volant : l'airbag se déploie violemment.",xe:"Keep at least 10 inches between chest and wheel — airbags deploy with violent force."},
{w:'dist',q:"A 'space cushion' means keeping space:",a:["Ahead, behind and on both sides of your vehicle whenever possible","Only in front of your vehicle","Only when driving over 50 mph","Between you and parked cars only"],x:"Le coussin d'espace, c'est de la marge de tous les côtés : devant, derrière et sur les flancs.",xe:"A space cushion is margin on all sides: ahead, behind and beside you."},
{w:'dist',q:"In rain, snow or fog, your normal following distance should be:",a:["Increased well beyond the normal rule","Kept the same but with lights on","Cut in half to stay visible to the car ahead","Increased only above 40 mph"],x:"Mauvais temps = distances de freinage rallongées. Augmente nettement ton écart de suivi.",xe:"Bad weather stretches stopping distances. Increase your following gap well beyond normal."},
{w:'dist',q:"Total stopping distance is made up of:",a:["Perception distance + reaction distance + braking distance","Braking distance only","Reaction distance + braking distance only","Vehicle length + braking distance"],x:"Distance d'arrêt = percevoir + réagir + freiner. Le danger commence bien avant la pédale.",xe:"Stopping distance = perceiving + reacting + braking. Danger starts long before the pedal."},
{w:'dist',q:"A driver is tailgating you aggressively. The safest response is to:",a:["Slow gradually, add space ahead of you, and let them pass when possible","Brake hard to warn them off","Speed up to restore the gap","Stop suddenly to teach them a lesson"],x:"Face à un colleur : ralentis en douceur, agrandis ton espace devant et laisse-le passer.",xe:"With a tailgater: ease off, grow the space ahead, and let them pass."},
{w:'booze',q:"Eating a large meal before drinking alcohol will:",a:["Slow the alcohol's absorption but not keep it from reaching your blood","Prevent the alcohol from affecting you","Neutralize about half the alcohol","Lower your BAC to zero within an hour"],x:"Manger ralentit l'absorption de l'alcool, mais il finit quand même dans ton sang. Pas une protection.",xe:"Food slows alcohol absorption but it still reaches your blood. Not a shield."},
{w:'booze',q:"Before driving while on a new prescription medicine, you should:",a:["Read the warning label and ask your doctor or pharmacist about driving","Take a smaller dose and drive normally","Drink coffee to offset drowsiness","Only worry if the medicine is a narcotic"],x:"Lis l'étiquette et demande au médecin ou pharmacien : même des médicaments courants peuvent altérer la conduite.",xe:"Read the label and ask your doctor or pharmacist — even common medicines can impair driving."},
{w:'booze',q:"Among its effects, alcohol reduces your ability to:",a:["Judge distances and speeds accurately","Hear high-pitched sounds only","Feel the steering wheel","See colors during the day"],x:"L'alcool fausse ton estimation des distances et des vitesses — mortel aux intersections.",xe:"Alcohol distorts your judgment of distance and speed — deadly at intersections."},
{w:'booze',q:"Just one alcoholic drink:",a:["Can affect your driving ability","Has no effect if you weigh over 180 pounds","Is safe if taken with food","Only affects drivers under 21"],x:"Un seul verre peut déjà dégrader ta conduite. L'altération commence bien sous 0,08 %.",xe:"Even one drink can affect your driving. Impairment starts well below 0.08%."},
{w:'booze',q:"Since December 2019, a FIRST DUI conviction in New Jersey requires the driver to:",a:["Install an ignition interlock device","Surrender the vehicle for 90 days","Wear an alcohol-monitoring bracelet","Retake the road test"],x:"Depuis fin 2019, même une première condamnation DUI impose un éthylotest antidémarrage (interlock).",xe:"Since late 2019, even a first DUI conviction requires an ignition interlock device."},
{w:'booze',q:"Drinking alcohol when you are already tired:",a:["Multiplies the impairing effects of both","Cancels out the fatigue","Has the same effect as when rested","Only matters after midnight"],x:"Fatigue + alcool = effets démultipliés. Chacun aggrave l'autre.",xe:"Fatigue plus alcohol multiplies impairment. Each makes the other worse."},
{w:'booze',q:"Your friend is clearly drunk and reaching for their car keys. The best action is to:",a:["Take the keys and arrange another way home","Follow them in your car to make sure they're safe","Tell them to drive slowly and take back roads","Let them sit in the car for 15 minutes first"],x:"Prends-lui les clés et trouve-lui un autre moyen de rentrer. C'est ça, être un ami.",xe:"Take the keys and get them another ride home. That's what a friend does."},
{w:'booze',q:"After about three standard drinks, the body needs roughly ___ to eliminate the alcohol.",a:["3 hours","1 hour","30 minutes","8 hours"],x:"Le corps élimine environ un verre par heure : trois verres = environ trois heures. Rien ne peut accélérer ça.",xe:"The body clears about one drink per hour: three drinks means about three hours. Nothing speeds it up."},
{w:'points',q:"Knowingly driving with illegal drugs (CDS) in your vehicle brings:",a:["Loss of license for 2 years and a fine of at least $50","A $500 fine only","Loss of license for 6 months","2 points and a $200 fine"],x:"Drogues (CDS) dans le véhicule : 2 ans de retrait de permis + amende d'au moins 50 $.",xe:"CDS in the vehicle: 2-year license loss plus a fine of at least $50."},
{w:'points',q:"Driving while your license is suspended (first offense) brings:",a:["A $500 fine and up to 6 more months of suspension","A $100 fine and a warning","2 points and a $250 fine","Community service only"],x:"Conduire suspendu (1re fois) : 500 $ d'amende + jusqu'à 6 mois de suspension en plus.",xe:"Driving while suspended (first offense): $500 fine plus up to 6 extra months of suspension."},
{w:'points',q:"Improperly passing a frozen dessert (ice cream) truck displaying its signals costs:",a:["4 points","2 points","5 points","No points, fine only"],x:"Doubler un camion de glaces avec ses signaux activés : 4 points. Des enfants surgissent autour !",xe:"Improperly passing a signaling ice cream truck: 4 points. Kids dart out around them!"},
{w:'points',q:"Failure to keep right costs:",a:["2 points","4 points","3 points","5 points"],x:"Ne pas serrer à droite = 2 points.",xe:"Failure to keep right = 2 points."},
{w:'points',q:"Failure to observe a traffic signal costs:",a:["2 points","3 points","4 points","5 points"],x:"Griller un feu = 2 points (plus l'amende).",xe:"Running a signal = 2 points (plus the fine)."},
{w:'points',q:"Which auto insurance coverage is REQUIRED to register a car in New Jersey?",a:["Liability insurance","Collision insurance","Comprehensive insurance","Roadside assistance coverage"],x:"Seule la responsabilité civile (liability) est obligatoire pour immatriculer une voiture au NJ.",xe:"Only liability insurance is mandatory to register a car in NJ."},
{w:'points',q:"Collision and comprehensive insurance coverage are:",a:["Optional — they protect your own vehicle","Required by New Jersey law","Required only for cars under 5 years old","Required only for GDL drivers"],x:"Collision et « comprehensive » (vol, incendie) protègent TA voiture : facultatives, contrairement à la liability.",xe:"Collision and comprehensive protect YOUR car — optional, unlike liability."},
{w:'share',q:"Bicyclists on New Jersey roads:",a:["Have the same rights and duties as motor vehicle drivers","Must always ride on the sidewalk","May ignore traffic signals when clear","May only use roads with bike lanes"],x:"Les cyclistes ont les mêmes droits et devoirs que les automobilistes. Partage la route.",xe:"Cyclists have the same rights and duties as drivers. Share the road."},
{w:'share',q:"When following a motorcycle, you should:",a:["Allow a longer following distance than for a car","Follow closer since motorcycles are shorter","Stay in the motorcycle's lane position","Pass immediately to get it behind you"],x:"Derrière une moto, allonge la distance : elle peut s'arrêter très vite et chuter sur gravier ou pluie.",xe:"Give motorcycles extra following distance: they stop fast and can fall on gravel or rain."},
{w:'share',q:"Compared with cars, large trucks need:",a:["A much longer distance to stop","About the same distance to stop","A shorter distance because of air brakes","Less distance when fully loaded"],x:"Un camion chargé a besoin de beaucoup plus de distance pour s'arrêter. Ne te rabats jamais court devant lui.",xe:"A loaded truck needs far more distance to stop. Never cut in close in front of one."},
{w:'share',q:"A large truck is passing you on the left. You should:",a:["Stay right and avoid speeding up","Speed up so it passes faster","Move to the shoulder","Flash your high beams"],x:"Quand un camion te double, reste à droite et garde ta vitesse. Accélérer rallonge son dépassement.",xe:"When a truck passes, keep right and hold your speed. Speeding up stretches its pass."},
{w:'share',q:"In New Jersey, motorcycle riders and passengers must:",a:["Always wear an approved helmet","Wear a helmet only under age 21","Wear a helmet only on highways","Choose between a helmet and eye protection"],x:"Au NJ, casque homologué obligatoire pour tous les motards et passagers, sans exception d'âge.",xe:"In NJ an approved helmet is mandatory for all riders and passengers, no age exception."},
{w:'share',q:"Deer are MOST active on roadways:",a:["At dawn and dusk, especially in the fall","At midday in summer","Only during winter storms","Late morning in spring"],x:"Cerfs surtout à l'aube et au crépuscule, en automne. Et un cerf en cache souvent d'autres !",xe:"Deer peak at dawn and dusk, especially in fall. One deer often means more are coming!"},
{w:'share',q:"An aggressive driver is tailgating and gesturing at you. You should:",a:["Avoid eye contact, let them pass, and report them by dialing #77","Brake-check them to make a point","Match their speed to block them","Gesture back to assert yourself"],x:"Ne réponds jamais à un agressif : évite le contact visuel, laisse passer, signale-le au #77.",xe:"Never engage an aggressive driver: avoid eye contact, let them by, report via #77."},
{w:'share',q:"The proper use of your horn is:",a:["A light tap to warn others of your presence","A long blast to move slow drivers","Honking to greet friends","Expressing frustration in traffic jams"],x:"Le klaxon sert à prévenir d'un danger : un petit coup bref. Pas un défouloir.",xe:"The horn warns of danger: a light tap. It's not a frustration outlet."},
{w:'surv',q:"A driver's left arm extended straight out the window signals:",a:["A left turn","A right turn","A stop","A breakdown"],x:"Bras gauche tendu à l'horizontale = virage à GAUCHE.",xe:"Left arm straight out = LEFT turn."},
{w:'surv',q:"A driver's left arm pointing downward out the window signals:",a:["Stop or slow down","A left turn","A right turn","Passing is safe"],x:"Bras vers le BAS = stop ou ralentissement. Vers le haut = virage à droite.",xe:"Arm DOWN = stop or slowing. Arm UP = right turn."},
{w:'surv',q:"When backing straight up, you should:",a:["Turn your body and look over your RIGHT shoulder through the rear window","Rely on your three mirrors","Look over your left shoulder","Watch the backup camera only"],x:"Pour reculer : tourne-toi et regarde par-dessus ton épaule DROITE, à travers la lunette arrière.",xe:"To back up: turn and look over your RIGHT shoulder through the rear window."},
{w:'surv',q:"The FIRST step of a three-point (K) turn is to:",a:["Signal and pull to the far right edge of the road, then stop","Swing immediately across to the left curb","Back into the nearest driveway","Stop in the center of the road with hazards on"],x:"Demi-tour en trois temps : d'abord clignotant et arrêt complètement à droite de la chaussée.",xe:"K-turn step one: signal and stop at the far right edge of the road."},
{w:'surv',q:"Making a U-turn on an interstate highway is:",a:["Never allowed — even through openings in the median","Allowed if no traffic is visible","Allowed for emergencies only","Allowed at night with hazard lights"],x:"Jamais de demi-tour sur autoroute, même par les ouvertures du terre-plein. Continue jusqu'à la sortie.",xe:"Never U-turn on an interstate, even through median openings. Drive on to the next exit."},
{w:'surv',q:"'It's safer to be thrown clear of a crash than to wear a seat belt.' This is:",a:["A myth — you are about 25 times more likely to be killed if ejected","True at speeds under 30 mph","True in convertibles","True if the car might catch fire"],x:"Mythe ! Éjecté du véhicule, tu as environ 25 fois plus de risques d'être tué. Boucle-la.",xe:"Myth! Ejected occupants are about 25 times more likely to be killed. Buckle up."},
{w:'surv',q:"To avoid carbon monoxide poisoning, you should never:",a:["Run the engine in a closed garage","Drive with a window slightly open","Use the heater on the highway","Idle at a traffic light for over a minute"],x:"Ne laisse jamais tourner le moteur dans un garage fermé : le monoxyde de carbone tue sans prévenir.",xe:"Never run the engine in a closed garage: carbon monoxide kills without warning."},
{w:'surv',q:"Driving at night with ONLY your parking lights on is:",a:["Illegal — parking lights are for parking only","Legal on lit city streets","Legal under 25 mph","Legal at dusk but not full darkness"],x:"Rouler avec les seuls feux de position est illégal : ils servent uniquement au stationnement.",xe:"Driving on parking lights alone is illegal — they are for parking only."},
{w:'gdl',q:"A standard New Jersey driver license must be renewed every:",a:["4 years","2 years","5 years","10 years"],x:"Le permis NJ se renouvelle tous les 4 ans.",xe:"A NJ license renews every 4 years."},
{w:'gdl',q:"Choosing to be an organ donor on your NJ license:",a:["Does not affect the medical care you receive","Lowers your license fee","Requires a doctor's certificate","Expires after every renewal automatically"],x:"Être donneur d'organes ne change rien aux soins qu'on te donnera. C'est juste un choix généreux noté sur le permis.",xe:"Being an organ donor never affects your medical care. It's a generous choice noted on your license."},
{w:'gdl',q:"To get a special learner permit at age 16, you must:",a:["Be enrolled in an approved behind-the-wheel driver training course","Only pass the vision test","Have a parent co-sign a waiver of the knowledge test","Already own a registered vehicle"],x:"Permis d'apprenti à 16 ans (Early Bird) : inscription obligatoire à un cours de conduite agréé avec moniteur.",xe:"Special learner permit at 16 requires enrollment in an approved behind-the-wheel course."},
{w:'gdl',q:"The minimum age for a New Jersey probationary license is:",a:["17","16","16 and a half","18"],x:"Permis probatoire : 17 ans minimum, après le permis d'apprentissage et l'examen route.",xe:"Probationary license: minimum age 17, after the permit phase and road test."},
{w:'gdl',q:"The minimum age for a full basic New Jersey driver license is:",a:["18","17","21","17 and a half"],x:"Permis complet (basic) : 18 ans minimum, après un an de probatoire sans souci.",xe:"Full basic license: minimum age 18, after a clean probationary year."},
{w:'gdl',q:"New Jersey's GDL program applies to:",a:["ALL first-time drivers, regardless of age","Only drivers under 18","Only drivers under 21","Only high school students"],x:"Le GDL s'applique à TOUS les nouveaux conducteurs, même les adultes de plus de 21 ans.",xe:"GDL applies to ALL first-time drivers, even adults over 21."},

/* ================ FOURNÉE BRUTALE — pièges des tests les plus ratés ================ */
{w:'signs',q:"An Interstate highway route marker is:",a:["A red, white and blue shield","A green rectangle with white numbers","A black-and-white circle","A yellow pentagon"],x:"Le bouclier rouge-blanc-bleu = Interstate. Piège : le rectangle vert, c'est un panneau de guidage (sorties, destinations), pas le marqueur de route.",xe:"The red-white-blue shield marks Interstates. Trap: green rectangles are guide signs (exits, destinations), not the route marker."},
{w:'signs',q:"A flashing yellow arrow at a traffic signal means:",a:["You may turn left after yielding to oncoming traffic and pedestrians","Left turns are protected — oncoming traffic is stopped","No left turn until the arrow turns green","Stop, then turn when clear"],x:"Flèche jaune clignotante = tourne à gauche PERMIS mais pas protégé : cède au trafic en face. Piège : c'est la flèche VERTE qui te protège, pas la jaune.",xe:"Flashing yellow arrow = left turn PERMITTED but not protected: yield to oncoming traffic. Trap: only a GREEN arrow gives you a protected turn."},
{w:'signs',q:"You see a red-and-white WRONG WAY sign facing you. You must:",a:["Pull over immediately and turn around — you are going against traffic","Continue carefully to the next exit","Back up along the shoulder","Slow down and hug the right edge"],x:"WRONG WAY = tu roules à contresens. Arrête-toi et fais demi-tour tout de suite. Piège : continuer 'prudemment' jusqu'à la sortie, c'est foncer vers une collision frontale.",xe:"WRONG WAY means you're driving against traffic. Pull over and turn around immediately. Trap: 'carefully continuing' to the next exit means driving into head-on traffic."},
{w:'signs',q:"An overhead lane-control signal shows a FLASHING yellow X above your lane. This means:",a:["You may use the lane with caution, but be prepared to vacate it","The lane is closed — stop immediately","The lane is reserved for turns only","Speed up to clear the lane before it turns red"],x:"X jaune clignotant = voie utilisable avec prudence, elle va bientôt changer. Piège : c'est le X ROUGE fixe qui interdit la voie — ne confonds pas les deux.",xe:"Flashing yellow X = you may use the lane cautiously, it's about to change. Trap: it's the steady RED X that closes the lane — don't mix them up."},
{w:'signs',q:"Brown road signs point to:",a:["Recreational and cultural interest areas (parks, historic sites)","Motorist services like food and gas","Construction detours","Hospitals and rest areas"],x:"Marron = loisirs et sites culturels. Piège : les services (essence, resto, hôpital) sont sur fond BLEU — le marron, c'est parcs et sites historiques.",xe:"Brown = recreation and cultural sites. Trap: motorist services (gas, food, hospitals) are on BLUE signs — brown is parks and historic sites."},
{w:'signs',q:"You are halfway across the street when the pedestrian signal changes to a FLASHING raised hand (DON'T WALK). You should:",a:["Continue crossing — the flashing hand only means don't START crossing","Stop where you are and wait","Run back to the curb you came from","Wait on the center line for the next WALK signal"],x:"Main clignotante = ne COMMENCE pas à traverser ; si t'es déjà engagé, tu finis ta traversée. Piège : s'arrêter au milieu de la rue est la pire option.",xe:"Flashing hand = don't START crossing; if you're already in the street, finish crossing. Trap: freezing in the middle of the road is the worst choice."},
{w:'speed',q:"The NJ Driver Manual says the average passenger car is about ___ long — so at 50 mph the old rule means five car lengths of following distance.",a:["20 feet","15 feet","12 feet","25 feet"],x:"Le manuel NJ compte une voiture = environ 20 pieds, donc 5 longueurs à 50 mph = 100 pieds. Piège : 15 pieds paraît logique mais le manuel dit bien 20.",xe:"The NJ manual counts one car length as about 20 feet, so 5 lengths at 50 mph = 100 feet. Trap: 15 feet sounds plausible, but the manual says 20."},
{w:'speed',q:"Coasting downhill with the transmission in neutral is:",a:["Illegal and dangerous — you lose engine braking and control","Legal and saves fuel","Legal only below 35 mph","Recommended to avoid overheating the brakes"],x:"Descendre au point mort est ILLÉGAL au NJ : tu perds le frein moteur et le contrôle. Piège : 'économiser l'essence' est le faux bon argument classique.",xe:"Coasting in neutral downhill is ILLEGAL in NJ: you lose engine braking and control. Trap: 'saving fuel' is the classic false justification."},
{w:'speed',q:"According to the NJ manual, at about what speed can your tires lose ALL contact with the road on standing water?",a:["55 mph","35 mph","45 mph","70 mph"],x:"À 55 mph, les pneus peuvent perdre TOUT contact avec la route. Piège : 35 mph, c'est le début de l'aquaplanage — la perte totale, c'est 55.",xe:"At 55 mph tires can lose ALL contact with the road. Trap: 35 mph is where hydroplaning BEGINS — total loss of contact is at 55."},
{w:'speed',q:"While another vehicle is passing you, New Jersey law says you must:",a:["Not increase your speed until the pass is complete","Speed up slightly to shorten the maneuver","Move onto the shoulder to help","Flash your headlights when it is safe to return"],x:"Quand on te dépasse, tu ne dois PAS accélérer. Piège : 'aider' en accélérant ou en mordant l'accotement est illégal et dangereux.",xe:"When being passed, you must NOT speed up. Trap: 'helping' by accelerating or driving onto the shoulder is illegal and dangerous."},
{w:'speed',q:"As your speed increases, your field of vision:",a:["Narrows — you see less to the sides","Widens as you focus farther ahead","Stays the same but reaction time drops","Improves because your eyes adapt"],x:"Plus tu vas vite, plus ton champ de vision se RÉTRÉCIT — la vision en tunnel. Piège : la vitesse ne change pas que le freinage, elle réduit aussi ce que tu vois.",xe:"The faster you go, the NARROWER your field of vision — tunnel vision. Trap: speed doesn't just lengthen braking, it shrinks what you can see."},
{w:'speed',q:"You may not pass another vehicle on a hill or curve when:",a:["You cannot see far enough ahead to know the way is clear","You are within 200 feet of the top","There is any yellow line, even broken","Your speed would exceed 50 mph"],x:"Interdit de dépasser en côte ou en virage si tu ne vois pas assez loin pour être sûr que c'est libre. Piège : pas de chiffre magique en pieds — c'est la visibilité qui décide.",xe:"No passing on a hill or curve when you can't see far enough ahead to know it's clear. Trap: there's no magic footage number — sight distance is the rule."},
{w:'dist',q:"When parked on a highway outside business or residential areas, your vehicle must be visible from at least ___ in each direction.",a:["200 feet","100 feet","300 feet","500 feet"],x:"Garé hors agglomération : visible à 200 pieds dans les DEUX sens. Piège : 500 pieds, c'est la distance des feux de route face à un véhicule — pas le stationnement.",xe:"Parked outside built-up areas: visible from 200 feet in BOTH directions. Trap: 500 feet is the high-beam dimming distance for oncoming cars — not parking."},
{w:'dist',q:"A school bus with flashing red lights is stopped on the OTHER side of a divided highway with a raised median. You must:",a:["Slow to 10 mph and pass with caution","Stop at least 25 feet away like everyone else","Stop only if children are visible","Continue at normal speed — the median exempts you"],x:"Route à terre-plein : côté opposé, tu ne t'arrêtes pas mais tu ralentis à 10 mph. Piège : le réflexe 'toujours s'arrêter à 25 pieds' est faux ici — et 'vitesse normale' aussi.",xe:"Divided highway with a median: on the opposite side you don't stop, but you slow to 10 mph. Trap: the reflex 'always stop 25 feet away' is wrong here — and so is 'normal speed'."},
{w:'dist',q:"Double parking (stopping in the travel lane beside a parked car) is:",a:["Always illegal, even with your hazard lights on","Legal for under 3 minutes with hazards on","Legal only for loading and unloading","Legal if a passenger stays in the car"],x:"Le double stationnement est TOUJOURS interdit — les warnings ne le rendent pas légal. Piège : le mythe des '3 minutes avec les feux de détresse'.",xe:"Double parking is ALWAYS illegal — hazard lights don't make it legal. Trap: the classic '3 minutes with flashers' myth."},
{w:'dist',q:"Parking in a space reserved for persons with disabilities without a permit costs, for a first offense:",a:["$250","$100","$50","$500"],x:"Place handicapé sans permis : 250 $ dès la première fois (et plus cher ensuite, avec travaux d'intérêt général possibles). Piège : ce n'est pas une petite amende à 50 $.",xe:"Handicap space without a permit: $250 the first time (more later, with possible community service). Trap: it's not a small $50 ticket."},
{w:'dist',q:"On a two-way street, you must park:",a:["Facing the direction of traffic, right wheels to the right curb","In whichever direction is easier","Facing traffic if the spot is on your left","Within 12 inches of either curb, any direction"],x:"Tu dois te garer dans le SENS de la circulation, roues droites côté trottoir droit. Piège : traverser pour se garer 'face au trafic' est illégal au NJ.",xe:"You must park FACING traffic, right wheels to the right curb. Trap: crossing over to park 'facing traffic' is illegal in NJ."},
{w:'dist',q:"Besides dimming for oncoming cars at 500 feet, you must also dim your high beams when FOLLOWING another vehicle within:",a:["300 feet","500 feet","200 feet","100 feet"],x:"Deux chiffres à retenir : 500 pieds face à toi, 300 pieds quand tu SUIS quelqu'un. Piège : le test adore inverser les deux.",xe:"Two numbers: 500 feet for oncoming, 300 feet when FOLLOWING. Trap: the test loves swapping the two."},
{w:'dist',q:"Your horn must be audible under normal conditions from at least:",a:["200 feet","100 feet","500 feet","50 feet"],x:"Le klaxon doit s'entendre à 200 pieds minimum. Piège : 100 pieds semble raisonnable, mais la loi NJ dit 200.",xe:"Your horn must be audible from at least 200 feet. Trap: 100 feet sounds reasonable, but NJ law says 200."},
{w:'booze',q:"Every DWI conviction in New Jersey requires the driver to spend time at an Intoxicated Driver Resource Center (IDRC). For a first offense, that means:",a:["12 to 48 hours of detention and screening","A single 2-hour class","One weekend of community service","30 days of outpatient counseling"],x:"Toute condamnation DWI = passage obligatoire à l'IDRC : 12 à 48 heures pour une première fois. Piège : ce n'est pas un simple petit cours de 2 heures.",xe:"Every DWI conviction means mandatory IDRC time: 12 to 48 hours for a first offense. Trap: it's not just a short 2-hour class."},
{w:'booze',q:"A FIRST DUI conviction with a BAC of 0.15% or higher brings:",a:["License forfeiture of 4–6 months, plus an ignition interlock during and 9–15 months after restoration","Only a 3-month interlock, like lower BAC levels","An automatic 2-year license loss","A fine only — no license action for a first offense"],x:"À 0.15 %+, même la première fois : 4–6 mois de retrait PLUS interlock pendant et 9–15 mois après. Piège : le régime doux 'interlock 3 mois' ne vaut que sous 0.10 %.",xe:"At 0.15%+ even a first offense means 4–6 months forfeiture PLUS interlock during and 9–15 months after. Trap: the lenient '3-month interlock' deal only applies below 0.10%."},
{w:'booze',q:"You let an obviously drunk friend drive YOUR car. In New Jersey, you:",a:["Can be charged under the DWI law yourself for permitting it","Face no penalty — only the driver is liable","Are liable only if there is a crash","Get 2 points but no criminal charge"],x:"Permettre à une personne ivre de conduire TA voiture = tu peux être poursuivi sous la loi DWI toi-même. Piège : 'seul le conducteur est responsable' est faux au NJ.",xe:"Permitting a drunk person to drive YOUR car means you can be charged under the DWI law yourself. Trap: 'only the driver is liable' is false in NJ."},
{w:'booze',q:"Before taking the police breath test, you have the right to consult a lawyer:",a:["No — there is no right to a lawyer or to refuse before the breath test","Yes — you may call an attorney first","Yes, but only for 20 minutes","Only if you are under arrest"],x:"Pas d'avocat AVANT l'éthylotest : le consentement est implicite, refuser = sanctionné. Piège : le fameux 'j'appelle mon avocat d'abord' ne marche pas au NJ.",xe:"No lawyer BEFORE the breath test: consent is implied, and refusing is punished. Trap: the famous 'I'll call my lawyer first' doesn't work in NJ."},
{w:'booze',q:"On top of court fines, a DUI conviction brings an annual insurance surcharge of:",a:["$1,000 a year for 3 years","$100 a year for 3 years","$1,000 once","$250 a year for 10 years"],x:"Surtaxe DUI : 1 000 $ par an pendant 3 ans — 3 000 $ en plus des amendes. Piège : ce n'est ni un paiement unique ni 100 $.",xe:"DUI surcharge: $1,000 a year for 3 years — $3,000 on top of the fines. Trap: it's neither a one-time payment nor $100."},
{w:'booze',q:"A heavy drinker who 'handles alcohol well' drinks the same amount as a light drinker of the same weight. Their BAC will be:",a:["The same — tolerance does not lower BAC","Lower, because of tolerance","Higher, because of liver damage","Unmeasurable"],x:"La tolérance change ce que tu RESSENS, pas ton taux d'alcool. Même poids, mêmes verres = même BAC. Piège : 'je tiens bien l'alcool' ne trompe pas l'éthylotest.",xe:"Tolerance changes how you FEEL, not your blood alcohol. Same weight, same drinks = same BAC. Trap: 'holding your liquor' doesn't fool the breath test."},
{w:'points',q:"Cutting through a gas station or parking lot to avoid a traffic light costs:",a:["2 points","0 points — it is legal","4 points","A fine but no points"],x:"Couper par une station-service pour éviter le feu = infraction à 2 points au NJ. Piège : beaucoup croient que c'est juste malin — c'est verbalisable.",xe:"Cutting through a gas station to dodge a light is a 2-point violation in NJ. Trap: many think it's just clever — it's ticketable."},
{w:'points',q:"Driving so slowly that you block the normal flow of traffic costs:",a:["2 points","0 points — slow driving is never penalized","5 points","4 points"],x:"Bloquer le trafic en roulant trop lentement = 2 points. Piège : 'lent = prudent = jamais puni' est faux — la lenteur excessive est une infraction.",xe:"Blocking traffic by driving too slowly = 2 points. Trap: 'slow = safe = never punished' is false — impeding traffic is a violation."},
{w:'points',q:"A SECOND handheld cell phone offense within 10 years is fined:",a:["$400–$600","$200–$400","$600–$800","$100 flat"],x:"L'échelle : 200–400 $, puis 400–600 $, puis 600–800 $ + 3 points + suspension possible. Piège : le test te donne le montant de la 1re ou 3e offense comme leurre.",xe:"The ladder: $200–$400, then $400–$600, then $600–$800 plus 3 points and possible suspension. Trap: the test baits you with the 1st- or 3rd-offense amounts."},
{w:'points',q:"Driving a vehicle on a sidewalk costs:",a:["2 points","5 points","0 points — it is only a parking matter","3 points"],x:"Rouler sur le trottoir = 2 points. Piège : ce n'est pas une histoire de stationnement, c'est une infraction de conduite à points.",xe:"Driving on a sidewalk = 2 points. Trap: it's not a parking matter — it's a moving violation with points."},
{w:'points',q:"Failure to obey the direction of a police officer costs:",a:["2 points","5 points","0 points but an automatic suspension","4 points"],x:"Ignorer les instructions d'un policier = 2 points. Piège : pas de suspension automatique, mais des points bien réels sur ton dossier.",xe:"Ignoring a police officer's direction = 2 points. Trap: no automatic suspension, but very real points on your record."},
{w:'points',q:"Completing an MVC-approved Driver Improvement Program (when required by the MVC) removes:",a:["Up to 3 points","Up to 2 points","All your points","Up to 6 points"],x:"Programme Driver Improvement du MVC = jusqu'à 3 points en moins. Piège : le stage volontaire de conduite défensive n'en enlève que 2 — ne confonds pas les deux.",xe:"The MVC Driver Improvement Program removes up to 3 points. Trap: the voluntary defensive driving course only removes 2 — don't confuse the two."},
{w:'share',q:"Two vehicles arrive at the same time at an intersection with NO signs or signals. Who yields?",a:["The driver on the left yields to the driver on the right","The driver on the right yields to the driver on the left","The vehicle on the wider road yields","Whoever is turning goes first"],x:"Sans panneaux : priorité à DROITE — celui de gauche cède. Piège : les distracteurs inversent la règle ou inventent une histoire de largeur de route.",xe:"No signs: yield to the RIGHT — the driver on the left gives way. Trap: distractors flip the rule or invent a road-width story."},
{w:'share',q:"A driver's left arm bent at the elbow, hand pointing UP out the window, signals:",a:["A right turn","A left turn","Stop or slow down","A lane change to the left"],x:"Bras plié vers le HAUT = virage à DROITE. Rappel : tendu droit = gauche, vers le bas = stop/ralentir. Piège : le test mélange les trois positions.",xe:"Arm bent UPWARD = RIGHT turn. Reminder: straight out = left, downward = stop/slow. Trap: the test shuffles the three positions."},
{w:'share',q:"In New Jersey, bicyclists riding two abreast (side by side) is:",a:["Legal when traffic is not impeded","Always illegal — single file only","Legal only in bike lanes","Legal only for riders under 17"],x:"Deux cyclistes côte à côte, c'est LÉGAL tant que ça ne gêne pas la circulation. Piège : 'toujours en file indienne' est faux au NJ.",xe:"Two cyclists side by side is LEGAL as long as traffic isn't impeded. Trap: 'always single file' is false in NJ."},
{w:'share',q:"A pedestrian crosses mid-block, far from any crosswalk. Legally:",a:["The pedestrian must yield to vehicles, but you must still use due care to avoid hitting them","You have absolute right-of-way","You must stop and wave them across","The pedestrian always has the right-of-way anywhere"],x:"Hors passage piéton, c'est au piéton de céder — mais tu dois QUAND MÊME tout faire pour l'éviter. Piège : les deux extrêmes ('priorité absolue' dans un sens ou l'autre) sont faux.",xe:"Outside a crosswalk the pedestrian must yield — but you must STILL use due care to avoid them. Trap: both extremes ('absolute right-of-way' either way) are wrong."},
{w:'share',q:"A motorcycle ahead of you has had its turn signal blinking for a long time without turning. Why be extra careful?",a:["Many motorcycle signals are not self-canceling — the rider may have forgotten it","Motorcycle signals blink only during actual turns","It means the motorcycle is disabled","It is a signal for you to pass"],x:"Les clignotants de moto ne s'éteignent souvent PAS tout seuls — le motard a peut-être oublié. Piège : ne dépasse pas en supposant qu'il va vraiment tourner (ou pas).",xe:"Motorcycle signals often do NOT self-cancel — the rider may have forgotten it. Trap: don't pass assuming they will (or won't) actually turn."},
{w:'share',q:"A freight train traveling at 55 mph needs about how far to stop?",a:["A mile or more","About 500 feet","About the same as a loaded truck","A quarter mile"],x:"Un train de marchandises à 55 mph a besoin d'UN MILE ou plus pour s'arrêter — il ne peut jamais te céder le passage. Piège : le comparer à un camion est très en dessous de la réalité.",xe:"A freight train at 55 mph needs A MILE or more to stop — it can never yield to you. Trap: comparing it to a truck wildly underestimates it."},
{w:'share',q:"Which of these is ILLEGAL in New Jersey?",a:["Driving with a television screen visible to the driver","Driving barefoot","Eating while driving","Driving with interior dome light on"],x:"Un écran TV visible du conducteur est INTERDIT par la loi NJ. Piège : conduire pieds nus ou manger, c'est déconseillé mais pas illégal en soi.",xe:"A TV screen visible to the driver is BANNED by NJ law. Trap: barefoot driving or eating is unwise but not itself illegal."},
{w:'surv',q:"The recommended steering wheel hand position is now:",a:["9 and 3 o'clock","10 and 2 o'clock","8 and 4 o'clock","One hand at 12"],x:"Aujourd'hui c'est 9 h et 3 h — plus sûr avec les airbags. Piège : le vieux '10 h 10' est LA mauvaise réponse classique.",xe:"It's now 9 and 3 o'clock — safer with airbags. Trap: the old '10 and 2' is THE classic wrong answer."},
{w:'surv',q:"Your FRONT wheels skid and the car won't turn (plowing straight). You should:",a:["Ease off the gas and let the front wheels regain grip — don't slam the brakes","Steer harder into the turn","Brake hard immediately","Accelerate to pull through the curve"],x:"Dérapage AVANT : lève le pied et laisse les roues raccrocher — braquer plus fort ou freiner à fond aggrave tout. Piège : la consigne 'tourner dans le dérapage' vaut pour l'ARRIÈRE.",xe:"FRONT-wheel skid: ease off the gas and let the wheels regrip — steering harder or braking hard makes it worse. Trap: 'steer into the skid' applies to REAR skids."},
{w:'surv',q:"A car is coming head-on in YOUR lane. Your best move is to:",a:["Slow down, steer RIGHT toward the shoulder, and honk/flash your lights","Swerve left into the oncoming lane to go around","Brake to a full stop in your lane","Speed up to get past them"],x:"Toujours à DROITE vers l'accotement, en ralentissant et klaxonnant. Piège : passer à gauche = le conducteur peut se réveiller et revenir dans sa voie — droit sur toi.",xe:"Always go RIGHT toward the shoulder while slowing and honking. Trap: swerving left is fatal if the driver snaps awake and returns to their lane — straight into you."},
{w:'surv',q:"A crash is unavoidable. At speed, which choice does the manual recommend?",a:["Steer to avoid — a glancing blow or hitting something soft beats a head-on hit","Lock the brakes and hope","Aim for the most solid object to stop fastest","Close your eyes and brace"],x:"Si l'impact est inévitable : DIRIGE — un choc en biais ou contre un objet mou vaut mieux qu'un frontal. Piège : freiner à mort en ligne droite n'est pas toujours la meilleure option.",xe:"If impact is unavoidable: STEER — a glancing blow or soft object beats head-on. Trap: locking the brakes in a straight line isn't always the best option."},
{w:'surv',q:"You hit a parked, unattended vehicle. You must:",a:["Try to find the owner, or leave a note with your name, address and plate number — then report it","Wait 10 minutes, then leave","Leave if the damage looks minor","Only call your insurance company later"],x:"Voiture garée touchée : trouve le propriétaire OU laisse un mot (nom, adresse, plaque) et signale-le. Piège : partir 'parce que c'est mineur' = délit de fuite.",xe:"Hit a parked car: find the owner OR leave a note (name, address, plate) and report it. Trap: leaving 'because it's minor' = hit and run."},
{w:'surv',q:"Statement check: 'Hazard (four-way) flashers make double parking legal, and honking is the right way to greet friends.' This is:",a:["False on both counts — flashers signal a disabled/hazardous vehicle, and the horn is for warnings only","True for the flashers, false for the horn","False for the flashers, true for the horn","True on both counts"],x:"Doublement faux : les warnings signalent un danger ou une panne, jamais un stationnement interdit ; le klaxon sert à AVERTIR, pas à saluer. Piège : les réponses moitié-vraies.",xe:"False twice: flashers signal a hazard or breakdown, never legalize bad parking; the horn is for WARNING, not greeting. Trap: the half-true options."},
{w:'gdl',q:"A New Jersey examination permit is valid for:",a:["2 years","6 months","1 year","90 days"],x:"Le permis d'examen est valable 2 ANS. Piège : 6 mois, c'est la durée de pratique supervisée minimale sous 21 ans — pas la validité du permis.",xe:"The examination permit is valid for 2 YEARS. Trap: 6 months is the minimum supervised practice period under 21 — not the permit's validity."},
{w:'gdl',q:"If you fail the road test, you must wait at least ___ before taking it again.",a:["2 weeks","1 week","30 days","3 days"],x:"Échec au road test = minimum 2 semaines d'attente avant de repasser. Piège : ni 1 semaine ni 30 jours — exactement deux semaines minimum.",xe:"Fail the road test = at least a 2-week wait before retaking. Trap: not 1 week, not 30 days — a two-week minimum."},
{w:'gdl',q:"The fine for violating any GDL restriction (curfew, passengers, etc.) is:",a:["$100","$54","$250","$500"],x:"Chaque violation GDL coûte 100 $. Piège : ne confonds pas avec l'amende décalcomanie non affichée qui est distincte.",xe:"Each GDL restriction violation costs $100. Trap: don't confuse it with the separate decal-display fine."},
{w:'gdl',q:"Without taking a behind-the-wheel driver education course, the earliest you can get an examination permit is age:",a:["17","16","18","16 and a half"],x:"Sans cours de conduite : permis d'examen à 17 ans. Piège : 16 ans, c'est seulement le SPECIAL learner permit, qui exige le cours avec moniteur.",xe:"Without driver's ed: examination permit at 17. Trap: 16 is only for the SPECIAL learner permit, which requires the instructor course."},
{w:'gdl',q:"After a suspension ends, getting your license back requires paying a restoration fee of:",a:["$100","$50","$25","$500"],x:"Frais de restauration après suspension : 100 $. Piège : la suspension ne se lève pas toute seule à la fin — tu dois payer et faire restaurer.",xe:"Restoration fee after a suspension: $100. Trap: the suspension doesn't lift by itself — you must pay and have the license restored."},
{w:'gdl',q:"When practicing with a permit, your supervising driver must sit:",a:["In the front passenger seat beside you","Anywhere in the vehicle","In the back seat to observe","In the front or back, as long as they are awake"],x:"L'accompagnateur doit être ASSIS À CÔTÉ de toi, siège passager avant. Piège : 'n'importe où dans la voiture' ne compte pas comme supervision.",xe:"The supervising driver must sit BESIDE you in the front passenger seat. Trap: 'anywhere in the car' does not count as supervision."},
/* ================ ANALOGUES NJ des pièges DVSA + divers ================ */
{w:'share',q:"You are driving on a one-way street with two or more lanes of traffic. Passing another vehicle on the RIGHT is:",a:["Legal, when the road is wide enough and the movement can be made safely","Always illegal in New Jersey","Legal only for emergency vehicles","Legal only if the other driver waves you through"],x:"Piège classique ! Sur une rue à sens unique avec 2 voies ou plus, dépasser par la DROITE est légal au NJ (39:4-85) — à condition de rester sur la chaussée et que ce soit sûr. Jamais par l'accotement !",xe:"Under NJ law (39:4-85), you may pass on the right on a one-way street or a road with two or more lanes moving in the same direction, when the roadway is unobstructed and wide enough — but never by driving off the pavement."},
{w:'surv',q:"While driving, you feel a constant vibration or shaking in the steering wheel. The most likely cause is:",a:["Wheels that are out of balance (or front-end misalignment)","Low windshield washer fluid","A weak battery","Worn brake light bulbs"],x:"Un volant qui vibre = roues mal équilibrées ou train avant désaligné. Ça use tes pneus et fatigue la direction — file chez le mécano, ne l'ignore pas !",xe:"Unbalanced wheels or poor front-end alignment cause steering-wheel vibration, uneven tire wear and steering trouble — have the vehicle checked promptly."},

/* ================ FOURNÉE TEST RÉEL (questions rapportées par le joueur) ================ */
{w:'dist',q:"The most common type of parking on city streets — and the one that takes the most practice for a new driver — is:",a:["Parallel parking","Angle parking","Downhill parking","Uphill parking"],x:"Le créneau (parallel parking) : le plus courant en ville et celui qui demande le plus d'entraînement. Roues à 6 pouces max du trottoir.",xe:"Parallel parking is the most common city parking and takes the most practice. Wheels within 6 inches of the curb."},
{w:'gdl',q:"The driving hours of a GDL permit or probationary license holder under 21 are restricted to:",a:["5:01 a.m. to 11:00 p.m.","6:01 a.m. to midnight","5:01 a.m. to midnight","No restrictions apply"],x:"Formulé à l'endroit : tu peux conduire de 5h01 à 23h00. Autrement dit, interdit entre 23h01 et 5h00. Le test pose la question dans les DEUX sens !",xe:"Stated positively: you may drive from 5:01 a.m. to 11:00 p.m. — i.e. banned 11:01 p.m. to 5:00 a.m. The test asks it BOTH ways!"},
{w:'gdl',q:"During the road test, the applicant may be tested on:",a:["All of these: steering properly, nearing corners and intersections, stopping and turning","Steering properly only","Nearing corners and intersections only","Stopping and turning only"],x:"L'examen route teste TOUT : tenue du volant, approche des intersections, arrêts et virages. Réponse « all of the answers ».",xe:"The road test covers EVERYTHING: steering, approaching corners and intersections, stopping and turning. Answer: all of the above."},
{w:'signs',q:"What color combination is used on signs indicating the road is shared with pedestrians and bicyclists?",a:["Yellow-green","Yellow-orange","Orange-red","Orange"],x:"JAUNE-VERT fluo = piétons, cyclistes, écoliers. Une couleur récente et très visible. Piège : l'orange, c'est les travaux.",xe:"Fluorescent YELLOW-GREEN = pedestrians, cyclists, school crossings. A newer high-visibility color. Trap: orange is for work zones."},
{w:'signs',q:"When the pavement is marked with two centerlines, one solid and one broken:",a:["Passing is permitted only on the side with the broken line","Passing is permitted on both sides when clear","Passing is not permitted on either side","Passing is permitted at any time"],x:"Une continue + une discontinue : seul le côté avec la ligne DISCONTINUE peut doubler. Si la continue est de ton côté, tu restes derrière.",xe:"One solid + one broken: only the side with the BROKEN line may pass. If the solid line is on your side, stay behind."},
{w:'share',q:"If another motorist is passing you, you should:",a:["Slow down to make the pass easier for the other motorist","Speed up so the motorist cannot complete the pass","Flash your lights and beep your horn","Continue at the same speed and signal oncoming traffic"],x:"Quand on te double : RALENTIS pour raccourcir la manœuvre. Accélérer est illégal et dangereux — tu piégerais l'autre en face du trafic.",xe:"When being passed: SLOW DOWN to shorten the maneuver. Speeding up is illegal and dangerous — you'd trap them in oncoming traffic."},
{w:'booze',q:"If a motorist has a BAC of 0.10%, the risk of causing a crash is:",a:["6 times greater","No different","Doubled","Tripled"],x:"L'échelle du risque à connaître PAR CŒUR : 0.05 % = ×2 · 0.10 % = ×6 · 0.15 % = ×25. Trois chiffres, trois questions au test.",xe:"The risk ladder to know BY HEART: 0.05% = ×2 · 0.10% = ×6 · 0.15% = ×25. Three numbers, three test questions."},
{w:'booze',q:"If a motorist reaches a BAC of 0.15%, the risk of causing a crash is:",a:["25 times greater","Double","6 times greater","10 times greater"],x:"0.15 % = 25 FOIS plus de risques. Piège : ne confonds pas avec ×6 (qui est 0.10 %).",xe:"0.15% = 25 TIMES the risk. Trap: don't mix it up with ×6 (which is 0.10%)."},
{w:'booze',q:"The risk of causing a crash with a BAC slightly above 0.05% is:",a:["Doubled","Tripled","Four times as great","Six times as great"],x:"Juste au-dessus de 0.05 %, le risque est déjà DOUBLÉ — bien avant la limite légale de 0.08 %.",xe:"Just above 0.05% the risk is already DOUBLED — well before the 0.08% legal limit."},
{w:'booze',q:"The highest number of people arrested for drunk driving had been drinking:",a:["Beer","Whiskey","Mixed drinks","Wine"],x:"La BIÈRE arrive en tête des arrestations pour conduite en état d'ivresse. Parce qu'on la croit inoffensive — 12 oz de bière = 1 verre standard.",xe:"BEER tops the list in drunk-driving arrests — because people think it's harmless. 12 oz of beer = one standard drink."},
{w:'booze',q:"If a person gets drunk in your home and then has a crash after leaving, you could:",a:["Become involved in a lawsuit","Not be held responsible in any way","Only be charged if you served the last drink","Be fined $250 automatically"],x:"Responsabilité de l'hôte (« social host liability ») : tu peux être traîné en justice si ton invité repart ivre et provoque un accident.",xe:"Social host liability: you can be dragged into a lawsuit if a guest leaves your home drunk and crashes."},
{w:'booze',q:"The penalty for refusing to take a breath test in New Jersey is equivalent to driving with a BAC of:",a:["0.10%","0.08%","0.05%","0.15%"],x:"Refuser l'éthylotest = sanctions équivalentes à un BAC de 0.10 %. Refuser ne te sauve donc de rien, au contraire.",xe:"Refusing the breath test brings penalties equivalent to a 0.10% BAC. Refusing saves you nothing."},
{w:'signs',q:"The shape of a yield sign is:",a:["A downward-pointing triangle","An octagon","A diamond","A circle"],x:"YIELD = triangle pointe en bas. Piège basique qui fait tomber du monde : l'octogone, c'est le STOP ; le rond, c'est le passage à niveau.",xe:"YIELD = downward triangle. A basic trap that catches people: the octagon is STOP; the circle is a railroad warning."},
{w:'signs',q:"What is the order of the colors on a vertical traffic light, from top to bottom?",a:["Red, yellow, green","Green, yellow, red","Yellow, green, red","Red, green, yellow"],x:"De haut en bas : ROUGE, JAUNE, VERT. Essentiel si le feu est de travers ou si tu es daltonien — la position ne ment jamais.",xe:"Top to bottom: RED, YELLOW, GREEN. Vital if a signal hangs sideways or you're colorblind — position never lies."},
{w:'points',q:"If you drive on a suspended license and are involved in a crash that injures another person, you face:",a:["A fine, continued suspension and a potential jail sentence","A $50 fine only","An additional 1-year suspension and nothing more","A $25 fine"],x:"Suspendu + accident avec blessé = amende, suspension prolongée ET prison possible. La combinaison la plus lourde du barème.",xe:"Suspended + injury crash = fine, extended suspension AND possible jail. The heaviest combination in the book."},
{w:'points',q:"If your driving privilege is suspended, you:",a:["May not drive for any reason until the suspension ends and your license is restored","May drive to and from work only","May drive passenger vehicles but not commercial ones","May obtain a special work license"],x:"Suspendu = ZÉRO conduite, pour n'importe quel motif, jusqu'à restauration. Il n'existe pas de « permis de travail » au NJ.",xe:"Suspended = NO driving for any reason until restored. There is no 'work license' in NJ."},
{w:'points',q:"When your driving privilege is restored after a points suspension, you are on probation for:",a:["1 year","6 months","9 months","2 years"],x:"Après une suspension pour points : 1 AN de probation. Idem après un Driver Improvement Program. Retiens : 1 an partout.",xe:"After a points suspension: 1 YEAR of probation. Same after a Driver Improvement Program. Remember: 1 year across the board."},
{w:'points',q:"After completing an MVC Driver Improvement Program and having your license reinstated, you are on probation for:",a:["1 year","3 months","6 months","9 months"],x:"Driver Improvement Program terminé = 1 an de probation. Une nouvelle infraction pendant cette période et ça repart en suspension.",xe:"Driver Improvement Program done = 1 year of probation. A new violation in that window sends you back to suspension."},
{w:'points',q:"The penalty for altering a driver license, or presenting an altered license, is:",a:["Up to a $1,000 fine, up to 6 months imprisonment, and loss of driving privilege","A $100 fine and 30 days imprisonment","A $500 fine and 6 months imprisonment","A warning for a first offense"],x:"Falsifier un permis : jusqu'à 1 000 $, 6 mois de prison ET perte du permis. La fraude documentaire ne rigole pas.",xe:"Altering a license: up to $1,000, 6 months in jail AND loss of your license. Document fraud is no joke."},
{w:'points',q:"Fines will be imposed on a motorist for which of the following?",a:["All of these: idling more than 3 minutes, violating the Move Over Law, failing to remove snow or ice","Idling more than 3 minutes only","Violating the Move Over Law only","Failing to remove snow or ice only"],x:"Les trois sont verbalisables : moteur au ralenti plus de 3 MINUTES, Move Over Law, et neige/glace non déneigée. Réponse « all ».",xe:"All three are ticketable: idling over 3 MINUTES, Move Over Law, and failing to clear snow/ice. Answer: all of them."},
{w:'points',q:"Driving privileges will be postponed or suspended for a person aged 13 to 21 who is convicted of:",a:["All of these: buying alcohol, drunk driving, setting false alarms, or graffiti","Buying alcohol or drunk driving only","Setting false alarms only","Graffiti only"],x:"Entre 13 et 21 ans, même des délits SANS voiture (fausses alertes, graffitis, achat d'alcool) coûtent le permis. Surprenant mais au programme.",xe:"Between 13 and 21, even non-driving offenses (false alarms, graffiti, buying alcohol) cost you the license. Surprising but tested."},
{w:'share',q:"Under New Jersey law, inline skaters, skateboarders and bicyclists have the same rights and responsibilities as:",a:["A moving motor vehicle","Pedestrians","Vehicles parked on the street","None of these"],x:"Rollers, skateboards et vélos = traités comme un VÉHICULE EN MOUVEMENT, pas comme des piétons. Piège très fréquent.",xe:"Skaters, skateboarders and cyclists are treated as a MOVING MOTOR VEHICLE, not as pedestrians. A very common trap."},
{w:'share',q:"A motorist signaling a right turn must yield to:",a:["All of these: pedestrians, bicyclists, and inline skaters or skateboarders","Pedestrians only","Bicyclists only","Inline skaters only"],x:"Avant de tourner à droite, tu cèdes à TOUT LE MONDE : piétons, cyclistes, rollers, skateurs. Le fameux « right hook » tue.",xe:"Before turning right, yield to EVERYONE: pedestrians, cyclists, skaters. The 'right hook' kills."},
{w:'share',q:"When driving or stopping behind a large truck or bus, you should:",a:["Leave enough space so the truck driver can spot you in their mirrors","Stop as close to the rear as possible so no one cuts in","Go around it on the right because it starts up slowly","Blow your horn to signal your presence"],x:"Derrière un poids lourd : laisse de l'espace pour qu'il te VOIE dans ses rétroviseurs. Collé = invisible = dangereux.",xe:"Behind a big rig: leave space so the driver can SEE you in the mirrors. Tailgating = invisible = dangerous."},
{w:'share',q:"You should increase your following distance behind a large vehicle so that its driver:",a:["Can see your vehicle in the side mirrors","Has room to stop","Can maneuver easily","Can read your license plate"],x:"La raison exacte : pour qu'il te voie dans ses rétroviseurs LATÉRAUX (un camion n'a pas de rétro intérieur !). Piège : « pour qu'il ait de la place pour s'arrêter » sonne bien mais c'est faux.",xe:"The exact reason: so they can see you in the SIDE mirrors (a truck has no rearview mirror!). Trap: 'so they have room to stop' sounds right but isn't the answer."},
{w:'share',q:"The area on all four sides of a truck where the driver cannot see you is called:",a:["The No-Zone","The danger zone","The safe zone","The crush zone"],x:"Le terme officiel est NO-ZONE (les quatre angles morts d'un camion). Piège : « blind spot » est vrai en général mais le manuel demande « No-Zone ».",xe:"The official term is the NO-ZONE (a truck's four blind areas). Trap: 'blind spot' is generally true, but the manual wants 'No-Zone'."},
{w:'share',q:"In adverse weather, a truck can take how much longer to stop?",a:["About 25% longer","About 50% longer","About 70% longer","About 100% longer"],x:"Mauvais temps : un camion met environ 25 % de distance en PLUS pour s'arrêter. Piège : 50 % et 100 % paraissent plus impressionnants mais c'est 25 %.",xe:"In bad weather a truck needs about 25% MORE distance to stop. Trap: 50% and 100% sound more dramatic, but it's 25%."},
{w:'surv',q:"Approaching an uncontrolled intersection (no signs or signals), you should:",a:["Reduce speed and be ready to stop","Come to a full stop every time","Maintain your speed and look straight ahead","Speed up to clear it quickly"],x:"Intersection sans panneaux : RALENTIS et sois prêt à t'arrêter. Pas d'arrêt obligatoire, mais on arrive au pas et priorité à droite.",xe:"Uncontrolled intersection: SLOW DOWN and be ready to stop. No mandatory stop, but crawl in and yield to the right."},
{w:'surv',q:"On snow-covered roads, a good following distance is at least:",a:["6 seconds or more","2 seconds or more","3 seconds or more","12 seconds or more"],x:"Neige = 6 SECONDES minimum (contre 3 s+ par temps sec). Piège : 3 secondes, c'est la règle normale ; 12 s, c'est la distance de SCAN visuel.",xe:"Snow = at least 6 SECONDS (vs 3+ in the dry). Trap: 3 seconds is the normal rule; 12 seconds is the visual SCAN distance."},
{w:'surv',q:"The 'three-seconds-plus' rule is used to:",a:["Maintain a safe following distance at any speed","Time traffic lights","Come to a complete stop","Bring your vehicle out of a skid"],x:"La règle des 3 secondes+ sert à garder une distance de sécurité, à N'IMPORTE QUELLE vitesse : tu comptes 3 s entre le passage d'un repère fixe.",xe:"The three-seconds-plus rule keeps a safe following distance at ANY speed: count 3 seconds between the car ahead and a fixed marker."},
{w:'surv',q:"A motorist should be especially cautious in farm country or open land because of:",a:["Unexpected crossings of livestock and deer","The absence of traffic lights","Narrow, bumpy roads","High-speed traffic"],x:"En zone rurale, le vrai danger, c'est le bétail et les cerfs qui traversent sans prévenir. Surtout à l'aube et au crépuscule.",xe:"In farm country the real danger is livestock and deer crossing without warning — especially at dawn and dusk."},
{w:'surv',q:"If you are angry or excited before driving, you should:",a:["Give yourself time to cool off before driving","Turn on the radio to distract yourself","Drive slowly and use your horn to warn others","Drive anyway — emotions don't affect driving"],x:"Les émotions dégradent la conduite autant que la fatigue. Colère ou excitation : laisse retomber AVANT de prendre le volant.",xe:"Emotions impair driving as much as fatigue. Angry or excited: cool off BEFORE you take the wheel."},
{w:'surv',q:"To avoid hydroplaning on a wet road, you should:",a:["Slow down and drive on the highest point of the road","Apply the brakes firmly","Increase your speed to cut through the water","Keep exactly the same speed"],x:"Anti-aquaplaning : ralentis et roule sur le POINT LE PLUS HAUT de la chaussée (l'eau s'écoule vers les bords). Astuce peu connue mais dans le manuel.",xe:"Anti-hydroplaning: slow down and drive on the HIGHEST part of the road (water drains to the edges). Little-known, but it's in the manual."},
{w:'surv',q:"When approaching a railroad crossing with flashing lights, you must stop no closer than:",a:["15 feet from the nearest rail","5 feet from the nearest rail","25 feet from the nearest rail","50 feet from the nearest rail"],x:"Arrêt entre 15 et 50 ft des rails : donc jamais à MOINS de 15 ft. Piège : 50 ft, c'est la distance de STATIONNEMENT interdit près d'un passage à niveau — deux règles différentes !",xe:"Stop between 15 and 50 ft from the rails: never closer than 15 ft. Trap: 50 ft is the no-PARKING distance near a crossing — two different rules!"},
{w:'dist',q:"Approximately how many feet does a passenger vehicle traveling at 50 mph need to stop completely on a dry surface?",a:["About 247 feet","About 145 feet","About 193 feet","About 302 feet"],x:"À 50 mph : environ 247 pieds pour s'arrêter (perception + réaction + freinage). Presque la longueur d'un terrain de foot !",xe:"At 50 mph: about 247 feet to stop (perception + reaction + braking). Nearly the length of a football field!"},
{w:'gdl',q:"In New Jersey, you must be at least ___ years old to register a motor vehicle.",a:["17","16","18","21"],x:"Immatriculer un véhicule à son nom : 17 ans minimum au NJ. Piège : 16 ans, c'est l'âge du special learner permit.",xe:"To register a vehicle in your name: at least 17 in NJ. Trap: 16 is the special learner permit age."},
{w:'gdl',q:"Except for new vehicles, your car must be inspected:",a:["Every two years","Annually","Every six months","Every 5,000 miles"],x:"Contrôle technique NJ : tous les DEUX ans (les voitures neuves ont un délai plus long). Piège : « annually » est la mauvaise réponse la plus choisie.",xe:"NJ inspection: every TWO years (new cars get a longer initial period). Trap: 'annually' is the most-picked wrong answer."},
{w:'gdl',q:"A Special Learner Permit may be purchased by an approved instructor when the applicant:",a:["Meets all of these: is 16 but under 17, has parent/guardian consent, and is enrolled in a behind-the-wheel course","Is at least 16 and under 17 years old only","Has signed parental consent only","Is enrolled in a behind-the-wheel course only"],x:"Special learner permit : les TROIS conditions à la fois — 16 ans révolus (avant 17), accord parental, et inscription à un cours de conduite agréé.",xe:"Special learner permit: ALL THREE conditions — age 16 (before 17), parent/guardian consent, and enrollment in an approved behind-the-wheel course."},
{w:'gdl',q:"At what age may an applicant obtain a Special Learner Permit and enroll in a behind-the-wheel training course?",a:["At 16, before turning 17","At 15, before turning 16","At 14, before turning 15","At 20, before turning 21"],x:"Special learner permit : à 16 ans, avant 17 ans. C'est la voie « Early Bird » avec auto-école obligatoire.",xe:"Special learner permit: at 16, before turning 17. It's the 'Early Bird' route with mandatory driving school."},
{w:'gdl',q:"Before practice driving can begin, besides a valid insurance and registration card, the GDL driver must have:",a:["A permit validated at an MVC testing center","A probationary license","An international permit","Nothing else is required"],x:"Le permis doit être VALIDÉ (tamponné) dans un centre d'examen MVC avant toute conduite d'entraînement. Un permis non validé ne vaut rien.",xe:"The permit must be VALIDATED at an MVC testing center before any practice driving. An unvalidated permit is worthless."},
{w:'gdl',q:"How many passengers may accompany the holder of a validated GDL Special Learner Permit?",a:["Dependents plus one additional passenger, unless a parent or guardian is in the vehicle","One additional passenger only, no dependents","No passengers at all","Up to three friends"],x:"Special learner permit : personnes à charge + UN passager supplémentaire — sauf si un parent/tuteur est à bord. Même règle que le probatoire.",xe:"Special learner permit: dependents plus ONE additional passenger — unless a parent or guardian is aboard. Same rule as probationary."},
{w:'gdl',q:"If a student driver commits a traffic offense, responsibility lies with:",a:["Both the student driver and the instructor or supervising driver","The student driver only","The supervising driver only","The vehicle's owner only"],x:"Infraction pendant l'apprentissage : l'élève ET l'accompagnateur sont responsables tous les deux. C'est pour ça que le superviseur doit rester attentif.",xe:"A violation during practice: BOTH the student and the supervising driver are responsible. That's why the supervisor must stay alert."},
{w:'gdl',q:"A lost or stolen driver license, permit or non-driver ID should be reported to:",a:["The police","Your insurance company","The nearest driver testing center","The federal government"],x:"Permis perdu ou volé : on prévient la POLICE (risque d'usurpation d'identité), puis on demande un duplicata au MVC.",xe:"Lost or stolen license: report it to the POLICE (identity-theft risk), then get a duplicate from the MVC."},
{w:'gdl',q:"If you sell your car and do not buy another one, you should:",a:["Turn the license plates in to an MVC agency (or mail them to the MVC)","Keep them as a souvenir","Throw them away","Give them to a friend to use"],x:"Plaques d'immatriculation : elles appartiennent à l'État. Tu les RENDS au MVC, sinon tu restes lié au véhicule (et à ses amendes).",xe:"License plates belong to the State. Return them to the MVC, or you stay tied to the vehicle (and its tickets)."},
{w:'share',q:"Passing on the right on a road with more than one lane in your direction is allowed when:",a:["The vehicle ahead is turning left and there is room to pass safely","There is any slow-moving vehicle ahead","You are entering an intersection","There are no traffic signals"],x:"Dépassement par la droite autorisé notamment quand le véhicule devant tourne à GAUCHE et qu'il te reste de la place sur la chaussée. Jamais par l'accotement !",xe:"Passing on the right is allowed notably when the vehicle ahead is turning LEFT and there's room on the pavement. Never on the shoulder!"},
{w:'speed',q:"When driving in the city, you should:",a:["Drive slowly, yield to pedestrians, and look at least 12 seconds ahead","Drive slowly and sound the horn every 12 seconds","Speed up, yield to pedestrians and look 2 seconds ahead","Drive slowly and look only 2 seconds ahead"],x:"Conduite urbaine : lentement, priorité aux piétons, et le regard à 12 SECONDES devant (≈ 1 pâté de maisons).",xe:"City driving: slowly, yield to pedestrians, and scan 12 SECONDS ahead (about one city block)."},

/* ================ VÉRIFICATIONS & COMPLÉMENTS (2e passe joueur) ================ */
{w:'points',q:"While driving, a handheld phone may legally be used only to:",a:["Report a fire, a crash, or a medical emergency","Use GPS navigation","Send a quick text at a red light","Make a short call"],x:"Téléphone en main : UNIQUEMENT pour signaler un incendie, un accident ou une urgence médicale. Le GPS et les appels doivent être en mains-libres.",xe:"Handheld phone: ONLY to report a fire, crash or medical emergency. GPS and calls must be hands-free."},
{w:'share',q:"To turn LEFT from a two-way road onto another two-way road, you should approach the turn:",a:["As close as possible to the line nearest the center of the road","From the right-hand lane","From the shoulder","From whichever lane is emptiest"],x:"Tourner à gauche : on se serre au maximum contre la ligne centrale. Ça dégage la visibilité et laisse passer ceux qui vont tout droit.",xe:"Turning left: hug the line nearest the center. It opens up visibility and lets through traffic pass."},
{w:'share',q:"When making a right turn, you should NOT:",a:["Swing outward or into another lane while turning","Signal before the turn","Slow down before the turn","Approach as far right as possible"],x:"Virage à droite : on longe le bord droit et on ne déborde JAMAIS sur l'autre voie. Déborder = 4 points et un cycliste écrasé.",xe:"Right turn: hug the right edge and NEVER swing wide into another lane. Swinging wide = 4 points and a crushed cyclist."},
{w:'signs',q:"A single solid WHITE line painted across your lane at an intersection means:",a:["Stop behind the line when required by a signal or sign","Passing is permitted beyond this point","Traffic from both directions must stop","The lane ends ahead"],x:"La ligne blanche transversale (stop line) marque où s'arrêter. On s'arrête DERRIÈRE, jamais dessus ni au-delà.",xe:"The transverse white stop line marks where to stop. Stop BEHIND it, never on or past it."},
{w:'speed',q:"In a construction zone, motorists should:",a:["Adjust speed and position to keep space around their vehicle","Keep their normal speed to clear it faster","Ignore posted signs if no workers are visible","Move as close as possible to the cones"],x:"Zone de travaux : adapte ta vitesse ET ta position pour garder de l'espace autour de toi. Rappel : amendes DOUBLÉES.",xe:"Work zone: adjust both speed AND position to keep space around you. Remember: fines are DOUBLED."},
{w:'speed',q:"As you approach a curve, inertia makes your vehicle tend to:",a:["Keep going straight","Turn into the curve on its own","Slow down by itself","Lean toward the inside of the curve"],x:"L'inertie pousse la voiture TOUT DROIT dans le virage. D'où la règle : on freine AVANT, pas pendant.",xe:"Inertia makes the car want to keep going STRAIGHT through a curve. Hence: brake BEFORE, not during."},
{w:'surv',q:"The standard accident-prevention formula is:",a:["Be alert, be prepared, act in time","Be calm, be quick, be decisive","Be alert, be aggressive, act in time","Be prepared, be safe, be cautious"],x:"La formule du manuel : « Be alert, be prepared, act in time » — rester attentif, être prêt, agir à temps. Elle tombe telle quelle.",xe:"The manual's formula: 'Be alert, be prepared, act in time.' It shows up verbatim on the test."},
{w:'booze',q:"In New Jersey, the minimum age to purchase, possess or consume alcohol is:",a:["21","18","19","20"],x:"21 ans pour acheter, posséder OU consommer de l'alcool au NJ. En dessous, c'est aussi une suspension de permis.",xe:"21 to buy, possess OR consume alcohol in NJ. Below that, it also costs you your license."},
{w:'gdl',q:"If your license PLATES are lost or stolen, you must immediately notify:",a:["The local police","The MVC only","Your insurance company","The dealership"],x:"Plaques volées : POLICE d'abord (on peut commettre des délits avec). Piège : rendre les plaques au MVC, c'est quand on vend la voiture.",xe:"Stolen plates: POLICE first (they can be used for crimes). Trap: returning plates to the MVC is for when you sell the car."},
{w:'share',q:"Approaching a stopped ice cream truck with its flashing red lights on, you must:",a:["Stop, then pass at no more than 15 mph, watching for children","Pass at the normal speed limit","Stop and wait until the lights stop flashing","Sound your horn and continue"],x:"Camion de glaces, feux rouges : ARRÊT, puis on repart à 15 mph max. Piège : 10 mph, c'est le bus scolaire — ici c'est 15.",xe:"Ice cream truck, red lights: STOP, then pass at 15 mph max. Trap: 10 mph is the school bus — here it's 15."},
{w:'points',q:"The minimum fine for littering from a vehicle in New Jersey is:",a:["$100","$50","$250","$500"],x:"Jeter un détritus par la fenêtre : 100 $ minimum. Et jusqu'à 500 $ + travaux d'intérêt général en récidive.",xe:"Tossing litter from your car: $100 minimum. Up to $500 plus community service for repeats."},
{w:'gdl',q:"A probationary driver must enroll in a Probationary Driver Program after:",a:["Accumulating 4 or more points from moving violations during the probationary period","Any single moving violation","Turning 18","A first parking ticket"],x:"4 points ou plus pendant la période probatoire = stage Probationary Driver Program obligatoire. Piège : le seuil ordinaire de suspension, c'est 12 points.",xe:"4+ points during the probationary period = mandatory Probationary Driver Program. Trap: the ordinary suspension threshold is 12 points."},
{w:'share',q:"To share the road safely with large trucks and buses, you must understand their limitations in:",a:["Visibility, stopping distance and maneuverability","Fuel consumption and cargo type","Driver schedules and rest breaks","Paint color and plate numbers"],x:"Trois limites d'un poids lourd : ce qu'il VOIT (No-Zones), la distance pour S'ARRÊTER, et sa capacité à MANŒUVRER (virages larges).",xe:"Three truck limitations: what it SEES (No-Zones), how far it needs to STOP, and how it MANEUVERS (wide turns)."},
{w:'signs',q:"You are approaching an intersection and the light turns yellow. You should:",a:["Stop before entering the intersection if you can do so safely","Speed up to clear it before red","Sound your horn and continue","Stop immediately, even in the intersection"],x:"Jaune = arrête-toi SI tu peux le faire sans danger. Accélérer pour passer est exactement ce que le test sanctionne.",xe:"Yellow = stop IF you can do it safely. Speeding up to beat it is exactly what the test penalizes."},
{w:'points',q:"New Jersey law limits vehicle idling to no more than:",a:["3 minutes","1 minute","10 minutes","There is no limit"],x:"Moteur au ralenti : 3 MINUTES maximum (loi anti-pollution). Au-delà, c'est verbalisable.",xe:"Idling: 3 MINUTES maximum (anti-pollution law). Beyond that, it's ticketable."},
/* ---------- ajouts : chapitres du manuel MVC encore peu couverts ---------- */

{w:'signs',q:"Your light is green, but traffic is backed up and you cannot get all the way through. You should:",

{w:'signs',q:"A yellow diamond showing a car with wavy lines under it means:",

{w:'speed',q:"New Jersey law says you must REDUCE your speed when:",

{w:'speed',q:"The 65 mph speed limit in New Jersey applies:",

{w:'speed',q:"Approaching a narrow bridge or an underpass, you should:",

{w:'speed',q:"Speeding fines in New Jersey are DOUBLED in:",

{w:'dist',q:"Which of these is an ILLEGAL place to park?",

{w:'dist',q:"Parking in front of a public or private driveway is:",
