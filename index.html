  --dim:#93A3B8;          /* texte secondaire */
  --bus:#FFC61A;          /* jaune school-bus : XP, accent principal */
  --busD:#8F6D00;
  --exit:#33B268;         /* vert guide-sign : correct, GO */
  --exitD:#155C33;
  --exitP:#0F4A28;        /* fond panneau exit */
  --stop:#E5383B;         /* rouge STOP : erreur, boss */
  --stopD:#7C1215;
  --zone:#F58220;         /* orange work-zone : combo, streak */
  --shield:#4A8DE8;       /* bleu interstate : info, niveaux */
  --shieldD:#1D4E94;
  --px:'Press Start 2P',ui-monospace,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, #16233A 0%, transparent 60%),
    var(--asphalt);
  color:var(--retro);
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  min-height:100vh;
  padding-bottom:56px;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px dashed var(--bus);outline-offset:3px;border-radius:4px}
input,select{font-family:inherit;font-size:inherit;color:var(--retro);background:var(--lane2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}

/* ---------- structure ---------- */
#wrap{max-width:600px;margin:0 auto;padding:0 14px}
main#app{display:block;padding-top:14px}
.screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(#0C1118F2,#0C1118E6);
  backdrop-filter:blur(6px);
  border-bottom:3px solid var(--edge);
}
.hud-in{max-width:600px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.lvl-shield{
  flex:none;width:46px;height:50px;display:grid;place-items:center;
  background:var(--shield);
  clip-path:polygon(0 12%,15% 0,85% 0,100% 12%,100% 55%,50% 100%,0 55%);
  box-shadow:inset 0 0 0 3px #fff3;
  font-family:var(--px);font-size:13px;color:#fff;text-shadow:0 2px 0 #0006;
  padding-top:2px;
}
.hud-mid{flex:1;min-width:0}
.hud-title{font-family:var(--px);font-size:8px;letter-spacing:.5px;color:var(--bus);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.xp-lane{position:relative;height:14px;background:#000A;border:2px solid var(--edge);border-radius:7px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--busD),var(--bus));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-dash{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 14px,#0C111866 14px 22px)}
.hud-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.jchip{
  font-family:var(--px);font-size:9px;padding:5px 8px;border-radius:5px;
  background:var(--exitP);border:2px solid #fff;color:#fff;letter-spacing:.5px;
  box-shadow:0 2px 0 #0008;
}
.jchip.hot{background:var(--stopD);border-color:var(--stop);animation:pulse 1.4s infinite}
.goalchip{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.goalchip b{color:var(--bus)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- typographic bits ---------- */
.px{font-family:var(--px)}
h1.logo{font-family:var(--px);font-size:clamp(22px,7vw,34px);color:var(--bus);text-align:center;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 24px #FFC61A44;margin:10px 0 2px}
.logo-sub{font-family:var(--px);font-size:9px;color:var(--dim);text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.eyebrow{font-family:var(--px);font-size:9px;color:var(--zone);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.small{font-size:13px;color:var(--dim)}

/* dashed center-line divider */
.centerline{border:none;height:4px;margin:18px 0;background:repeating-linear-gradient(90deg,var(--bus) 0 26px,transparent 26px 46px);opacity:.5;border-radius:2px}

/* ---------- panels & buttons ---------- */
.panel{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:16px;box-shadow:0 5px 0 #00000066}
.panel+.panel{margin-top:12px}

.btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  font-family:var(--px);font-size:11px;line-height:1.6;letter-spacing:.5px;
  padding:15px 16px;border-radius:10px;border:3px solid;
  transition:transform .06s,box-shadow .06s;text-transform:uppercase;
}
.btn:active{transform:translateY(3px)}
.btn .ic{font-size:20px;flex:none;font-family:var(--sans)}
.btn .sub{display:block;font-family:var(--sans);font-size:12.5px;color:#FFFFFFB0;text-transform:none;letter-spacing:0;font-weight:400;margin-top:3px}
.btn-exit{background:var(--exitP);border-color:#fff;color:#fff;box-shadow:0 4px 0 #00000088}
.btn-exit:active{box-shadow:0 1px 0 #00000088}
.btn-bus{background:#3A2F00;border-color:var(--bus);color:var(--bus);box-shadow:0 4px 0 #00000088}
.btn-shield{background:#12253F;border-color:var(--shield);color:#CFE2FB;box-shadow:0 4px 0 #00000088}
.btn-stop{background:#2E0D0E;border-color:var(--stop);color:#FFD7D8;box-shadow:0 4px 0 #00000088}
.btn-ghost{background:var(--lane2);border-color:var(--edge);color:var(--dim);box-shadow:0 4px 0 #00000055}
.btnrow{display:flex;gap:10px}
.btnrow .btn{justify-content:center;text-align:center}
.menu{display:flex;flex-direction:column;gap:11px}

/* ---------- world cards ---------- */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.wcard{
  position:relative;background:var(--lane);border:3px solid var(--edge);border-radius:12px;
  padding:14px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  box-shadow:0 4px 0 #00000066;transition:transform .06s;text-align:left;
}
.wcard:active{transform:translateY(3px)}
.wcard .ic{font-size:26px}
.wcard .nm{font-family:var(--px);font-size:9px;line-height:1.7;color:var(--retro);text-transform:uppercase;min-height:31px}
.wcard .mastery{width:100%;display:flex;align-items:center;gap:7px}
.mring{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--exit) calc(var(--p)*1%),#000A 0);border:2px solid var(--edge)}
.mring i{width:20px;height:20px;border-radius:50%;background:var(--lane);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.wcard .beaten{position:absolute;top:8px;right:9px;font-size:15px;filter:drop-shadow(0 2px 0 #000)}
.wcard.done{border-color:var(--exit)}

/* ---------- quiz ---------- */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qprog{font-family:var(--px);font-size:9px;color:var(--dim);letter-spacing:1px}
.combo{font-family:var(--px);font-size:10px;color:var(--zone);display:flex;align-items:center;gap:5px}
.combo .f{font-size:15px;animation:flame .5s infinite alternate}
@keyframes flame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
.qbar{height:8px;background:#000A;border:2px solid var(--edge);border-radius:5px;overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--shield);transition:width .3s}
.qcard{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:18px 16px;box-shadow:0 5px 0 #00000066}
.qtext{font-size:17.5px;font-weight:650;line-height:1.45;text-wrap:balance}
.qsign{display:flex;justify-content:center;margin:4px 0 12px}
.qsign svg{filter:drop-shadow(0 4px 6px #000A)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--lane2);border:3px solid var(--edge);border-radius:10px;
  padding:12px 13px;font-size:15px;line-height:1.4;color:var(--retro);
  box-shadow:0 3px 0 #00000055;transition:transform .05s,border-color .1s,background .1s;
}
.opt:not(:disabled):active{transform:translateY(2px)}
.opt .key{
  flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;
  font-family:var(--px);font-size:10px;background:#000A;color:var(--dim);border:2px solid var(--edge);
}
.opt.sel-ok{background:#0F3A22;border-color:var(--exit);animation:popOk .3s}
.opt.sel-ok .key{background:var(--exit);color:#fff;border-color:var(--exit)}
.opt.sel-ko{background:#3A1113;border-color:var(--stop)}
.opt.sel-ko .key{background:var(--stop);color:#fff;border-color:var(--stop)}
.opt.reveal{border-color:var(--exit);border-style:dashed}
.opt:disabled{opacity:.92;cursor:default}
.opt.fade{opacity:.45}
@keyframes popOk{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

.verdict{font-family:var(--px);font-size:13px;margin-top:15px;letter-spacing:.5px}
.verdict.ok{color:var(--exit)}
.verdict.ko{color:var(--stop)}
.exp{
  margin-top:11px;background:#241C05;border:2px dashed var(--bus);border-radius:10px;
  padding:12px 13px;font-size:14.5px;line-height:1.5;color:#F5E8BE;
}
.exp .tag{font-family:var(--px);font-size:8px;color:var(--bus);display:block;margin-bottom:6px;letter-spacing:1px}
.nextbar{margin-top:14px}

/* shake on wrong */
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* floating +XP */
.floatxp{
  position:fixed;z-index:80;font-family:var(--px);font-size:14px;color:var(--bus);
  text-shadow:0 2px 0 #000;pointer-events:none;animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}

/* ---------- boss ---------- */
.bosshead{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.bossface{font-size:42px;filter:drop-shadow(0 3px 0 #000);animation:bossIdle 2.2s ease-in-out infinite}
@keyframes bossIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bossface.hit{animation:bossHit .35s}
@keyframes bossHit{0%{transform:scale(1) rotate(0);filter:drop-shadow(0 3px 0 #000) brightness(2)}50%{transform:scale(.86) rotate(-8deg)}100%{transform:scale(1)}}
.bossname{font-family:var(--px);font-size:11px;color:var(--stop);line-height:1.7}
.hpbar{height:18px;background:#000A;border:3px solid var(--stopD);border-radius:9px;overflow:hidden;position:relative}
.hpfill{height:100%;background:linear-gradient(90deg,#8C1013,var(--stop));transition:width .4s cubic-bezier(.2,.8,.2,1)}
.hplabel{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--px);font-size:8px;color:#fff;text-shadow:0 1px 0 #000}
.hearts{font-size:19px;letter-spacing:3px;margin-top:8px}
.hearts .off{opacity:.22;filter:grayscale(1)}

/* ---------- blitz ---------- */
.blitzhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.timer{font-family:var(--px);font-size:22px;color:var(--bus);font-variant-numeric:tabular-nums}
.timer.low{color:var(--stop);animation:pulse .5s infinite}
.blitzscore{font-family:var(--px);font-size:14px;color:var(--retro)}
.drillp{font-size:18px;font-weight:700;line-height:1.45;text-wrap:balance;min-height:80px;display:flex;align-items:center}
.drillp b{color:var(--bus)}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opts.grid2 .opt{justify-content:center;text-align:center;font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:16px 8px}

/* ---------- results / big numbers ---------- */
.bigscore{font-family:var(--px);font-size:40px;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.bigscore.ok{color:var(--exit)}
.bigscore.ko{color:var(--stop)}
.stamp{
  font-family:var(--px);font-size:19px;text-align:center;padding:14px 10px;margin:14px auto;
  max-width:340px;border:4px solid;border-radius:10px;transform:rotate(-3deg);letter-spacing:2px;
}
.stamp.ok{color:var(--exit);border-color:var(--exit);background:#0F3A2244;text-shadow:0 0 16px #33B26866}
.stamp.ko{color:var(--stop);border-color:var(--stop);background:#3A111344}
.statrow{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--lane2);border:2px solid var(--edge);border-radius:10px;padding:11px 8px;text-align:center}
.stat .v{font-family:var(--px);font-size:15px;color:var(--bus);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.stars{text-align:center;font-size:34px;letter-spacing:8px;margin:6px 0}
.stars .off{opacity:.2;filter:grayscale(1)}

/* ---------- grimoire ---------- */
.gsec{margin-bottom:16px}
.gsec h3{font-family:var(--px);font-size:10px;color:var(--zone);margin-bottom:9px;letter-spacing:1px;text-transform:uppercase}
.gtable{width:100%;border-collapse:collapse;font-size:14px}
.gtable td{padding:8px 10px;border-bottom:1px dashed var(--edge);vertical-align:top}
.gtable td:last-child{text-align:right;font-family:var(--mono);font-weight:700;color:var(--bus);white-space:nowrap;font-variant-numeric:tabular-nums}
.gtable tr:last-child td{border-bottom:none}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:13px 11px;text-align:center;box-shadow:0 4px 0 #00000055}
.badge .bic{font-size:30px;display:block;margin-bottom:7px;filter:drop-shadow(0 2px 0 #000)}
.badge .bnm{font-family:var(--px);font-size:8px;line-height:1.7;color:var(--retro);text-transform:uppercase}
.badge .bds{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.35}
.badge.locked{opacity:.45}
.badge.locked .bic{filter:grayscale(1) drop-shadow(0 2px 0 #000)}
.badge.new{border-color:var(--bus);animation:popOk .4s}

/* ---------- level-up overlay ---------- */
#overlay{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:#0C1118E0;padding:20px;
}
#overlay.show{display:grid}
.ov-card{background:var(--lane);border:4px solid var(--bus);border-radius:16px;padding:28px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 0 60px #FFC61A33;animation:ovIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes ovIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-card .oic{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 0 #000)}
.ov-card h2{font-family:var(--px);font-size:15px;color:var(--bus);margin-bottom:10px;line-height:1.8}
.ov-card p{color:var(--dim);font-size:14.5px;margin-bottom:16px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);z-index:95;background:var(--lane2);border:3px solid var(--bus);color:var(--retro);border-radius:10px;padding:10px 16px;font-size:14px;transition:transform .3s;max-width:90vw;box-shadow:0 5px 0 #0008}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast b{color:var(--bus)}

/* ---------- fx canvas ---------- */
#fx{position:fixed;inset:0;z-index:85;pointer-events:none}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--edge)}
.setrow:last-child{border-bottom:none}
.setrow label{font-size:14.5px}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbtn{font-family:var(--px);font-size:10px;color:var(--dim);padding:8px 10px;border:2px solid var(--edge);border-radius:8px;background:var(--lane)}
.scrtitle{font-family:var(--px);font-size:12px;color:var(--retro);letter-spacing:1px;text-transform:uppercase}

.footnote{margin-top:22px;font-size:11.5px;color:#5F6F84;line-height:1.55;text-align:center}
.footnote a{color:var(--shield)}

@media (min-width:640px){
  body{font-size:16.5px}
  .worlds{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>

<body>
<div id="hud"></div>
<div id="wrap"><main id="app" aria-live="polite"></main></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ============================================================
   ROUTE 440 — banque de contenu
   Questions en anglais (comme l'examen réel au MVC),
   explications en français. Convention : a[0] = bonne réponse
   (l'ordre est mélangé à l'affichage).
   Basé sur le New Jersey Driver Manual — vérifie sur njmvc.gov.
   ============================================================ */

const WORLDS=[
 {id:'signs',n:'Le Monde des Panneaux',icon:'🚦',d:'Formes, couleurs, feux — le langage secret de la route',boss:"L'Inspecteur des Panneaux",bossIc:'🕵️'},
 {id:'speed',n:'La Vallée des Vitesses',icon:'⚡',d:'25, 35, 50, 65… et la météo qui change tout',boss:'Le Radar Vivant',bossIc:'📡'},
 {id:'dist',n:'Le Donjon des Distances',icon:'📏',d:'Pieds, pouces, car lengths — les chiffres qui tombent',boss:'Le Métreur Fou',bossIc:'🧙'},
 {id:'booze',n:'Le Bar Maudit',icon:'🍺',d:'BAC, implied consent, mythes du café',boss:'Le Videur du Bar Maudit',bossIc:'🧟'},
 {id:'points',n:'Le Tribunal des Points',icon:'⚖️',d:'Points, amendes, suspensions — le tarif des bêtises',boss:'Le Juge aux 12 Points',bossIc:'👨‍⚖️'},
 {id:'share',n:'La Route Partagée',icon:'🚸',d:'Priorités, piétons, camions, vélos, bus',boss:'Le Chauffard Fantôme',bossIc:'👻'},
 {id:'surv',n:'Zone de Survie',icon:'🌪️',d:'Dérapages, freins morts, trains, verglas',boss:'La Tempête Noire',bossIc:'⛈️'},
 {id:'gdl',n:'Le Labyrinthe GDL',icon:'🎓',d:'Permis, GDL, sièges enfants, paperasse MVC',boss:'Le Fonctionnaire Final',bossIc:'🧌'}
];

const Q=[
/* ---------------- PANNEAUX (17) ---------------- */
{w:'signs',s:'stop',q:"What does this eight-sided sign mean?",a:["Come to a complete stop, then proceed when safe","Slow down and yield if needed","Stop only if other vehicles are coming","End of the roadway ahead"],x:"Octogone rouge = STOP. Arrêt COMPLET avant la ligne ou le crosswalk — même si la rue est déserte."},
{w:'signs',s:'yield',q:"What does this downward-pointing triangle mean?",a:["Slow down and give the right-of-way","Come to a complete stop","Do not enter","Merge left ahead"],x:"Triangle pointe en bas = YIELD : ralentis et cède le passage. Pas d'arrêt obligatoire si la voie est libre."},
{w:'signs',s:'pennant',q:"This sideways pennant-shaped sign marks:",a:["A no-passing zone","A school zone","A work zone","A railroad crossing"],x:"Le fanion (pennant) jaune, planté à GAUCHE de la route = NO PASSING ZONE. Interdiction de doubler."},
{w:'signs',s:'diamond',q:"Diamond-shaped signs are used to:",a:["Warn of hazards or changes ahead","Give directions and distances","Set the speed limit","Mark motorist services"],x:"Losange = WARNING : danger ou changement devant (virage, rétrécissement, cerfs…). Jaune à lettres noires."},
{w:'signs',s:'school',q:"A five-sided (pentagon) sign means:",a:["School zone or school crossing ahead","Hospital zone","Pedestrian mall","Construction ahead"],x:"Pentagone = SCHOOL. Zone ou passage scolaire — 25 mph quand des enfants sont présents."},
{w:'signs',s:'rr',q:"A round yellow sign with an X and the letters RR means:",a:["Railroad crossing ahead","Wrong way — turn back","Roundabout ahead","No entry"],x:"Le seul panneau ROND : il annonce un passage à niveau (railroad) plus loin. Prépare-toi à ralentir."},
{w:'signs',s:'crossbuck',q:"The white X-shaped crossbuck at railroad tracks means:",a:["Yield to trains — treat it like a yield sign","Stop for exactly five seconds","The tracks are abandoned","Sound your horn before crossing"],x:"Le crossbuck blanc AU passage à niveau = céder aux trains. Feux rouges clignotants = STOP obligatoire."},
{w:'signs',q:"Orange signs, cones and barrels always indicate:",a:["Construction or work zones","School zones","No-passing zones","Recreation areas"],x:"ORANGE = travaux. Et en zone de travaux, les amendes sont DOUBLÉES."},
{w:'signs',q:"Blue road signs tell you about:",a:["Motorist services: gas, food, lodging, hospitals","Hazards ahead","Speed regulations","Scenic routes"],x:"BLEU = services (essence, resto, hôtel, hôpital, aire de repos)."},
{w:'signs',q:"Green road signs tell you about:",a:["Directions, distances and exits","Hazards ahead","Motorist services","Work zones"],x:"VERT = guidage : directions, distances, sorties. (MARRON = parcs et loisirs.)"},
{w:'signs',s:'sigred',q:"A flashing red traffic light means:",a:["Stop completely, then go when the way is clear","Slow down and proceed with caution","The signal is broken — you have priority","Stop and wait for it to turn green"],x:"Rouge CLIGNOTANT = panneau STOP : arrêt complet, puis on repart quand c'est libre."},
{w:'signs',s:'sigyel',q:"A flashing yellow traffic light means:",a:["Slow down and proceed with caution","Come to a complete stop","Speed up before it turns red","Pedestrians only may cross"],x:"Jaune CLIGNOTANT = prudence, ralentis, passe. Pas d'arrêt obligatoire."},
{w:'signs',s:'sigyel',q:"A steady yellow light means:",a:["Stop before the intersection if you can do so safely","Speed up to clear the intersection","Turn on your headlights","Yield to the right"],x:"Jaune FIXE = le feu va passer rouge : arrête-toi si tu peux le faire sans danger. Jamais accélérer."},
{w:'signs',s:'arrow',q:"A green arrow shown with a red light means:",a:["You may turn in the arrow's direction — the turn is protected","You may go straight only","No turns are allowed","Stop, then turn"],x:"Flèche verte = tour PROTÉGÉ (le trafic d'en face est à l'arrêt). Reste vigilant : piétons déjà engagés d'abord."},
{w:'signs',q:"In New Jersey, turning right at a red light is:",a:["Allowed after a complete stop, unless a sign prohibits it","Never allowed","Allowed without stopping if clear","Allowed only during daytime"],x:"Right on red = OK au NJ : arrêt COMPLET, céder aux piétons et au trafic, sauf panneau « NO TURN ON RED »."},
{w:'signs',q:"A solid yellow line on your side of the center line means:",a:["You may not pass","You may pass when safe","Two-way left-turn lane","The road narrows ahead"],x:"JAUNE = sépare les sens opposés ; continue de ton côté = interdit de doubler. BLANC = voies dans le même sens."},
{w:'signs',s:'jug',q:"In NJ, the sign 'ALL TURNS FROM RIGHT LANE' means:",a:["Use the right-lane jughandle to turn left or make a U-turn","Only right turns are allowed ahead","Trucks must stay in the right lane","The left lane is closed"],x:"Le fameux JUGHANDLE du New Jersey : pour tourner à GAUCHE, on sort à DROITE et la bretelle fait le tour. Piège d'exam classique."},

/* ---------------- VITESSES (14) ---------------- */
{w:'speed',q:"Unless otherwise posted, the speed limit in a school zone is:",a:["25 mph","15 mph","20 mph","35 mph"],x:"Zone scolaire = 25 mph (quand des enfants sont présents, selon la signalisation)."},
{w:'speed',q:"Unless posted, the limit in business and residential districts is:",a:["25 mph","20 mph","30 mph","35 mph"],x:"Quartiers résidentiels et business districts = 25 mph par défaut."},
{w:'speed',q:"Unless posted, the limit in suburban business and residential areas is:",a:["35 mph","25 mph","45 mph","50 mph"],x:"Zones suburbaines = 35 mph. Retiens l'escalier : 25 → 35 → 50 → 55/65."},
{w:'speed',q:"On non-posted rural roadways, the speed limit is:",a:["50 mph","40 mph","55 mph","60 mph"],x:"Route rurale sans panneau = 50 mph."},
{w:'speed',q:"The maximum speed on certain NJ state highways and interstates is:",a:["55 mph, with some posted at 65 mph","70 mph everywhere","45 mph","50 mph everywhere"],x:"55 mph en général ; certaines portions (Turnpike, Parkway, interstates) sont affichées 65 mph."},
{w:'speed',q:"In construction zones and Safe Corridors, fines are:",a:["Doubled","Tripled","Normal","Waived when no workers are present"],x:"Travaux + Safe Corridors = amendes DOUBLÉES."},
{w:'speed',q:"The posted speed limit is the maximum allowed:",a:["Under ideal driving conditions","At all times, whatever the weather","Only during daylight","Except when passing"],x:"La limite vaut par conditions IDÉALES. Pluie, brouillard, trafic → tu dois rouler MOINS vite que le panneau."},
{w:'speed',q:"On a wet road, you should reduce your speed by about:",a:["5 to 10 mph","1 to 2 mph","20 to 25 mph","There is no need to slow down"],x:"Route mouillée = −5 à 10 mph sur ta vitesse normale."},
{w:'speed',q:"On packed snow, you should:",a:["Cut your speed in half","Slow down by 5 mph","Drive normally with snow tires","Follow other cars closely for traction"],x:"Neige tassée = vitesse divisée par DEUX."},
{w:'speed',q:"On ice, you should:",a:["Slow to a crawl","Cut your speed in half","Reduce speed by 10 mph","Use cruise control for stability"],x:"Verglas = au pas (« slow to a crawl »). Et jamais de cruise control sur sol glissant."},
{w:'speed',q:"At night, drive slow enough to:",a:["Stop within the distance lit by your headlights","See one mile ahead","React within ten seconds","Keep up with traffic no matter what"],x:"Ne jamais « overdrive your headlights » : il faut pouvoir s'arrêter DANS la zone que tes phares éclairent."},
{w:'speed',q:"Driving much slower than the flow of traffic:",a:["Can be illegal, because it blocks the normal flow","Is always the safest option","Is required in the left lane","Is recommended on highways"],x:"Trop lent = danger et verbalisable (entrave à la circulation). Et on garde la droite sauf pour doubler."},
{w:'speed',q:"Hydroplaning — tires riding on a film of water — can begin at speeds as low as:",a:["35 mph","55 mph","65 mph","20 mph"],x:"Dès 35 mph par forte pluie. Au-dessus de 55, ça devient vraiment dangereux."},
{w:'speed',q:"When entering a highway from an acceleration lane, you should:",a:["Reach the speed of the highway traffic before merging","Stay at 25 mph and merge slowly","Stop at the end of the lane, then go","Merge at any speed — traffic must yield"],x:"Voie d'accélération : tu te mets À LA VITESSE du trafic, tu trouves ton créneau, tu t'insères."},

/* ---------------- DISTANCES (17) ---------------- */
{w:'dist',q:"You may not park within ___ of a fire hydrant.",a:["10 feet","25 feet","50 feet","5 feet"],x:"Borne incendie = 10 ft (~3 m). Début de l'escalier magique : 10 – 25 – 50."},
{w:'dist',q:"You may not park within ___ of a crosswalk at an intersection.",a:["25 feet","10 feet","50 feet","100 feet"],x:"Passage piéton = 25 ft."},
{w:'dist',q:"You may not park within ___ of a stop sign.",a:["50 feet","25 feet","10 feet","100 feet"],x:"Panneau STOP = 50 ft. L'escalier complet : hydrant 10, crosswalk 25, stop 50."},
{w:'dist',q:"You may not park within ___ of a railroad crossing.",a:["50 feet","25 feet","10 feet","200 feet"],x:"Passage à niveau = 50 ft, comme le panneau stop."},
{w:'dist',q:"You may not park within ___ of a fire station driveway entrance.",a:["20 feet (and 75 feet on the opposite side of the street)","10 feet on both sides","50 feet on both sides","100 feet"],x:"Caserne : 20 ft du même côté, 75 ft en face. LA règle vicieuse par excellence — apprends-la, elle tombe."},
{w:'dist',q:"You must signal at least ___ before making a turn.",a:["100 feet","50 feet","200 feet","25 feet"],x:"Clignotant ≥ 100 ft avant de tourner."},
{w:'dist',q:"Dim your high beams when an oncoming vehicle is within:",a:["500 feet","100 feet","200 feet","1,000 feet"],x:"Pleins phares → codes quand un véhicule arrive à 500 ft."},
{w:'dist',q:"Headlights must be on from:",a:["One-half hour after sunset to one-half hour before sunrise","Sunset to sunrise exactly","9 p.m. to 6 a.m.","Only when it is completely dark"],x:"Phares : ½ heure après le coucher du soleil → ½ heure avant le lever. Aussi obligatoires si visibilité < 500 ft."},
{w:'dist',q:"New Jersey law requires headlights on whenever you use your:",a:["Windshield wipers","Air conditioning","Turn signals","Hazard lights"],x:"Essuie-glaces en marche (pluie, neige, brouillard) = phares ALLUMÉS. C'est une loi du NJ."},
{w:'dist',q:"A good rule for following distance is to stay back:",a:["One car length for every 10 mph of speed","One car length at any speed","Two car lengths at any speed","Half a car length per 10 mph"],x:"1 longueur de voiture par tranche de 10 mph → à 50 mph, 5 longueurs. Mauvais temps : encore plus."},
{w:'dist',q:"You must stop at least ___ from a school bus with flashing red lights.",a:["25 feet","10 feet","50 feet","100 feet"],x:"Bus scolaire, feux rouges = STOP à 25 ft minimum — dans LES DEUX SENS sur route non séparée."},
{w:'dist',q:"If a school bus has stopped directly in front of a school to pick up or let off children, you may:",a:["Pass from either direction at no more than 10 mph","Not pass under any circumstances","Pass at 25 mph","Pass only if students have left the street"],x:"Bus arrêté DEVANT l'école = on peut passer à 10 mph max. Idem de l'autre côté d'une route à terre-plein central : 10 mph."},
{w:'dist',q:"When required to stop at a railroad crossing, stop within:",a:["15 to 50 feet of the tracks","5 to 10 feet of the tracks","50 to 100 feet of the tracks","1 to 5 feet of the tracks"],x:"Arrêt entre 15 et 50 ft des rails. Jamais plus près, jamais dessus."},
{w:'dist',q:"After passing a vehicle, return to your lane when:",a:["You can see both of its headlights in your rearview mirror","You are about 10 feet ahead of it","The other driver flashes their lights","Three seconds have passed"],x:"Rabats-toi quand tu vois SES DEUX PHARES dans ton rétroviseur intérieur."},
{w:'dist',q:"You may not pass another vehicle within ___ of an intersection or railroad crossing.",a:["100 feet","50 feet","200 feet","500 feet"],x:"Pas de dépassement à moins de 100 ft d'une intersection ou d'un passage à niveau."},
{w:'dist',q:"When parallel parking, your wheels must be within ___ of the curb.",a:["6 inches","12 inches","18 inches","3 feet"],x:"Créneau réussi = roues à 6 pouces (15 cm) max du trottoir."},
{w:'dist',q:"Under NJ's Safe Passing Law, when passing a cyclist you must:",a:["Move over a lane if possible, or leave at least 4 feet of space","Sound your horn and pass closely","Leave one foot of space at low speed","Wait behind until the cyclist turns off"],x:"Loi de 2022 : changer de voie si possible, sinon ≥ 4 ft d'écart — impossible ? Ralentir à 25 mph et pouvoir s'arrêter."},

/* ---------------- BAR MAUDIT (15) ---------------- */
{w:'booze',q:"In NJ, a driver 21 or older is legally under the influence at a BAC of:",a:["0.08%","0.10%","0.05%","0.15%"],x:"21 ans et + : 0.08%. Mais on peut être condamné EN DESSOUS si la conduite est visiblement altérée."},
{w:'booze',q:"For drivers under 21, the BAC limit is:",a:["0.01%","0.08%","0.05%","0.03%"],x:"Moins de 21 ans = 0.01% : la moindre trace suffit. Tolérance zéro."},
{w:'booze',q:"For commercial (CDL) drivers, the BAC limit is:",a:["0.04%","0.08%","0.02%","0.06%"],x:"Conducteurs pro = 0.04%. La série à retenir : 0.01 / 0.04 / 0.08."},
{w:'booze',q:"The only thing that removes alcohol from your body is:",a:["Time","Strong black coffee","A cold shower","Fresh air and exercise"],x:"Seul le TEMPS dégrise. Café, douche froide, sport = mythes. Tu obtiens juste un ivrogne réveillé et mouillé."},
{w:'booze',q:"The body gets rid of about one drink per:",a:["Hour","20 minutes","3 hours","Half hour"],x:"≈ 1 verre par HEURE. 4 verres = au moins 4 heures avant de reprendre le volant."},
{w:'booze',q:"Which of these contains the same amount of alcohol?",a:["12 oz of beer, 5 oz of wine, and 1.5 oz of liquor","A bottle of beer and a bottle of wine","One shot equals three beers","Wine has half the alcohol of beer"],x:"12 oz de bière = 5 oz de vin = 1.5 oz de spiritueux (un shot). Un « verre » = un verre, peu importe la boisson."},
{w:'booze',q:"The FIRST ability affected by alcohol is:",a:["Judgment","Vision","Balance","Reaction time"],x:"Le JUGEMENT part en premier — précisément celui qui devrait te dire de ne pas conduire. Vicieux."},
{w:'booze',q:"Alcohol is classified as a:",a:["Depressant that slows down your body","Stimulant that sharpens reflexes","Hallucinogen","Nutrient"],x:"Dépresseur : réflexes, vision, coordination, jugement — tout ralentit."},
{w:'booze',q:"NJ's implied consent law means that by driving here, you have agreed to:",a:["Take a breath test when asked by police","Carry proof of insurance","Show your license at checkpoints","Take a blood test only if a lawyer is present"],x:"Conduire au NJ = tu as DÉJÀ consenti au breath test. Le refus se paie très cher."},
{w:'booze',q:"If you refuse to take a breath test, you face:",a:["Separate penalties, including losing your license","No consequences until a court decides","A choice of blood test instead","A small fixed fine"],x:"Refuser ne sauve pas : sanctions distinctes (suspension, interlock, amendes), souvent aussi lourdes que le DUI lui-même."},
{w:'booze',q:"Open containers of alcohol in the passenger area of a vehicle are:",a:["Prohibited for both the driver and passengers","Allowed for passengers only","Allowed if nearly empty","Allowed if kept in the glove box"],x:"Contenant ouvert = interdit pour TOUT le monde à bord. Sa place : le coffre."},
{w:'booze',q:"A first DUI conviction (BAC 0.08–0.10%) includes:",a:["A $250–$400 fine, 12–48 hours at the IDRC, up to 30 days jail, and an ignition interlock","A written warning","A $50 fine only","Community service only"],x:"1re condamnation : 250–400 $, 12–48 h de stage IDRC, jusqu'à 30 jours de prison, éthylotest anti-démarrage."},
{w:'booze',q:"Driving under the influence of drugs — including some prescription or over-the-counter medicines:",a:["Carries penalties like drunk driving","Is legal with a valid prescription","Only applies to illegal drugs","Is a minor offense"],x:"Somnifères, antihistaminiques, cannabis, etc. = DUI aussi. Lis les notices de tes médocs."},
{w:'booze',q:"A driver under 21 caught with any detectable alcohol (0.01%+) faces:",a:["30–90 days license suspension, community service and an alcohol program","A warning letter to their parents","Adult penalties only at 0.08%","A fine with no suspension"],x:"< 21 ans : suspension 30–90 jours + 15–30 jours de travaux d'intérêt général + programme IDRC."},
{w:'booze',q:"The best way to avoid driving under the influence is to:",a:["Decide before drinking: designated driver, ride service, or stay over","Drink coffee before leaving","Eat a large meal while drinking","Take back roads home"],x:"Le plan se décide AVANT de boire : sober driver, Uber, canapé. Un plan, pas un pari."},

/* ---------------- TRIBUNAL DES POINTS (17) ---------------- */
{w:'points',q:"Your license is suspended when you accumulate ___ points.",a:["12 points","6 points","10 points","15 points"],x:"12 points = suspension. Le compteur fatal."},
{w:'points',q:"You pay an annual insurance surcharge if you get ___ points within 3 years.",a:["6 points","12 points","3 points","9 points"],x:"6 points en 3 ans = surtaxe annuelle ($150 + $25 par point au-delà de 6)."},
{w:'points',q:"One full year with no violations or suspensions removes:",a:["3 points","1 point","5 points","All points"],x:"1 an sans infraction ni suspension = −3 points."},
{w:'points',q:"Completing a defensive driving course removes:",a:["2 points (once every 5 years)","3 points every year","5 points once","No points, only a discount"],x:"Stage « defensive driving » = −2 points, une fois tous les 5 ans. (Driver Improvement Program = −3, tous les 2 ans.)"},
{w:'points',q:"Speeding 1–14 mph over the limit costs:",a:["2 points","4 points","5 points","1 point"],x:"Barème excès de vitesse : 1–14 mph → 2 pts · 15–29 → 4 pts · 30+ → 5 pts."},
{w:'points',q:"Speeding 15–29 mph over the limit costs:",a:["4 points","2 points","5 points","6 points"],x:"15–29 mph au-dessus = 4 points."},
{w:'points',q:"Speeding 30 mph or more over the limit costs:",a:["5 points","4 points","8 points","10 points"],x:"30 mph et + = 5 points. Et sans doute une convocation au tribunal."},
{w:'points',q:"Tailgating (following too closely) costs:",a:["5 points","2 points","3 points","4 points"],x:"Coller le véhicule devant = 5 points. Autant que la conduite dangereuse."},
{w:'points',q:"Reckless driving costs ___ ; careless driving costs ___.",a:["5 points ; 2 points","2 points ; 5 points","5 points ; 5 points","3 points ; 1 point"],x:"Reckless (mépris délibéré du danger) = 5 pts. Careless (négligence) = 2 pts."},
{w:'points',q:"Improper passing costs:",a:["4 points","2 points","5 points","3 points"],x:"Dépassement interdit = 4 points."},
{w:'points',q:"Passing a stopped school bus costs:",a:["5 points and a fine of at least $100","2 points","8 points","A fine only, no points"],x:"Griller un bus scolaire = 5 points + amende ≥ 100 $ (+ travaux d'intérêt général possibles)."},
{w:'points',q:"Leaving the scene of a crash where someone was injured costs:",a:["8 points, plus license suspension","2 points","5 points","4 points and a fine"],x:"Délit de fuite avec blessé = 8 points + suspension. Le sommet du barème courant."},
{w:'points',q:"Failing to stop for a pedestrian in a crosswalk costs:",a:["2 points and a $200 fine","Nothing if the pedestrian was slow","5 points","1 point and a warning"],x:"Piéton non respecté = 200 $ + 2 points (+ 15 jours de TIG possibles). Au NJ on s'ARRÊTE pour les piétons."},
{w:'points',q:"Using a handheld phone while driving — the first offense fine is:",a:["$200–$400","$50–$100","$500 flat","$1,000"],x:"Téléphone en main : 1re fois 200–400 $ · 2e 400–600 $ · 3e 600–800 $ + 3 points + 90 jours de suspension possibles."},
{w:'points',q:"A third handheld-phone offense (within 10 years) adds:",a:["3 points and a possible 90-day suspension","1 point","Nothing beyond the fine","Vehicle impoundment"],x:"3e offense : 600–800 $ + 3 POINTS + suspension possible de 90 jours. Le mains-libres existe, utilise-le."},
{w:'points',q:"Driving without insurance (first offense) brings:",a:["A $300–$1,000 fine, community service, and a 1-year license loss","A $50 fine","A written warning","Nothing unless you crash"],x:"Sans assurance : 300–1 000 $ + TIG + 1 AN de suspension. L'une des sanctions les plus lourdes du code."},
{w:'points',q:"Seat belts in NJ: the driver is responsible for buckling up all passengers:",a:["Under 18","Under 21","Only in the front seat","Only under 8"],x:"Le conducteur répond de tous les passagers < 18 ans. Ceinture = primary offense : contrôle possible rien que pour ça."},

/* ---------------- ROUTE PARTAGÉE (16) ---------------- */
{w:'share',q:"When a pedestrian is in a marked crosswalk, NJ drivers must:",a:["Stop and remain stopped while the pedestrian is in the crosswalk","Slow down and drive around them","Sound the horn and proceed","Yield only at traffic lights"],x:"Passage MARQUÉ = arrêt COMPLET tant que le piéton y est. Passage non marqué = céder le passage."},
{w:'share',q:"A person with a white cane or a guide dog:",a:["Always has the right-of-way","Has priority only in crosswalks","Must wait for traffic","Has priority only at signals"],x:"Canne blanche / chien guide = priorité ABSOLUE, partout, toujours."},
{w:'share',q:"Two vehicles reach a four-way stop at the same time. Who goes first?",a:["The driver on the right","The driver on the left","The larger vehicle","Whoever moves first"],x:"Arrivée simultanée = priorité à DROITE."},
{w:'share',q:"When turning left, you must yield to:",a:["Oncoming traffic and pedestrians","No one, if you signaled","Only trucks and buses","Vehicles behind you"],x:"Tourner à gauche = céder au trafic d'en face ET aux piétons. Le clignotant ne donne aucun droit."},
{w:'share',q:"When entering a road from a driveway or private road, you must:",a:["Yield to all traffic and pedestrians","Proceed — road traffic must let you in","Yield only to traffic from the left","Enter as quickly as possible"],x:"Sortie de parking ou d'allée = tu cèdes à TOUT LE MONDE, trottoir compris."},
{w:'share',q:"When an emergency vehicle approaches with lights and siren, you must:",a:["Pull to the right edge of the road and stop","Speed up to clear the area","Stop immediately, even in the intersection","Slow down slightly and continue"],x:"À DROITE et STOP. Jamais s'arrêter au milieu d'une intersection — traverse-la d'abord, puis range-toi."},
{w:'share',q:"In NJ, when a bus signals to re-enter traffic from a stop, you must:",a:["Yield to the bus","Accelerate to pass it first","Sound your horn","Flash your lights and continue"],x:"Bus qui met son clignotant pour repartir = on le laisse sortir. C'est la loi au New Jersey."},
{w:'share',q:"When entering a roundabout, you must:",a:["Yield to traffic already in the circle","Enter — circle traffic yields to you","Always stop completely first","Enter from the left lane only"],x:"Rond-point : priorité à ceux qui Y SONT déjà. Circulation en sens anti-horaire."},
{w:'share',q:"A motorcycle is entitled to:",a:["The full width of a traffic lane","Half of a lane","The shoulder only","No specific lane rights"],x:"Une moto = une voie ENTIÈRE. On ne partage jamais sa voie avec elle."},
{w:'share',q:"If you cannot see a truck driver in the truck's side mirror:",a:["The driver cannot see you","The driver can still see you in the rearview","You are safe as long as you are behind","You should flash your lights"],x:"Pas de rétro visible = tu es dans le No-Zone (angles morts avant, côtés, arrière). Sors-en vite."},
{w:'share',q:"Trucks making a right turn often:",a:["Swing wide to the left first — never squeeze in on their right","Hug the curb tightly","Yield to cars on their right","Use the shoulder"],x:"Un camion qui tourne à droite déborde d'abord à gauche. Ne JAMAIS s'insérer à sa droite à ce moment-là."},
{w:'share',q:"Before turning right, you should check for:",a:["Cyclists coming up on your right side","Traffic in the left lane only","Your mirrors only","Nothing, if you signaled early"],x:"Le « right hook » est l'accident vélo classique : contrôle ton angle mort DROIT avant de tourner."},
{w:'share',q:"An orange triangle on the back of a vehicle means it:",a:["Moves slowly — 25 mph or less","Carries a wide load","Is a student driver","Carries hazardous materials"],x:"Triangle orange = véhicule lent (≤ 25 mph) : tracteurs, engins agricoles. Patience et dépassement propre."},
{w:'share',q:"When approaching a horse and rider, you should:",a:["Slow down, give plenty of room, and avoid honking","Sound your horn to warn them","Pass quickly and closely","Rev your engine so they hear you"],x:"Cheval = animal imprévisible : on ralentit, on s'écarte large, PAS de klaxon."},
{w:'share',q:"When turning left onto a road with multiple lanes, enter:",a:["The nearest lane going in your direction","Any available lane","The far right lane directly","The shoulder, then merge"],x:"On tourne dans la voie LA PLUS PROCHE de son sens, et on change de voie ensuite si besoin."},
{w:'share',q:"If a deer suddenly appears in front of your car, you should:",a:["Brake firmly but do not swerve","Swerve into the opposite lane","Speed up to pass before impact","Close your eyes and honk"],x:"Freine FORT, ne braque pas : le coup de volant (arbre, trafic d'en face) tue plus que l'animal."},

/* ---------------- ZONE DE SURVIE (16) ---------------- */
{w:'surv',q:"If the rear of your car starts to skid, you should:",a:["Ease off the gas and steer in the direction you want to go","Brake hard immediately","Steer opposite to the skid","Accelerate out of it"],x:"Dérapage : pied levé, pas de gros freinage, on braque DANS le sens du dérapage (là où on veut aller)."},
{w:'surv',q:"If your brakes fail, you should:",a:["Pump the brake pedal, downshift, and apply the parking brake gently","Turn off the engine right away","Jump out if possible","Swerve between lanes to slow down"],x:"Freins morts : pomper la pédale, rétrograder, frein à main PROGRESSIF. Moteur coupé = direction assistée morte."},
{w:'surv',q:"If a tire blows out, you should:",a:["Grip the wheel firmly, ease off the gas, and brake gently once under control","Brake as hard as possible","Steer sharply to the shoulder","Accelerate to stabilize the car"],x:"Éclatement : volant tenu FERME, décélération douce, freinage léger une fois la voiture stable."},
{w:'surv',q:"Your car stalls on railroad tracks and a train is approaching. You should:",a:["Get everyone out and run toward the train, angled away from the tracks","Keep trying to restart until the last moment","Push the car off the tracks","Stay inside and brace"],x:"On COURT VERS le train (en biais, loin des rails) : les débris volent dans l'autre sens. Contre-intuitif = adoré à l'exam."},
{w:'surv',q:"If your wheels drift off the pavement onto the shoulder, you should:",a:["Slow down, then ease back onto the road","Steer back onto the road immediately","Brake hard and stop on the spot","Accelerate to regain the pavement"],x:"Roues dans l'accotement : on RALENTIT d'abord, puis on revient en douceur. Le coup de volant = tonneau."},
{w:'surv',q:"If your car starts to hydroplane, you should:",a:["Ease off the gas and avoid hard braking","Brake hard right away","Accelerate through the water","Turn the wheel quickly side to side"],x:"Aquaplaning : pied levé, volant droit, pas de freinage brutal — on attend que les pneus remordent."},
{w:'surv',q:"Which road surfaces freeze FIRST?",a:["Bridges and overpasses","Sunny stretches","City streets","Gravel roads"],x:"Les PONTS gèlent en premier : le froid passe dessus ET dessous."},
{w:'surv',q:"Blinded by oncoming high beams at night? Look:",a:["Toward the right edge of the road","Directly at the headlights","At your dashboard","At the center line"],x:"On se guide sur le bord DROIT de la chaussée. Jamais fixer les phares d'en face."},
{w:'surv',q:"Highway hypnosis is best prevented by:",a:["Keeping your eyes moving and scanning the scene","Staring at the center line","Driving faster to stay alert","Turning up the heat"],x:"La transe d'autoroute se combat en bougeant les yeux : rétros, panneaux, miroirs — et des pauses."},
{w:'surv',q:"The only real cure for drowsiness while driving is:",a:["Stopping to sleep","Strong coffee","Opening the windows","Loud music"],x:"Fatigue = DORMIR. Le reste ne fait que retarder le micro-sommeil de quelques minutes."},

function load(){

    if(!raw) return defaults();
    return Object.assign(defaults(), JSON.parse(raw));
  }catch(e){ return defaults(); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function touchDaily(){
  const t=todayStr();
  if(S.daily.date!==t){ S.daily={date:t, ok:0, rewarded:false}; }
}

/* ---------- niveaux ---------- */
function levelIdx(){ let i=0; for(let k=0;k<LEVELS.length;k++){ if(S.xp>=LEVELS[k].xp) i=k; } return i; }
function levelInfo(){
  const i=levelIdx(), cur=LEVELS[i], next=LEVELS[i+1]||null;
  const base=cur.xp, span=next?next.xp-base:1;
  return {i, num:i+1, cur, next, pct:next?Math.min(100,Math.round((S.xp-base)/span*100)):100};
}

/* ---------- audio (WebAudio, zéro asset) ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,t0,dur,type,vol){
  const c=ac(); if(!c||!S.sound) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.08, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.02);
}
const SFX={

  lvl(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.16,'square',.09)); },
  win(){ [523,659,784,880,1047,1319].forEach((f,i)=>tone(f,i*.09,.14,'square',.09)); },
  hit(){ tone(220,0,.06,'square',.1); tone(90,.04,.14,'sawtooth',.12); },

/* ---------- confettis ---------- */
const FX={cv:null,ctx:null,parts:[],raf:0};
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!FX.cv){ FX.cv=document.getElementById('fx'); FX.ctx=FX.cv.getContext('2d'); }
  const cv=FX.cv; cv.width=innerWidth; cv.height=innerHeight;
  const colors=['#FFC61A','#33B268','#4A8DE8','#F58220','#E5383B','#EFF3F8'];
  for(let i=0;i<(n||120);i++){
    FX.parts.push({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.3,
      vx:(Math.random()-.5)*3, vy:2+Math.random()*4, s:4+Math.random()*6,
      c:colors[i%colors.length], r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3});
  }
  if(!FX.raf) fxLoop();
}
function fxLoop(){
  const {ctx,cv}=FX; if(!ctx){FX.raf=0;return;}
  ctx.clearRect(0,0,FX.cv.width,FX.cv.height);
  FX.parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  FX.parts=FX.parts.filter(p=>p.y<FX.cv.height+30);
  if(FX.parts.length){ FX.raf=requestAnimationFrame(fxLoop); }
  else{ ctx.clearRect(0,0,FX.cv.width,FX.cv.height); FX.raf=0; }
}

/* ---------- petits utilitaires ---------- */
const $=s=>document.querySelector(s);
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(html){
  const t=$('#toast'); t.innerHTML=html; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2600);
}
function floatXp(txt,x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el=document.createElement('div'); el.className='floatxp'; el.textContent=txt;
  el.style.left=(x||innerWidth/2-30)+'px'; el.style.top=(y||innerHeight*0.45)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}

/* ---------- XP / badges ---------- */
function gainXp(n,ev){
  const before=levelIdx();
  S.xp+=n;
  const after=levelIdx();
  if(ev&&ev.clientY) floatXp('+'+n+' XP', ev.clientX-20, ev.clientY-30);
  if(after>before){
    const L=LEVELS[after];
    SFX.lvl(); confetti(140);
    showOverlay(L.ic,'NIVEAU '+(after+1),'Tu es maintenant <b>'+esc(L.t)+'</b> !');
  }
  save(); renderHud();
}
function award(id){
  if(S.badges[id]) return;
  const b=BADGES.find(x=>x.id===id); if(!b) return;
  S.badges[id]=Date.now(); save();
  SFX.win(); confetti(80);
  toast(b.ic+' Badge débloqué : <b>'+esc(b.n)+'</b>');
}
function checkBadges(){
  if(S.totalOk>=1) award('first');
  if(S.runsDone>=1) award('run1');
  if(S.bestCombo>=5) award('combo5');
  if(S.bestCombo>=10) award('combo10');
  if(S.perfectRuns>=1) award('perfect');
  const bw=Object.keys(S.bossWins).length;
  if(bw>=1) award('boss1');
  if(bw>=WORLDS.length) award('bossall');
  if(S.blitzBest>=15) award('blitz15');
  if(S.blitzBest>=25) award('blitz25');
  const tot=S.totalOk+S.totalKo;
  if(tot>=100) award('q100');
  if(tot>=250) award('q250');
  if(S.fixedErrors>=10) award('errors');
  if(S.examPassed) award('exam');
  if(S.examBest>=45) award('exam45');
  if(S.dayStreak>=3) award('daily3');
  if(S.examPassed && WORLDS.every(w=>mastery(w.id)>=80)) award('bayonne');
}

/* ---------- SRS / sélection de questions ---------- */
function qstat(i){ return S.qstat[i]||(S.qstat[i]={box:0,ok:0,ko:0}); }
function mastery(wid){
  const idx=Q.map((q,i)=>({q,i})).filter(o=>o.q.w===wid);
  if(!idx.length) return 0;
  const got=idx.filter(o=>{ const s=S.qstat[o.i]; return s&&s.box>=2; }).length;
  return Math.round(got/idx.length*100);
}
function pickQuestions(wid,n){
  const pool=Q.map((q,i)=>({q,i})).filter(o=>!wid||o.q.w===wid);
  const weighted=pool.map(o=>{
    const s=S.qstat[o.i];
    let w;
    if(!s||s.box===0) w=80;               // jamais vue
    else if(s.box===1) w=100+s.ko*10;     // ratée → priorité max
    else if(s.box===2) w=40;
    else w=10;
    return {o, w:w+Math.random()*30};
  });
  weighted.sort((a,b)=>b.w-a.w);
  return shuffle(weighted.slice(0,n).map(x=>x.o));
}
function errorPool(){
  return Q.map((q,i)=>({q,i})).filter(o=>{ const s=S.qstat[o.i]; return s&&s.box===1&&s.ko>0; });
}
function recordAnswer(qi,good){
  const s=qstat(qi);
  const wasError=s.box===1&&s.ko>0;
  if(good){ s.ok++; s.box=Math.min(3,(s.box||0)===0?2:s.box+1); if(wasError) S.fixedErrors++; }
  else{ s.ko++; s.box=1; }
  if(good){
    S.totalOk++; touchDaily(); S.daily.ok++;
    if(S.daily.ok>=DAILY_GOAL&&!S.daily.rewarded){
      S.daily.rewarded=true;
      const y=new Date(Date.now()-864e5), ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      S.dayStreak=(S.lastGoalDate===ys)?S.dayStreak+1:1;
      S.lastGoalDate=todayStr();
      gainXp(50); toast('🎯 Objectif du jour atteint ! <b>+50 XP</b> · Série : '+S.dayStreak+' j');
    }
  } else S.totalKo++;
  save();
}

/* ---------- HUD ---------- */
function daysToExam(){
  if(!S.examDate) return null;
  const [y,m,d]=S.examDate.split('-').map(Number);
  const ex=new Date(y,m-1,d), now=new Date();
  now.setHours(0,0,0,0);
  return Math.round((ex-now)/864e5);
}
function renderHud(){
  const L=levelInfo(); touchDaily();
  const dj=daysToExam();
  let chip='';
  if(dj!==null){
    if(dj>1) chip='<div class="jchip'+(dj<=2?' hot':'')+'">J−'+dj+' · BAYONNE</div>';
    else if(dj===1) chip='<div class="jchip hot">DEMAIN · BAYONNE</div>';
    else if(dj===0) chip='<div class="jchip hot">JOUR J 🍀</div>';
    else chip='<div class="jchip">EXAM PASSÉ ?</div>';
  }
  $('#hud').innerHTML='<div class="hud-in">'
   +'<div class="lvl-shield" title="Niveau">'+L.num+'</div>'
   +'<div class="hud-mid">'
     +'<div class="hud-title">'+L.cur.ic+' '+esc(L.cur.t)+' · '+S.xp+' XP</div>'
     +'<div class="xp-lane"><div class="xp-fill" style="width:'+L.pct+'%"></div><div class="xp-dash"></div></div>'
   +'</div>'
   +'<div class="hud-right">'+chip
     +'<div class="goalchip">🎯 <b>'+Math.min(S.daily.ok,DAILY_GOAL)+'</b>/'+DAILY_GOAL+'</div>'
   +'</div></div>';
}

/* ---------- mission (quiz de 10) ---------- */
function startRun(wid){
  $('#overlay').classList.remove('show');
  const qs=pickQuestions(wid,10);
  go('run',{wid, qs, i:0, ok:0, combo:0, answered:false, picked:-1, order:null});
}
function optOrder(q){
  const idx=shuffle([0,1,2,3].slice(0,q.a.length));
  return idx; // ordre d'affichage : positions dans q.a
}
function comboMult(c){ return c>=10?3 : c>=5?2 : c>=3?1.5 : 1; }
function scrRun(){
  const c=CUR, q=c.qs[c.i].q;
  if(!c.order) c.order=optOrder(q);
  const w=WORLDS.find(x=>x.id===q.w);
  let html='<div class="qmeta"><div class="qprog">'+w.icon+' '+(c.i+1)+'/'+c.qs.length+'</div>'
   +(c.combo>=3?'<div class="combo"><span class="f">🔥</span>COMBO ×'+comboMult(c.combo)+'</div>':'')
   +'</div>'
   +'<div class="qbar"><i style="width:'+(c.i/c.qs.length*100)+'%"></i></div>'
   +'<div class="qcard" id="qcard">'
   +(q.s?'<div class="qsign">'+signSvg(q.s)+'</div>':'')
   +'<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  c.order.forEach((optIdx,pos)=>{
    let cls='opt', dis=c.answered?' disabled':'';
    if(c.answered){
      if(optIdx===0&&pos===c.picked) cls+=' sel-ok';
      else if(optIdx===0) cls+=' reveal';
      else if(pos===c.picked) cls+=' sel-ko';
      else cls+=' fade';
    }
    html+='<button class="'+cls+'"'+dis+' onclick="G.answer('+pos+',event)"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.a[optIdx])+'</span></button>';
  });
  html+='</div>';
  if(c.answered){
    const good=c.order[c.picked]===0;
    html+='<div class="verdict '+(good?'ok':'ko')+'">'+(good?['✅ EXACT !','✅ NICKEL !','✅ PROPRE !','✅ BOOM !'][c.i%4]:'❌ RATÉ !')+'</div>'
     +'<div class="exp"><span class="tag">📌 LA RÈGLE</span>'+q.x+'</div>'
     +'<div class="nextbar"><button class="btn btn-bus" style="justify-content:center" onclick="G.next()" id="nextbtn">'+(c.i+1<c.qs.length?'SUIVANT →':'RÉSULTAT 🏁')+'</button></div>';
  }
  return html+'</div>';
}
function answer(pos,ev){
  const c=CUR; if(c.answered) return;
  c.answered=true; c.picked=pos;
  const qi=c.qs[c.i].i;
  const good=c.order[pos]===0;
  recordAnswer(qi,good);
  if(good){
    c.ok++; c.combo++;
    if(c.combo>S.bestCombo){ S.bestCombo=c.combo; save(); }
    const xp=Math.round(10*comboMult(c.combo));
    (c.combo>=3?SFX.combo:SFX.ok)();
    gainXp(xp,ev);
  }else{
    c.combo=0; SFX.ko();
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),380);
  }
  checkBadges();
  render();
  const nb=$('#nextbtn'); if(nb) nb.focus();
}
function next(){
  const c=CUR;
  if(c.i+1<c.qs.length){ c.i++; c.answered=false; c.picked=-1; c.order=null; render(); }
  else endRun();
}
function endRun(){
  const c=CUR;
  S.runsDone++;
  if(c.ok===c.qs.length){ S.perfectRuns++; }
  save(); checkBadges();
  const stars=c.ok>=Math.ceil(c.qs.length*.9)?3:c.ok>=Math.ceil(c.qs.length*.8)?2:c.ok>=Math.ceil(c.qs.length*.6)?1:0;
  if(stars>=2){ SFX.win(); confetti(stars===3?150:70); }
  const bonus=stars===3?40:stars===2?20:0;
  if(bonus) gainXp(bonus);
  const w=c.wid?WORLDS.find(x=>x.id===c.wid):null;
  const m=c.wid?mastery(c.wid):null;
  $('#app').innerHTML='<div class="screen">'
   +'<div class="panel" style="text-align:center">'
   +'<div class="eyebrow">MISSION TERMINÉE'+(w?' — '+esc(w.n):'')+'</div>'
   +'<div class="stars">'+'⭐'.repeat(stars)+'<span class="off">'+'⭐'.repeat(3-stars)+'</span></div>'
   +'<div class="bigscore '+(c.ok>=8?'ok':'ko')+'">'+c.ok+'/'+c.qs.length+'</div>'
   +(m!==null?'<p class="small">Maîtrise de la zone : <b style="color:var(--exit)">'+m+'%</b>'+(m>=80?' — le boss t\'attend ! '+(w?w.bossIc:''):'')+'</p>':'')
   +(bonus?'<p class="small">Bonus étoiles : <b style="color:var(--bus)">+'+bonus+' XP</b></p>':'')
   +'<div class="menu" style="margin-top:16px">'
   +(c.wid?'<button class="btn btn-exit" onclick="G.startRun(\''+c.wid+'\')"><span class="ic">🔁</span>ENCORE ×10</button>':'')
   +(c.wid&&m>=80&&!S.bossWins[c.wid]?'<button class="btn btn-stop" onclick="G.startBoss(\''+c.wid+'\')"><span class="ic">'+(w?w.bossIc:'👊')+'</span>DÉFIER LE BOSS</button>':'')
   +'<button class="btn btn-ghost" onclick="G.go(\'worlds\')"><span class="ic">🗺️</span>Carte</button>'
   +'</div></div></div>';
  renderHud();
}

/* ---------- boîte à erreurs ---------- */
function startErrors(){
  const pool=errorPool();
  if(!pool.length){ toast('🧹 Rien à venger — la boîte à erreurs est vide !'); return; }
  const qs=shuffle(pool).slice(0,10);
  go('run',{wid:null, qs, i:0, ok:0, combo:0, answered:false, picked:-1, order:null});
}

/* ---------- boss ---------- */
function startBoss(wid){
  $('#overlay').classList.remove('show');
  const qs=pickQuestions(wid,20);
  go('boss',{wid, qs, i:0, hp:100, hearts:3, combo:0, answered:false, picked:-1, order:null});
}
function scrBoss(){
  const c=CUR, w=WORLDS.find(x=>x.id===c.wid);
  if(c.hp<=0) return bossWinHtml(w);
  if(c.hearts<=0) return bossLoseHtml(w);
  const q=c.qs[c.i%c.qs.length].q;
  if(!c.order) c.order=optOrder(q);
  let html='<div class="bosshead"><div class="bossface" id="bossface">'+w.bossIc+'</div>'
   +'<div style="flex:1"><div class="bossname">'+esc(w.boss)+'</div>'
   +'<div class="hpbar" style="margin-top:7px"><div class="hpfill" style="width:'+c.hp+'%"></div><div class="hplabel">'+c.hp+'/100</div></div>'
   +'<div class="hearts">'+'❤️'.repeat(c.hearts)+'<span class="off">'+'🖤'.repeat(3-c.hearts)+'</span></div>'
   +'</div></div>'
   +(c.combo>=3?'<div class="combo" style="margin-bottom:8px"><span class="f">🔥</span>COMBO — dégâts ×'+(1+Math.min(c.combo,5))+'</div>':'')
   +'<div class="qcard">'
   +(q.s?'<div class="qsign">'+signSvg(q.s)+'</div>':'')
   +'<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  c.order.forEach((optIdx,pos)=>{
    let cls='opt', dis=c.answered?' disabled':'';
    if(c.answered){
      if(optIdx===0&&pos===c.picked) cls+=' sel-ok';
      else if(optIdx===0) cls+=' reveal';
      else if(pos===c.picked) cls+=' sel-ko';
      else cls+=' fade';
    }
    html+='<button class="'+cls+'"'+dis+' onclick="G.bossAnswer('+pos+',event)"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.a[optIdx])+'</span></button>';
  });
  html+='</div>';
  if(c.answered){
    const good=c.order[c.picked]===0;
    html+='<div class="verdict '+(good?'ok':'ko')+'">'+(good?'💥 −'+c.lastDmg+' HP !':'❌ Le boss te frappe ! −1 ❤️')+'</div>'
     +'<div class="exp"><span class="tag">📌 LA RÈGLE</span>'+q.x+'</div>'
     +'<div class="nextbar"><button class="btn btn-stop" style="justify-content:center" onclick="G.bossNext()" id="nextbtn">EN GARDE →</button></div>';
  }
  return html+'</div>';
}
function bossAnswer(pos,ev){
  const c=CUR; if(c.answered) return;
  c.answered=true; c.picked=pos;
  const qi=c.qs[c.i%c.qs.length].i;
  const good=c.order[pos]===0;
  recordAnswer(qi,good);
  if(good){
    c.combo++;
    if(c.combo>S.bestCombo){ S.bestCombo=c.combo; save(); }
    c.lastDmg=9+Math.min(c.combo,5)*3;
    c.hp=Math.max(0,c.hp-c.lastDmg);
    SFX.hit(); gainXp(10,ev);
    const bf=$('#bossface'); if(bf){ bf.classList.add('hit'); }
  }else{
    c.combo=0; c.hearts--;
    SFX.ko();
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'),380);
  }
  checkBadges();
  render();
  const nb=$('#nextbtn'); if(nb) nb.focus();
}
function bossNext(){
  const c=CUR;
  if(c.hp<=0||c.hearts<=0){ render(); return; }
  c.i++; c.answered=false; c.picked=-1; c.order=null; render();
}
function bossWinHtml(w){
  if(!CUR.rewarded){
    CUR.rewarded=true;
    S.bossWins[w.id]=true; save();
    SFX.win(); confetti(180); gainXp(150); checkBadges();
  }
  return '<div class="panel" style="text-align:center">'
   +'<div style="font-size:56px;filter:grayscale(1) opacity(.6)">'+w.bossIc+'</div>'
   +'<div class="stamp ok">K.O. !</div>'
   +'<p style="margin-bottom:6px"><b>'+esc(w.boss)+'</b> mord la poussière.</p>'
   +'<p class="small">+150 XP · Zone « '+esc(w.n)+' » conquise 👑</p>'
   +'<div class="menu" style="margin-top:16px">'
   +'<button class="btn btn-exit" onclick="G.go(\'worlds\')"><span class="ic">🗺️</span>Carte du NJ</button>'
   +'<button class="btn btn-ghost" onclick="G.go(\'home\')"><span class="ic">🏠</span>QG</button>'
   +'</div></div>';
}
function bossLoseHtml(w){
  return '<div class="panel" style="text-align:center">'
   +'<div style="font-size:56px">'+w.bossIc+'</div>'
   +'<div class="stamp ko">DÉFAITE…</div>'
   +'<p class="small">'+esc(w.boss)+' ricane. Révise la zone et reviens le corriger.</p>'
   +'<div class="menu" style="margin-top:16px">'
   +'<button class="btn btn-exit" onclick="G.startRun(\''+w.id+'\')"><span class="ic">📖</span>Réviser ×10</button>'
   +'<button class="btn btn-stop" onclick="G.startBoss(\''+w.id+'\')"><span class="ic">🔁</span>Revanche</button>'
   +'<button class="btn btn-ghost" onclick="G.go(\'worlds\')"><span class="ic">🗺️</span>Carte</button>'
   +'</div></div>';
}

/* ---------- blitz ---------- */
function scrBlitz(){
  const c=CUR;
  if(c.phase==='intro'){
    return '<div class="backrow"><button class="backbtn" onclick="G.go(\'home\')">← QG</button><div class="scrtitle">Blitz 60s</div></div>'
     +'<div class="panel" style="text-align:center">'
     +'<div style="font-size:50px">⚡</div>'
     +'<h2 class="px" style="font-size:13px;margin:10px 0;color:var(--bus)">LES PETITES RÈGLES™</h2>'
     +'<p class="small" style="max-width:40ch;margin:0 auto 6px">Tous les chiffres pénibles — distances, points, amendes, BAC — en rafale pendant <b>60 secondes</b>. Ton record : <b style="color:var(--bus)">'+S.blitzBest+'</b>.</p>'
     +'<div class="menu" style="margin-top:16px"><button class="btn btn-bus" style="justify-content:center" onclick="G.startBlitz()">GO ! ⏱️</button></div></div>';
  }
  if(c.phase==='end'){
    const nb=c.score>S.blitzBest;
    return '<div class="panel" style="text-align:center">'
     +'<div class="eyebrow">TEMPS ÉCOULÉ</div>'
     +'<div class="bigscore '+(c.score>=15?'ok':'ko')+'">'+c.score+'</div>'
     +(nb?'<div class="stamp ok" style="font-size:13px">NOUVEAU RECORD !</div>':'<p class="small">Record : '+S.blitzBest+'</p>')
     +'<div class="menu" style="margin-top:14px">'
     +'<button class="btn btn-bus" style="justify-content:center" onclick="G.startBlitz()">🔁 ENCORE</button>'
     +'<button class="btn btn-ghost" style="justify-content:center" onclick="G.go(\'home\')">🏠 QG</button>'
     +'</div></div>';
  }
  // phase 'play'
  const d=c.deck[c.di];
  return '<div class="blitzhead"><div class="timer'+(c.t<=10?' low':'')+'" id="timer">'+c.t+'s</div>'
   +'<div class="blitzscore">🏆 '+c.score+(c.streak>=3?' <span style="color:var(--zone)">🔥'+c.streak+'</span>':'')+'</div></div>'
   +'<div class="qcard"><div class="drillp">'+d.p+'</div>'
   +'<div class="opts grid2">'
   +c.opts.map((o,i)=>'<button class="opt" onclick="G.blitzAnswer('+i+',event)"><span>'+esc(o)+'</span></button>').join('')
   +'</div></div>';
}
function startBlitz(){
  stopTimers();
  const deck=shuffle(DRILLS);
  CUR={screen:'blitz', phase:'play', deck, di:0, t:60, score:0, streak:0};
  nextDrill();
  render();
}
function nextDrill(){
  const c=CUR;
  if(c.di>=c.deck.length){ c.deck=shuffle(DRILLS); c.di=0; }
  const d=c.deck[c.di];
  c.opts=shuffle([d.a, ...d.o]);
}
function startBlitzTimer(){
  stopTimers();
  blitzTimer=setInterval(()=>{
    const c=CUR;
    if(c.screen!=='blitz'||c.phase!=='play'){ stopTimers(); return; }
    c.t--;
    if(c.t<=10&&c.t>0) SFX.tick();
    if(c.t<=0){ endBlitz(); return; }
    const el=$('#timer'); if(el){ el.textContent=c.t+'s'; el.classList.toggle('low',c.t<=10); }
  },1000);
}
function blitzAnswer(i,ev){
  const c=CUR, d=c.deck[c.di];
  const good=c.opts[i]===d.a;
  if(good){
    c.score++; c.streak++;
    SFX.ok(); gainXp(4,ev);
    if(c.streak%5===0){ gainXp(20); toast('🔥 Série de '+c.streak+' ! <b>+20 XP</b>'); }
  }else{
    c.streak=0; SFX.ko();
    toast('❌ C\'était : <b>'+esc(d.a)+'</b>');
  }
  c.di++; nextDrill(); render();
}
function endBlitz(){
  stopTimers();
  const c=CUR;
  if(c.score>S.blitzBest){ S.blitzBest=c.score; save(); SFX.win(); confetti(100); }
  checkBadges();
  c.phase='end'; render();
}

/* ---------- examen blanc ---------- */
function startExam(){
  const qs=shuffle(Q.map((q,i)=>({q,i}))).slice(0,50);
  go('exam',{qs, i:0, answers:[], order:null});
}
function scrExam(){
  const c=CUR, q=c.qs[c.i].q;
  if(!c.order) c.order=optOrder(q);
  let html='<div class="qmeta"><div class="qprog">🎓 EXAMEN · '+(c.i+1)+'/50</div>'
   +'<button class="backbtn" onclick="G.quitExam()" style="font-size:8px">ABANDON</button></div>'
   +'<div class="qbar"><i style="width:'+(c.i/50*100)+'%;background:var(--bus)"></i></div>'
   +'<div class="qcard">'
   +(q.s?'<div class="qsign">'+signSvg(q.s)+'</div>':'')
   +'<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  c.order.forEach((optIdx,pos)=>{
    html+='<button class="opt" onclick="G.examAnswer('+pos+')"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(q.a[optIdx])+'</span></button>';
  });
  return html+'</div></div><p class="small" style="text-align:center;margin-top:12px">Pas de correction en direct — comme au vrai test. Verdict à la fin.</p>';
}
function quitExam(){
  showOverlay('🏳️','Abandonner ?','L\'examen ne sera pas compté.'
   +'<span style="display:flex;gap:8px;margin-top:14px">'
   +'<button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="G.hideOverlay()">RESTER</button>'
   +'<button class="btn btn-stop" style="flex:1;justify-content:center" onclick="G.hideOverlay();G.go(\'home\')">QUITTER</button></span>');
}
function examAnswer(pos){
  const c=CUR;
  SFX.click();
  const good=c.order[pos]===0;
  c.answers.push({qi:c.qs[c.i].i, good});
  recordAnswer(c.qs[c.i].i, good);
  if(c.i+1<c.qs.length){ c.i++; c.order=null; render(); }
  else{
    S.examsTaken++;
    const score=c.answers.filter(a=>a.good).length;
    if(score>S.examBest){ S.examBest=score; }
    if(score>=40){ S.examPassed=true; }
    save(); checkBadges();
    gainXp(score*2+(score>=40?200:0));
    go('examEnd',{score, answers:c.answers});
  }
}
function scrExamEnd(){
  const c=CUR, pass=c.score>=40;
  if(pass&&!c.fxDone){ c.fxDone=true; SFX.win(); confetti(200); }
  const wrong=c.answers.filter(a=>!a.good);
  let html='<div class="panel" style="text-align:center">'
   +'<div class="eyebrow">VERDICT DU MVC</div>'
   +'<div class="stamp '+(pass?'ok':'ko')+'">'+(pass?'REÇU ✔':'RECALÉ ✘')+'</div>'
   +'<div class="bigscore '+(pass?'ok':'ko')+'">'+c.score+'/50</div>'
   +'<p class="small">'+(pass
     ?(c.score>=45?'Score d\'assassin. Bayonne ne te verra même pas transpirer. 😎':'Au-dessus de la barre des 40 — comme jeudi. Continue de consolider !')
     :'Il te faut 40/50. Encore '+(40-c.score)+' de plus — la boîte à erreurs est ton amie.')+'</p>'
   +'<div class="menu" style="margin-top:14px">'
   +(wrong.length?'<button class="btn btn-stop" onclick="G.startErrors()"><span class="ic">🩹</span>Venger mes '+wrong.length+' erreurs</button>':'')
   +'<button class="btn btn-shield" onclick="G.startExam()"><span class="ic">🎓</span>Nouvel examen</button>'
   +'<button class="btn btn-ghost" onclick="G.go(\'home\')"><span class="ic">🏠</span>QG</button>'
   +'</div></div>';
  if(wrong.length){
    html+='<div class="panel"><div class="eyebrow">TES ERREURS DU JOUR</div>';
    wrong.forEach(a=>{
      const q=Q[a.qi];
      html+='<div style="padding:10px 0;border-bottom:1px dashed var(--edge)">'
       +'<div style="font-size:14px;font-weight:600;margin-bottom:5px">'+esc(q.q)+'</div>'
       +'<div style="font-size:13px;color:var(--exit);margin-bottom:4px">✔ '+esc(q.a[0])+'</div>'
       +'<div class="small" style="font-size:12.5px">'+q.x+'</div></div>';
    });
    html+='</div>';
  }
  return html;
}

/* ---------- grimoire ---------- */
function scrGrimoire(){
  let html='<div class="backrow"><button class="backbtn" onclick="G.go(\'home\')">← QG</button><div class="scrtitle">Grimoire des Chiffres</div></div>'
   +'<p class="small" style="margin-bottom:14px">L\'antisèche complète. Lis-la, puis va la transpirer au Blitz. ⚡</p>';
  FACTS.forEach(sec=>{
    html+='<div class="panel gsec"><h3>'+sec.g+'</h3><table class="gtable">';
    sec.items.forEach(([l,v])=>{ html+='<tr><td>'+esc(l)+'</td><td>'+esc(v)+'</td></tr>'; });
    html+='</table></div>';
  });
  return html;
}

/* ---------- badges ---------- */
function scrBadges(){
  let html='<div class="backrow"><button class="backbtn" onclick="G.go(\'home\')">← QG</button><div class="scrtitle">Trophées</div></div><div class="badges">';
  BADGES.forEach(b=>{
    const got=!!S.badges[b.id];
    html+='<div class="badge'+(got?'':' locked')+'"><span class="bic">'+b.ic+'</span>'
     +'<div class="bnm">'+esc(b.n)+'</div><div class="bds">'+esc(b.d)+'</div></div>';
  });
  return html+'</div>';
}

/* ---------- réglages ---------- */
function scrSettings(){
  return '<div class="backrow"><button class="backbtn" onclick="G.go(\'home\')">← QG</button><div class="scrtitle">Réglages</div></div>'
   +'<div class="panel">'
   +'<div class="setrow"><label for="set-sound">🔊 Effets sonores</label><input type="checkbox" id="set-sound" '+(S.sound?'checked':'')+' onchange="G.setSound(this.checked)" style="width:22px;height:22px"></div>'
   +'<div class="setrow"><label for="set-date">📅 Date de l\'examen</label><input type="date" id="set-date" value="'+esc(S.examDate)+'" onchange="G.setDate(this.value)"></div>'
   +'<div class="setrow"><label>💾 Progression</label><button class="backbtn" onclick="G.resetAsk()" style="color:var(--stop);border-color:var(--stopD)">TOUT EFFACER</button></div>'
   +'</div>'
   +'<p class="footnote">ROUTE 440 est un jeu d\'entraînement indépendant, non affilié au NJ MVC.<br>Sauvegarde locale sur cet appareil (localStorage).</p>';
}
function setSound(v){ S.sound=v; save(); if(v){ SFX.ok(); } }
function setDate(v){ S.examDate=v; save(); renderHud(); toast('📅 Date d\'examen mise à jour'); }
function resetAsk(){
  showOverlay('🗑️','Tout effacer ?','XP, badges, records, erreurs — tout repart de zéro.'
   +'<span style="display:flex;gap:8px;margin-top:14px">'
   +'<button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="G.hideOverlay()">NON</button>'
   +'<button class="btn btn-stop" style="flex:1;justify-content:center" onclick="G.resetAll()">OUI, RESET</button></span>');
}
function resetAll(){ S=defaults(); save(); hideOverlay(); go('home'); toast('💾 Sauvegarde effacée. Nouveau départ !'); }
function hideOverlay(){ $('#overlay').classList.remove('show'); }

/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='4'){
    const pos=+e.key-1;
    if(CUR.screen==='run'&&!CUR.answered) answer(pos,{});
    else if(CUR.screen==='boss'&&!CUR.answered) bossAnswer(pos,{});
    else if(CUR.screen==='exam') examAnswer(pos);
    else if(CUR.screen==='blitz'&&CUR.phase==='play'&&pos<CUR.opts.length) blitzAnswer(pos,{});
  }
  if(e.key==='Enter'){
    if(CUR.screen==='run'&&CUR.answered) next();
    else if(CUR.screen==='boss'&&CUR.answered) bossNext();
  }
});

/* ---------- API globale + boot ---------- */
const G={go, openWorld, startRun, answer, next, startBoss, bossAnswer, bossNext,
  startBlitz, blitzAnswer, startExam, examAnswer, quitExam, startErrors,
  setSound, setDate, resetAsk, resetAll, hideOverlay};
window.G=G;
touchDaily(); save();
render();

</script>
