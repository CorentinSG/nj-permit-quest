/* ---------- formations ----------
   Trois ordres possibles. Chaque emplacement porte aussi le cap du guerrier,
   pour qu'une ligne regarde toutes dans la même direction. */
const ARMY_R=20;                    // encombrement de la troupe rangée
/* ---------- où la troupe peut-elle vraiment se ranger ? ----------
   Repousser les guerriers un par un les sortait des murs mais cassait la
   formation. On déplace donc la TROUPE ENTIÈRE : on essaie le point visé, puis
   on tourne autour en spirale jusqu'à trouver une place où CHAQUE homme,
   porte-enseigne compris, est au clair. La ligne reste une ligne. */
function armySlotsWorld(x,z){
  const rot=Math.atan2(x,z), cs=Math.cos(rot), sn=Math.sin(rot);
  const out=formationSlots(4).map(pt=>[x+pt[0]*cs+pt[1]*sn, z-pt[0]*sn+pt[1]*cs]);
  out.push([x, z-14]);                       // le chef et son enseigne
  return out;
}
function armyFits(x,z){
  const S2=V3.solids||[];
  return armySlotsWorld(x,z).every(pt=>
    S2.every(o=>Math.hypot(pt[0]-o.x, pt[1]-o.z)>=o.r+5.2));
}
/* replace la troupe une fois TOUS les obstacles connus */
function settleArmy(){
  if(!S.army||S.army.x==null) return;
  const a=V3.place&&V3.place['guerriers'], c=V3.place&&V3.place['chefguerre'];
  if(!a&&!c) return;
  const sp=armySpot(S.army.x,S.army.z);
  const rot=Math.atan2(sp[0],sp[1]);
  if(a){ a.position.set(sp[0],0,sp[1]); a.rotation.y=rot; }
  if(c){ c.position.set(sp[0],0,sp[1]-14); c.rotation.y=rot; }
}
function armySpot(x,z){
  if(armyFits(x,z)) return [x,z];
  for(let r=8;r<=150;r+=8){
    for(let a=0;a<16;a++){
      const th=a*Math.PI/8, nx=x+Math.cos(th)*r, nz=z+Math.sin(th)*r;
      if(Math.hypot(nx,nz)>250) continue;
      if(armyFits(nx,nz)) return [nx,nz];
    }
  }
  const f=pushOutOfSolids(x,z,ARMY_R);       // village saturé : au moins on sort des murs
  return [f[0],f[1]];
}
const FORMATIONS=[
  {k:'ligne', ic:'▬', n:'En ligne',   ne:'Line'},
  {k:'carre', ic:'▣', n:'En carré',   ne:'Square'},
  {k:'coin',  ic:'▲', n:'En pointe',  ne:'Wedge'}
];
function formationOf(){ return (S.army&&S.army.f)||'ligne'; }
function formationSlots(n){
  const f=formationOf(), out=[];
  for(let i=0;i<n;i++){
    if(f==='carre'){ const c=i%2, r=Math.floor(i/2);
      out.push([(c-0.5)*11, (r-0.5)*11, 0]);
    }else if(f==='coin'){ const r=Math.floor((Math.sqrt(8*i+1)-1)/2), c=i-r*(r+1)/2;
      out.push([(c-r/2)*11, r*10, 0]);
    }else{ out.push([(i-(n-1)/2)*11, 0, 0]); }
  }
  return out;
}

    walk.material.side=THREE.DoubleSide; g.add(walk);
    // tours de guet aux quatre points cardinaux
    for(let k=0;k<4;k++){
      const a=k*Math.PI/2+step/2, x=Math.cos(a)*R, z=Math.sin(a)*R;

      tw.castShadow=tw.receiveShadow=true; tw.position.set(x,(H+9)/2,z); tw.rotation.y=-(a+Math.PI/2); g.add(tw);
      const rf=cone(10,7,COL.thatchDark,4); rf.rotation.y=Math.PI/4;

      const bal=new THREE.Mesh(new THREE.BoxGeometry(15,1.4,11),mat(COL.wood));
      bal.castShadow=true; bal.position.set(x,H+8.4,z); bal.rotation.y=-(a+Math.PI/2); g.add(bal);
    }
    // porte fortifiée : deux montants, linteau et double battant
    const ga=GATE*step, gx=Math.cos(ga)*R, gz=Math.sin(ga)*R;
    [-1,1].forEach(sd=>{
      const px=Math.cos(ga)*R-Math.sin(ga)*sd*11, pz=Math.sin(ga)*R+Math.cos(ga)*sd*11;
      const post=new THREE.Mesh(new THREE.BoxGeometry(7,H+7,7),logMat);
      post.castShadow=true; post.position.set(px,(H+7)/2,pz); post.rotation.y=-(ga+Math.PI/2); g.add(post);
      const tip=cone(5,5,COL.thatchDark,4); tip.rotation.y=Math.PI/4;
      tip.position.set(px,H+9.5,pz); g.add(tip);

    const lint=new THREE.Mesh(new THREE.BoxGeometry(26,3.4,6),mat(COL.woodDark));
    lint.castShadow=true; lint.position.set(gx,H-1,gz); lint.rotation.y=-(ga+Math.PI/2); g.add(lint);
    [-1,1].forEach(sd=>{
      const dx=Math.cos(ga)*R-Math.sin(ga)*sd*5.2, dz=Math.sin(ga)*R+Math.cos(ga)*sd*5.2;
      const door=new THREE.Mesh(new THREE.BoxGeometry(10,H-3,2.4),matT(0xc8a86a,TX.wood,1,2));
      door.castShadow=true; door.position.set(dx,(H-3)/2,dz); door.rotation.y=-(ga+Math.PI/2); g.add(door);
    });
    return g; },
  catapulte(){ const g=new THREE.Group();

/* ---------- construction de la scène ---------- */
let built_spots=[];
function buildVillage(scene){
  const owned=S.village;
  // sol
  const gGeo=new THREE.CircleGeometry(330,72);

      c===COL.dirt?matT(0xffffff,TX.dirt,2,2):matT(c,TX.grass,5,5));

  patch(30,-46,-30,COL.grassDark,.8); patch(26,52,28,COL.grassDark,.9); patch(22,-20,52,COL.grassDark,1);
  patch(34,-70,34,COL.grassDark,.7); patch(28,68,-40,COL.grassDark,.85); patch(20,10,-64,COL.grassDark,1.1);
  patch(16,-58,60,0x7ab13a,.9); patch(18,62,62,0x7ab13a,1); patch(14,-14,-30,0x7ab13a,1.2);
  patch(26,0,4,COL.dirt,.9); patch(13,30,-30,COL.dirt,1); patch(11,-46,8,COL.dirt,1.1);
  const path=(w,l,x,z,ry)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,l),matT(0xe8d8b8,TX.dirt,1,4));
    m.rotation.x=-Math.PI/2; m.rotation.z=ry; m.position.set(x,0.16,z); m.receiveShadow=true; scene.add(m); };
  path(11,86,-18,-16,0.5); path(10,72,26,14,-0.75); path(9,60,-6,34,0.15);
  // articles achetés
  const anim=[];
  V3.place={};
  // emplacements automatiques des huttes : spirale qui s'éloigne du centre
  const hutSpot=i=>{ const a=2.399*i+0.7, r=52+Math.sqrt(i)*26;
    return [Math.cos(a)*r, Math.sin(a)*r*0.92]; };
  // les dalles de chemin sont de la décoration au sol : elles se posent bien en
  // vue, collées les unes aux autres, pour former tout de suite un sentier
  const POFF=[0,1,-1,2,-2,3];
  const pathSpot=i=>{ const row=Math.floor(i/6), col=i%6;
    return [POFF[col]*27, 34+row*15]; };
  let spiral=0;
  SHOP.filter(x=>x.stack).forEach(it=>{
    const n2=nOwned(it.id);
    for(let i=0;i<n2;i++){
      const key=i?it.id+'#'+i:it.id;
      const base=P3[it.id]||[-33,-33];
      let p=(S.vpos&&S.vpos[key])||(it.id==='chemin'?pathSpot(i):(i?hutSpot(spiral+i):base));
      // un chemin est à plat sur le sol : il ne bute contre rien et rien ne le repousse
      if(!NOCLIP[it.id]) p=resolveOverlap(p[0],p[1],footOf(key),key);
      const g=B3[it.id](i>=3); g.position.set(p[0],0,p[1]);
      g.rotation.y=(S.vrot&&S.vrot[key]!=null) ? S.vrot[key]
                 : (it.id==='chemin'?0:Math.round(((i*0.7)%6.28)/ROT_STEP)*ROT_STEP);
      scene.add(g); anim.push(g); g.userData.pid=key; V3.place[key]=g;
    }
    if(it.id!=='chemin') spiral+=n2;
  });
  SHOP.forEach(it=>{
    if(it.stack) return;   // déjà traités ci-dessus
    let p=(S.vpos&&S.vpos[it.id])||P3[it.id]||[0,0];
    // l'armée obéit à son ordre de rassemblement
    if((it.id==='guerriers'||it.id==='chefguerre')&&S.army&&S.army.x!=null){
      p=[S.army.x, S.army.z+(it.id==='chefguerre'?-14:0)];
    }
    if(owned.includes(it.id)){
      if(!NOCLIP[it.id]) p=resolveOverlap(p[0],p[1],footOf(it.id),it.id);
      const g=B3[it.id](); g.position.set(p[0],0,p[1]);
      if(S.vrot&&S.vrot[it.id]!=null) g.rotation.y=S.vrot[it.id];
      else g.rotation.y=Math.round(g.rotation.y/ROT_STEP)*ROT_STEP;
      // la troupe fait face à l'extérieur du village : c'est de là que vient César
      if((it.id==='guerriers'||it.id==='chefguerre')&&S.army&&S.army.x!=null)
        g.rotation.y=Math.atan2(S.army.x,S.army.z);
      scene.add(g); anim.push(g);

    }else if(it.id!=='palissade'){

        new THREE.MeshBasicMaterial({color:0xcfe8a0,transparent:true,opacity:.45,side:THREE.DoubleSide}));
      m.rotation.x=-Math.PI/2; m.position.set(p[0],0.25,p[1]); scene.add(m);
    }
  });
  relaxVillage();          // plus rien ne se traverse
  // la troupe obéit à l'ordre reçu : elle n'est pas déplacée par la relaxation
  if(S.army&&S.army.x!=null){
    [['guerriers',0,0],['chefguerre',0,-14]].forEach(([id,dx,dz])=>{
      const g=V3.place[id]; if(!g) return;
      g.position.set(S.army.x+dx, 0, S.army.z+dz);
      g.rotation.y=Math.atan2(S.army.x,S.army.z);

  }
  // forêt + rochers
  const TR=[[8,96,1.1,0],[32,108,.9,1],[56,94,1.2,0],[80,112,1,1],[104,98,1.1,0],[128,114,.85,0],

            [296,108,.9,1],[320,98,1.1,0],[344,114,1,0],[16,138,.9,1],[100,142,.95,0],[190,140,.9,0],
            [268,144,1,1],[330,136,.95,0],[60,150,.85,1],[230,152,.9,0]];
  // décor fixe : on retient au passage ce qui doit rester infranchissable

    solid(o.position.x,o.position.z,4.4*sc); }
  [[-58,-56,1],[62,-52,.8],[-70,30,.9],[64,58,1],[0,-72,.85]].forEach(r=>{

  // buissons
  [[-62,-14,1],[58,-18,.9],[-30,58,1],[44,-46,.85],[-52,46,.95]].forEach(b=>{

  if(owned.includes('taverne')){ put(barrel(1),58,14,0); put(barrel(.9),63,10,0); put(crate(1),55,20,.5);

  if(owned.includes('forge')){ put(logpile(1),-58,14,0.4); put(crate(.9),-40,-6,0.9); put(barrel(.85),-56,-6,0); }
  if(owned.includes('ble')){ put(haybale(1),44,44,0.3); put(haybale(.9),50,38,1.1); put(cart(),18,48,0.9);

  // végétation de sol : touffes d'herbe et massifs de fleurs

  const spotOn=(key,dx,dz,job)=>{

/* ---- espace vital : deux villageois ne peuvent plus se superposer ----

   Le rayon reste sous la distance de conversation, sinon ils ne pourraient
   plus se parler face à face. */
function bodyR(w){ return 4.6*(w.scale&&w.scale.x?w.scale.x:1); }
function separateWalkers(walkers,dt){
  const k=Math.min(1,16*dt);          // réaction rapide mais sans à-coups
  for(let i=0;i<walkers.length;i++){
    const A=walkers[i], ra=bodyR(A);
    for(let j=i+1;j<walkers.length;j++){
      const B=walkers[j], need=ra+bodyR(B);
      let dx=A.position.x-B.position.x, dz=A.position.z-B.position.z;
      let d=Math.hypot(dx,dz);
      if(d>=need) continue;
      if(d<0.0001){                    // pile au même endroit : on écarte au hasard
        const a=(i*2.399+j*1.7)%6.283; dx=Math.cos(a); dz=Math.sin(a); d=1;
      }
      const push=(need-d)/d*0.5*k;
      A.position.x+=dx*push; A.position.z+=dz*push;
      B.position.x-=dx*push; B.position.z-=dz*push;
    }
  }
}
/* ---- chaque habitant regarde autour de lui et réagit à ses voisins ---- */

function turnTo(p,tx,tz,dt,rate){
  const want=Math.atan2(tx-p.position.x,tz-p.position.z);
  let d=want-p.rotation.y;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;

const easeOut=x=>1-(1-x)*(1-x);

function groupSize(walkers,host){
  return 1+walkers.filter(w=>w!==host&&w.userData.state==='talk'&&w.userData.talk===host).length;

function perceiveAll(walkers,now){
  const mode=routine();
  walkers.forEach(p=>{ p.userData.near=null; });
  for(let i=0;i<walkers.length;i++){
    const A=walkers[i], ua=A.userData, ra=ua.rec;
    for(let j=i+1;j<walkers.length;j++){
      const B=walkers[j], ub=B.userData, rb=ub.rec;
      const d=Math.hypot(A.position.x-B.position.x, A.position.z-B.position.z);
      if(d>SEE) continue;
      // --- 1. ils se voient : on retient le plus proche de chaque côté
      if(!ua.near||d<ua.nearD){ ua.near=B; ua.nearD=d; }
      if(!ub.near||d<ub.nearD){ ub.near=A; ub.nearD=d; }
      if(!ra||!rb) continue;
      // --- salut de loin : un seul geste par rencontre, et on ne se resalue
      // pas toutes les dix secondes quand on travaille côte à côte
      if(d<17&&ua.state==='walk'&&(ua.seen[rb.id]||0)<now-40000&&!(ua.waveT>0)){
        ua.seen[rb.id]=now; ua.waveT=1.1;
        if(ub.state==='walk'&&Math.random()<0.6){ ub.seen[ra.id]=now; ub.waveT=1.1; }
      }
      // --- 2. contagion d'humeur : à force de se côtoyer, on déteint l'un sur l'autre
      const prox=1-d/SEE, bond=(ra.bond&&ra.bond[rb.id])||0;
      const pull=0.012*prox*(1+Math.min(bond,20)/20);
      const ma=moodOf(ra), mb=moodOf(rb);
      nudgeMood(ra,(mb-ma)*pull); nudgeMood(rb,(ma-mb)*pull);
      // --- 3. on s'évite après une brouille
      if((ua.avoid[rb.id]||0)>now||(ub.avoid[ra.id]||0)>now){
        if(d<TALK_D+6&&ua.state!=='talk'){
          const ax=A.position.x-B.position.x, az=A.position.z-B.position.z, n=Math.hypot(ax,az)||1;
          ua.tgt.set(A.position.x+ax/n*30,0,A.position.z+az/n*30); ua.talk=null; ua.state='walk';
        }
        continue;
      }
      // --- 4. assez près pour s'aborder ? Il faut que les DEUX en aient envie.
      if(d>TALK_D) continue;
      if(mode==='sleep') continue;
      // quelqu'un discute déjà : on peut se joindre au groupe si on en a envie
      if(ua.state==='talk'||ub.state==='talk'){
        const IN=ua.state==='talk'?A:B, OUT=ua.state==='talk'?B:A;
        const ui=IN.userData, uo=OUT.userData, ri=ui.rec, ro=uo.rec;
        const host=ui.talk||IN;                         // celui autour de qui le groupe se forme
        if(uo.state!=='talk'&&d<TALK_D-2&&now>=(uo.cool||0)&&ri&&ro
           &&groupSize(walkers,host)<3&&wantsToTalk(ro,ri,mode)&&Math.random()<0.5){

          uo.speaking=false; uo.turnT=1.2+Math.random();

      if(now<(ua.cool||0)||now<(ub.cool||0)) continue;
      if(!wantsToTalk(ra,rb,mode)||!wantsToTalk(rb,ra,mode)) continue;
      engage(A,B,now,mode);

}
/* deux habitants s'abordent : l'échange les transforme tous les deux */
function engage(A,B,now,mode){
  const ua=A.userData, ub=B.userData, ra=ua.rec, rb=ub.rec;
  ua.state=ub.state='talk'; ua.talk=B; ub.talk=A;
  ua.timer=ub.timer=5+Math.random()*5;
  ua.cool=ub.cool=now+9000;
  ua.v=ub.v=0;                                     // on s'arrête au lieu de glisser
  ua.turnT=0.1; ub.turnT=0.1;                      // le premier qui parle est tiré au sort tout de suite
  ua.speaking=Math.random()<0.5; ub.speaking=!ua.speaking;
  ua.clash=ub.clash=0;
  const out=meetOutcome(ra,rb);
  // pastille réservée aux moments qui se voient de loin : coup de cœur et friction.
  // Une conversation ordinaire se lit à la posture, pas à un marqueur flottant.
  const col={love:0xff2d55, clash:0xff4500}[out];
  if(col) [ua,ub].forEach(u=>{ if(u.badge){ u.badge.userData.dot.material.color.setHex(col);
    u.badge.visible=true; u.badgeT=u.badgeMax=out==='love'?3.4:2.4; } });
  if(out==='clash'){
    ua.clash=ub.clash=1;
    noteClash(ra,rb);
    nudgeMood(ra,-0.22); nudgeMood(rb,-0.22);
    ua.avoid[rb.id]=now+45000; ub.avoid[ra.id]=now+45000;
    ua.timer=ub.timer=1.6;
    sayMeet(A,B,t('⚡ ','⚡ ')+ra.name+t(' hausse le ton contre ',' snaps at ')+rb.name+'.',
                 '⚡ '+ra.name+' snaps at '+rb.name+'.');
    relate(ra,rb);
    return;
  }
  relate(ra,rb);
  if(out==='love'){
    nudgeMood(ra,0.2); nudgeMood(rb,0.2);
    tryBaby(ra,rb);
    sayMeet(A,B,'💛 '+ra.name+t(' et ',' and ')+rb.name+t(' se retrouvent.',' meet up.'),
                '💛 '+ra.name+' and '+rb.name+' meet up.');
  }else{
    nudgeMood(ra,out==='warm'?0.12:0.07); nudgeMood(rb,out==='warm'?0.12:0.07);
    // le grognon plombe son interlocuteur, le bavard le remonte
    if(ra.tr==='grognon') nudgeMood(rb,-0.1);
    if(rb.tr==='grognon') nudgeMood(ra,-0.1);
    if(ra.tr==='bavard') nudgeMood(rb,0.05);
    if(rb.tr==='bavard') nudgeMood(ra,0.05);
    if(Math.random()<0.55) villagerSay(Math.random()<0.5?A:B);
  }
  // influence : un travailleur de bonne humeur entraîne l'autre au boulot
  const lead=(ra.tr==='travailleur'&&moodOf(ra)>0.6)?ua:(rb.tr==='travailleur'&&moodOf(rb)>0.6)?ub:null;
  if(lead&&mode==='work'&&Math.random()<0.5){
    const foll=lead===ua?ub:ua;
    foll.followUp={x:lead.home.x,z:lead.home.z};
  }
}

        if(u.stuckT>3){

          const mode=routine();
          if(u.state==='talk'){                  // on se quitte : petit signe, pas de téléportation
            u.waveT=u.clash?0:0.9; u.clash=0; u.speaking=false;
            if(u.talk&&u.talk.userData.talk===p) u.talk.userData.talk=null;

            // les autres écourtent et se dispersent au lieu de le suivre
            built.walkers.forEach(w=>{ if(w!==p&&w.userData.talk===p){
              w.userData.talk=null; w.userData.timer=Math.min(w.userData.timer,0.6+Math.random()*0.9); }});
            u.talk=null;
          }
          const social=(mode==='social'||mode==='eat');
          const chatChance=social?0.75:(u.rec&&u.rec.tr==='bavard'?0.55:0.35);
          if(mode==='sleep'){                                   // rentrer se coucher
            u.tgt.set(u.bed.x+(Math.random()-0.5)*6,0,u.bed.z+(Math.random()-0.5)*6); u.talk=null;
          }else if(Math.random()<chatChance&&built.walkers.length>1){   // aller VOIR quelqu'un
            // on se dirige vers lui ; l'échange ne se déclenchera que si les
            // deux en ont envie une fois à portée (voir perceiveAll)
            const cand=built.walkers.filter(w=>{
              if(w===p||!w.userData.rec||!u.rec) return false;
              return (u.avoid[w.userData.rec.id]||0)<=now;
            });
            const pref=cand.filter(w=>{ const r=w.userData.rec;
              return u.rec.love===r.id||((u.rec.bond&&u.rec.bond[r.id])||0)>=6; });
            const pool=(pref.length&&Math.random()<0.7)?pref:cand;
            const o=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
            if(o){ u.tgt.set(o.position.x+4,0,o.position.z+4); u.talk=null; }
            else { u.tgt.set(u.home.x,0,u.home.z); u.talk=null; }
          }else if(social){                                     // veillée autour du feu / banquet
            const f=built.spots.find(x=>x.job==='feu')||u.home;
            u.tgt.set(f.x+(Math.random()-0.5)*16,0,f.z+(Math.random()-0.5)*16); u.talk=null;
          }else if(u.rec&&isChild(u.rec)&&Math.random()<0.55){   // un enfant ne s'éloigne pas de ses parents
            const par=parentsOf(u.rec).map(pp=>built.walkers.find(w=>w.userData.rec&&w.userData.rec.id===pp.id)).filter(Boolean);
            const anchor=par.length?par[Math.floor(Math.random()*par.length)]:null;
            if(anchor) u.tgt.set(anchor.position.x+(Math.random()-0.5)*18,0,anchor.position.z+(Math.random()-0.5)*18);
            else u.tgt.set(u.home.x+(Math.random()-0.5)*20,0,u.home.z+(Math.random()-0.5)*20);
            u.talk=null;
          }else if(u.followUp){                                 // entraîné au travail par un collègue
            u.tgt.set(u.followUp.x+(Math.random()-0.5)*10,0,u.followUp.z+(Math.random()-0.5)*10);
            u.talk=null; u.followUp=null;
          }else if(u.rec&&u.rec.love&&Math.random()<0.35
                   &&built.walkers.some(w=>w.userData.rec&&w.userData.rec.id===u.rec.love)){
            const lv=built.walkers.find(w=>w.userData.rec&&w.userData.rec.id===u.rec.love);
            u.tgt.set(lv.position.x+(Math.random()-0.5)*12,0,lv.position.z+(Math.random()-0.5)*12); u.talk=null;
          }else{                                                // retourner travailler à SON poste
            const mine=built.spots.filter(x=>x.job===u.job.k);
            const h=mine.length?(Math.random()<0.8?u.home:mine[Math.floor(Math.random()*mine.length)])
                              :(Math.random()<0.75?u.home:built.spots[Math.floor(Math.random()*built.spots.length)]);
            u.tgt.set(h.x+(Math.random()-0.5)*8,0,h.z+(Math.random()-0.5)*8); u.talk=null;
          }
          // on ne se donne jamais un point d'arrivée situé dans un bâtiment
          const free=pushOutOfSolids(u.tgt.x,u.tgt.z,bodyR(p)*0.6);
          u.tgt.set(free[0],0,free[1]);
          u.state='walk';
        }
      }
    });
    separateWalkers(built.walkers,dt);
    avoidSolids(built.walkers,dt);
    scene.traverse(o=>{ if(o.name==='walker'){ o.position.y=Math.abs(Math.sin(tt*5+o.userData.p))*0.9; } });
    if(V3.saveSoon&&now-(V3.savedAt||0)>4000){ V3.saveSoon=0; V3.savedAt=now; save(); }
    ren.render(scene,cam);
    V3.raf=requestAnimationFrame(loop);
  };
  loop();
}

function miniStop(){

  if(MINI.ren){ MINI.ren.dispose(); MINI.ren.forceContextLoss&&MINI.ren.forceContextLoss(); MINI.ren=null; }
  MINI.items=[];
}
function mini3d(id){ return '<span class="v3mini"><canvas class="v3mc" data-id="'+id+'"></canvas></span>'; }
function miniInit(){

  if(!cvs.length||typeof THREE==='undefined') return;
  const W=58,H=52,DPR=Math.min(devicePixelRatio||1,2);

  const ren=new THREE.WebGLRenderer({canvas:off,antialias:true,alpha:true});
  ren.setPixelRatio(DPR); ren.setSize(W,H,false); MINI.ren=ren;
  cvs.forEach((cv,i)=>{

  });
  const drawOne=it=>{
    it.cam.position.set(it.ctr.x+Math.sin(it.a)*it.rad*2.2, it.ctr.y+it.rad*1.5,
                        it.ctr.z+Math.cos(it.a)*it.rad*2.2*(it.ring?0.85:1)+(it.ring?it.rad*1.6:0));
    it.cam.lookAt(it.ctr.x,it.ctr.y*0.6+(it.ring?it.ctr.y*0.4:0),it.ctr.z);

    it.ctx.drawImage(off,0,0,it.cw,it.ch);
  };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ MINI.items.forEach(drawOne); return; }
  let last=0;

    if(!MINI.ren) return;
    if(ts-last>33){ last=ts; MINI.items.forEach(it=>{ it.a+=0.02; drawOne(it); }); }
    MINI.raf=requestAnimationFrame(loop);
  };

}
/* ---------- emprise au sol des bâtiments ----------
   Rayon approximatif de chaque article : deux constructions ne peuvent plus
   se traverser, on les repousse l'une hors de l'autre. */
const FOOT={
  feu:9, hutte:13, ble:22, poule:10, puits:9, chasseur:13, fermier:20, bucheron:12,
  chemin:10, menhir:6, sanglier:8, forge:13, taverne:16, chaudron:7, banquet:14,
  druide:5, chef:5, barde:5, chien:4, camp:14, entrainement:16, guerriers:9,
  tour:9, catapulte:9, chefguerre:6
};
/* enceintes et dallage : pas d'emprise au sol. Un chemin est à plat, on doit
   pouvoir le glisser sous un bâtiment ou coller deux dalles bout à bout. */
const NOCLIP={muraille:1, palissade:1, chemin:1};
/* la troupe est faite d'hommes, pas de murs : elle ne compte pas comme obstacle
   — sans quoi elle se heurterait à elle-même en cherchant où se ranger */
const NOTSOLID={guerriers:1, chefguerre:1};
function footOf(key){
  const base=String(key).split('#')[0];
  return FOOT[base]||10;
}
/* toutes les constructions posées, sauf celle qu'on déplace */
function occupants(exceptKey){
  const out=[];
  Object.keys(V3.place||{}).forEach(k=>{
    if(k===exceptKey||NOCLIP[String(k).split('#')[0]]) return;
    const g=V3.place[k]; if(!g) return;
    out.push({x:g.position.x, z:g.position.z, r:footOf(k)});
  });
  return out;
}
/* repousse (x,z) hors de tout ce qui est déjà posé ; renvoie la position libre */
function resolveOverlap(x,z,r,exceptKey,iterations){
  const others=occupants(exceptKey);
  let px=x, pz=z;
  for(let it=0;it<(iterations||12);it++){
    let moved=false;
    for(const o of others){
      const dx=px-o.x, dz=pz-o.z;
      const need=r+o.r;
      let d=Math.hypot(dx,dz);
      if(d>=need) continue;
      if(d<0.001){ const a=Math.random()*Math.PI*2; px=o.x+Math.cos(a)*(need+0.4); pz=o.z+Math.sin(a)*(need+0.4); }
      else{ const push=(need+0.4-d)/d; px+=dx*push; pz+=dz*push; }
      moved=true;
    }
    if(!moved) break;
  }
  const R=Math.hypot(px,pz);
  if(R>300){ px=px/R*300; pz=pz/R*300; }      // on reste dans la clairière
  return [px,pz];
}
/* Passe de relaxation globale : résoudre les collisions une par une pendant la
   construction ne suffit pas (dégager A de B peut le pousser dans C). On
   relâche donc tout le village ensemble à la fin. */
function relaxVillage(rounds){
  const keys=Object.keys(V3.place||{}).filter(k=>!NOCLIP[String(k).split('#')[0]]);
  const P=keys.map(k=>({k, g:V3.place[k], r:footOf(k)}));
  for(let it=0;it<(rounds||24);it++){
    let moved=false;
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      const A=P[i], B=P[j], need=A.r+B.r;
      let dx=A.g.position.x-B.g.position.x, dz=A.g.position.z-B.g.position.z;
      let d=Math.hypot(dx,dz);
      if(d>=need) continue;
      if(d<0.001){ const a=(i*2.399+j)%6.283; dx=Math.cos(a); dz=Math.sin(a); d=1; }
      // on écarte les deux à parts égales : personne n'a la priorité
      const push=(need-d)/d/2;
      A.g.position.x+=dx*push; A.g.position.z+=dz*push;
      B.g.position.x-=dx*push; B.g.position.z-=dz*push;
      moved=true;
    }
    // on garde tout le monde dans la clairière
    P.forEach(o2=>{ const R=Math.hypot(o2.g.position.x,o2.g.position.z);
      if(R>300){ o2.g.position.x=o2.g.position.x/R*300; o2.g.position.z=o2.g.position.z/R*300; moved=true; } });
    if(!moved) break;
  }
}
/* ---------- obstacles que les habitants ne peuvent pas traverser ----------
   Champs, sentiers et terrain d'entraînement se marchent dessus ; le reste est
   solide. Le rayon solide est plus petit que l'emprise de placement : on veut
   pouvoir longer un mur et se tenir devant sa porte, pas rebondir à 10 m. */
const WALKABLE={ble:1, chemin:1, entrainement:1, muraille:1, palissade:1};
/* ---------- toucher « au plus proche » ----------
   Sur un téléphone le doigt couvre plus large qu'un toit de hutte. Si le rayon
   ne touche rien, on regarde ce qui se trouve autour du point du sol visé. */
function nearestBuilding(x,z){
  let best=null, bd=1e9;
  Object.keys(V3.place||{}).forEach(k=>{
    const g=V3.place[k]; if(!g) return;
    const r=footOf(k)*0.7+10;
    const d=Math.hypot(g.position.x-x, g.position.z-z);
    if(d<r&&d<bd){ bd=d; best=k; }
  });
  return best;
}
function nearestWalker(x,z,r){
  const W=(V3.built&&V3.built.walkers)||[];
  let best=null, bd=r;
  for(const w of W){
    const d=Math.hypot(w.position.x-x, w.position.z-z);
    if(d<bd){ bd=d; best=w; }
  }
  return best;
}
function rebuildSolids(){
  const out=(V3.statics||[]).slice();
  Object.keys(V3.place||{}).forEach(k=>{
    const base=String(k).split('#')[0];
    if(NOCLIP[base]||WALKABLE[base]||NOTSOLID[base]) return;
    const g=V3.place[k]; if(!g) return;
    out.push({x:g.position.x, z:g.position.z, r:footOf(k)*0.62});
  });
  V3.solids=out;
}
/* renvoie le point libre le plus proche de (x,z) */
function pushOutOfSolids(x,z,body){
  const S2=V3.solids||[];
  for(let it=0;it<6;it++){
    let moved=false;
    for(const o of S2){
      const need=o.r+(body||0);
      const dx=x-o.x, dz=z-o.z;
      let d=Math.hypot(dx,dz);
      if(d>=need) continue;
      if(d<0.001){ x=o.x+need; z=o.z; }
      else{ const k=(need-d)/d; x+=dx*k; z+=dz*k; }
      moved=true;
    }
    if(!moved) break;
  }
  return [x,z];
}
/* contournement : plutôt que de s'écraser contre un mur, on le longe.
   On repère l'obstacle le plus proche DEVANT soi et on suit sa tangente. */
function steerAround(x,z,ux,uz,body,goal,u){
  const S2=V3.solids||[]; if(!S2.length) return [ux,uz];
  // On ne contourne QUE ce qui barre vraiment la route : un obstacle devant
  // nous mais décalé sur le côté se dépasse tout seul. Sans ce filtre on
  // s'écarte de tout ce qui traîne dans le cône de marche et on tourne autour
  // du village au lieu d'arriver.
  const LOOK=14;
  let best=null, bd=1e9, blat=0;
  for(const o of S2){
    const dx=o.x-x, dz=o.z-z;
    const ahead=dx*ux+dz*uz;
    if(ahead<=0) continue;                       // il est derrière nous
    if(goal!=null&&ahead>goal+o.r) continue;     // il est au-delà du but
    if(ahead>o.r+body+LOOK) continue;            // encore loin
    const lat=Math.abs(dx*(-uz)+dz*ux);          // décalage latéral
    if(lat>o.r+body+1.5) continue;               // on passe à côté sans le toucher
    if(ahead<bd){ bd=ahead; best=o; blat=lat; }
  }
  if(!best){ if(u) u.avoidO=null; return [ux,uz]; }
  const dx=x-best.x, dz=z-best.z, d=Math.hypot(dx,dz)||1;
  const tx=-dz/d, tz=dx/d;                       // tangente à l'obstacle
  // on choisit un côté UNE fois et on s'y tient tant que le même obstacle
  // barre la route : sinon on hésite entre les deux et on tourne en rond
  let side;
  if(u&&u.avoidO===best) side=u.avoidS;
  else{ side=(tx*ux+tz*uz>=0)?1:-1; if(u){ u.avoidO=best; u.avoidS=side; } }
  // plus il est proche et plus il est pile en face, plus on braque
  const near=Math.max(0,1-bd/(best.r+body+LOOK));
  const face=Math.max(0,1-blat/(best.r+body+1.5));
  const w=0.35+1.05*near*face;
  const mx=tx*side*w+ux, mz=tz*side*w+uz;
  const m=Math.hypot(mx,mz)||1;
  return [mx/m,mz/m];
}
/* chaque image : personne ne rentre dans un mur ni dans un tronc */
function avoidSolids(walkers,dt){
  const S2=V3.solids||[]; if(!S2.length) return;
  const k=Math.min(1,22*dt);
  for(const w of walkers){
    const body=bodyR(w)*0.6;
    for(const o of S2){
      const need=o.r+body;
      const dx=w.position.x-o.x, dz=w.position.z-o.z;
      const d2=dx*dx+dz*dz;
      if(d2>=need*need) continue;
      const d=Math.sqrt(d2)||0.001;
      const push=(need-d)/d*k;
      w.position.x+=dx*push; w.position.z+=dz*push;
    }
  }
}
/* ---------- un sentier se raccorde tout seul ----------
   Une dalle posée à côté d'une autre pivote pour prolonger le chemin. Le grand
   axe de la dalle est son axe X local ; pour l'orienter selon (dx,dz) il faut
   theta = atan2(-dz, dx). On arrondit au multiple de 45° pour des virages nets. */
const PATH_LINK=40;
function orientPath(key){
  const g=V3.place&&V3.place[key]; if(!g) return null;
  let best=null, bd=PATH_LINK;
  Object.keys(V3.place).forEach(k=>{
    if(k===key||String(k).split('#')[0]!=='chemin') return;
    const o2=V3.place[k];
    const d=Math.hypot(o2.position.x-g.position.x, o2.position.z-g.position.z);
    if(d<bd){ bd=d; best=o2; }
  });
  if(!best) return null;
  const dx=g.position.x-best.position.x, dz=g.position.z-best.position.z;
  let a=Math.atan2(-dz,dx);
  const step=Math.PI/4;
  a=Math.round(a/step)*step;
  g.rotation.y=a;
  const TAU=Math.PI*2;
  S.vrot=S.vrot||{}; S.vrot[key]=+(((a%TAU)+TAU)%TAU).toFixed(4);
  // la dalle voisine s'aligne aussi, pour que le raccord soit franc
  const nk=best.userData.pid;
  if(nk){ best.rotation.y=a;
    S.vrot[nk]=+(((a%TAU)+TAU)%TAU).toFixed(4); }
  return a;
}

/* ---------- fiche d'un bâtiment ----------
   Ce que c'est, à quoi ça sert, qui l'habite, ce que ça coûte et ce que ça rapporte. */
function buildingLabel(key){
  const base=String(key).split('#')[0], it=SHOP.find(x=>x.id===base);
  if(!it) return String(key);
  const num=String(key).includes('#') ? ' n°'+(+String(key).split('#')[1]+1) : (nOwned(base)>1?' n°1':'');
  return t(it.n,it.ne)+num;
}
function showBuilding(key){
  const base=String(key).split('#')[0], it=SHOP.find(x=>x.id===base);
  if(!it){ toast(t('Rien à dire sur cet élément.','Nothing to say about this one.')); return; }
  const n=nOwned(base);
  const rows=[];
  const row=(k,v)=>rows.push('<b>'+k+' :</b> '+v+'<br>');

  // à quoi ça sert
  if(it.d) row(t('Rôle','Purpose'),'<i>'+esc(t(it.d,it.de||it.d))+'</i>');
  // logement ou lieu de travail : la distinction décide si un habitant arrive
  if(DWELL[base]) row(t('Type','Type'),'🏠 '+t('Logement — loge un habitant du village','Home — houses a villager'));
  else if(HOUSED[base]) row(t('Type','Type'),'🔨 '+t('Lieu de travail — on n\'y dort pas','Workplace — nobody sleeps here'));
  if(it.cat==='army') row(t('Catégorie','Category'),'⚔️ '+t('Militaire','Military'));

  // production et besoins couverts
  if(it.prod){
    const IC={food:'🌾',wood:'🪵',iron:'⚙️'};
    row(t('Production','Output'), Object.keys(it.prod).map(k=>'+'+it.prod[k]+' '+IC[k]+'/h').join(' · '));
  }
  const fills=NEEDS.filter(nd=>(nd.go||'').includes(base)||new RegExp(esc(t(it.n,it.ne)),'i').test(t(nd.src,nd.srce)));
  if(fills.length) row(t('Comble le besoin','Fills the need'), fills.map(nd=>nd.ic+' '+esc(t(nd.n,nd.ne))).join(', '));
  if(it.pw) row(t('Puissance militaire','Military power'),'+'+it.pw);

  // ce qu'il a coûté
  const rc=it.rc?Object.keys(it.rc).map(k=>it.rc[k]+' '+({food:'🌾',wood:'🪵',iron:'⚙️'})[k]).join(' · '):null;
  row(t('Prix','Price'), priceOf(it)+' 🪙'+(rc?' + '+rc:''));
  if(it.stack) row(t('Tu en possèdes','You own'), n+' '+(n>1?t('exemplaires','of these'):t('exemplaire','of these')));

  // qui vit là : le foyer entier, couple et enfants
  const foyer=(S.people||[]).filter(x=>x.home===key);
  foyer.sort((a,b)=>(isChild(a)?1:0)-(isChild(b)?1:0)||(a.born||0)-(b.born||0));
  let who='';
  if(foyer.length){
    row(t('Foyer','Household'), foyer.length+' '+(foyer.length>1?t('habitants','residents'):t('habitant','resident')));
    who=foyer.map(r=>{
      const job=JOBS.find(j=>j.k===r.job)||JOBS[JOBS.length-1];
      const H=happinessOf(r);
      const lv=loveOf(r);
      const sub=esc(isChild(r)?t('enfant','child'):t(job.n,job.ne))
        +(lv&&lv.home===key?' · 💛 '+t('en couple avec ','with ')+esc(nameOf(lv)):'')
        +' · '+moodIcon(r)+' '+H.pct+'%';
      return '<div class="bldocc"><span class="boic">'+(isChild(r)?'🧒':(job?job.ic:'🧑'))+'</span>'
        +'<span class="botx"><b>'+esc(nameOf(r))+'</b><br>'
        +'<span style="color:var(--dim)">'+sub+'</span></span>'
        +'<button class="sbuy" onclick="G.hideOverlay();G.showPerson('+JSON.stringify(r.id).replace(/"/g,'&quot;')+')">'
        +t('SA FICHE','PROFILE')+' →</button></div>';
    }).join('');
  }else if(DWELL[base]){
    who='<p class="small" style="margin:10px 0 0">'
      +(S.vacated&&S.vacated[key]
        ?t('Logement libre : ses occupants ont emménagé ailleurs. Un nouveau venu s\'y installera.',
           'Empty home: its occupants moved in elsewhere. A newcomer will settle here.')
        :t('Personne n\'habite encore ici.','Nobody lives here yet.'))+'</p>';
  }

  // position
  const g=V3.place&&V3.place[key];
  if(g) row(t('Emplacement','Location'), Math.round(g.position.x)+', '+Math.round(g.position.z));

  showOverlay(it.ic, buildingLabel(key),
    '<div style="text-align:left;font-size:13.5px;line-height:1.7">'+rows.join('')+'</div>'
    +who
    +'<div class="menu" style="margin-top:12px">'
    +(V3.edit?'':'<button class="btn btn-ghost" style="justify-content:center" onclick="G.hideOverlay();G.toggleEdit('
       +JSON.stringify(String(key)).replace(/"/g,'&quot;')+')">🔧 '
       +t('Déplacer / orienter','Move / turn')+'</button>')
    +(it.stack&&canAfford(it)&&S.coins>=priceOf(it)
       ?'<button class="btn btn-exit" style="justify-content:center" onclick="G.hideOverlay();G.buy(\''+base+'\')">'
        +it.ic+' '+t('En construire un autre','Build another')+' — '+priceOf(it)+' 🪙</button>':'')
    +'</div>');
}

function rallyAt(x,z){
  S.army=S.army||{x:null,z:null,f:'ligne'};
  const r=Math.hypot(x,z);
  if(r>250){ x=x/r*250; z=z/r*250; }
  // la troupe se range SUR le terrain, jamais dans un mur : le rayon couvre
  // toute la formation, sinon les guerriers des ailes finiraient dans un toit
  const free=armySpot(x,z);
  const moved=Math.hypot(free[0]-x, free[1]-z)>1;
  S.army.x=+free[0].toFixed(1); S.army.z=+free[1].toFixed(1);
  save(); SFX.win(); V3.order=false;
  toast(moved
    ? t('⚔️ Pas de place ici — la troupe se range juste à côté.','⚔️ No room there — the squad forms up right beside it.')
    : t('⚔️ La troupe se met en position !','⚔️ The squad takes position!'));
  render();
}
function armyRecall(){
  S.army=S.army||{x:null,z:null,f:'ligne'};
  S.army.x=null; S.army.z=null; save(); SFX.click();
  toast(t('🏕️ La troupe regagne son cantonnement.','🏕️ The squad returns to quarters.'));
  render();
}
/* ---------- orienter un bâtiment ----------
   On retient la CLÉ du bâtiment, jamais l'objet 3D : la scène est reconstruite
   à chaque achat, chaque ordre à l'armée, chaque retour au village, et une
   référence gardée trop longtemps pointe alors sur un groupe jeté — on tournait
   dans le vide. On recale aussi l'angle sur la grille de 15° pour que dix appuis
   fassent exactement 150°, sans dérive. */
const ROT_STEP=Math.PI/12;                      // 15° par appui
function selectedBuilding(){
  if(V3.sel&&V3.sel.parent) return V3.sel;
  const k=V3.lastPid;
  return (k&&V3.place&&V3.place[k])||null;
}
function rotSel(dir){
  const g=selectedBuilding();
  if(!g){ toast(t('👆 Touche d\'abord un bâtiment, puis tourne-le.',
                  '👆 Tap a building first, then turn it.')); return; }
  const key=g.userData.pid;
  V3.lastPid=key;
  const snapped=Math.round(g.rotation.y/ROT_STEP)*ROT_STEP;
  let a=snapped+dir*ROT_STEP;
  const TAU=Math.PI*2;
  a=((a%TAU)+TAU)%TAU;
  g.rotation.y=a;
  S.vrot=S.vrot||{}; S.vrot[key]=+a.toFixed(4);
  markSel(g);
  save(); SFX.click();
  if(V3.sun) V3.sun.shadow.needsUpdate=true;
  toast(buildingLabel(key)+' · '+Math.round(a*180/Math.PI)+'°');
}
/* l'anneau montre ce qu'on est en train d'orienter */
function markSel(g){
  if(!V3.ring||!g) return;
  V3.ring.visible=true;
  V3.ring.position.set(g.position.x,0.4,g.position.z);
  V3.ring.scale.setScalar(footOf(g.userData.pid)/5);
}

function buy(id){
  const it=SHOP.find(s=>s.id===id); if(!it) return;
  if(!it.stack&&S.village.includes(id)) return;
  if(it.req&&!S.village.includes(it.req)){
    const r=SHOP.find(x=>x.id===it.req)||{};
    SFX.ko(); toast('🔒 '+t('Il te faut d\'abord : ','You first need: ')+'<b>'+esc(t(r.n,r.ne))+'</b>'); return; }
  const rc=resCost(it);
  if(rc&&!canAfford(it)){
    const miss=Object.keys(rc).filter(k=>(S.res[k]||0)<rc[k])
      .map(k=>(rc[k]-(S.res[k]||0))+' '+({food:'🌾',wood:'🪵',iron:'⚙️'})[k]).join(', ');
    SFX.ko(); toast('🪵 '+t('Matériaux insuffisants ! Il manque : ','Not enough materials! Missing: ')+'<b>'+miss+'</b>');
    return; }
  const cost=priceOf(it);
  if(S.coins<cost){ SFX.ko(); toast(t('🪙 Pas assez de sesterces ! Il t\'en manque '+(cost-S.coins)+'. Va répondre à des questions !','🪙 Not enough sesterces! You need '+(cost-S.coins)+' more. Go answer questions!')); return; }
  S.coins-=cost;
  if(rc){ Object.keys(rc).forEach(k=>{ S.res[k]=(S.res[k]||0)-rc[k]; }); }
  if(it.stack){ S.stack=S.stack||{}; S.stack[id]=(S.stack[id]||0)+1;
                if(!S.village.includes(id)) S.village.push(id); }
  else S.village.push(id);
  // seul un LOGEMENT fait arriver quelqu'un ; un champ ouvre juste un poste
  let arrival=null;
  {
    const before=(S.people||[]).map(p=>p.id);
    syncPeople();                       // recense, reloge et réattribue les postes
    if(DWELL[id]) arrival=(S.people||[]).find(p=>!before.includes(p.id))||null;
  }
  checkDreams(); questEvent('build',id);
  save(); checkBadges();
  SFX.win(); confetti(S.village.length>=SHOP.length?250:60);
  if(arrival){
    const where=homeLabel(arrival);
    chron(arrival.name+' est arrivé au village ('+where+').',arrival.name+' arrived in the village ('+where+').');
    toast(it.ic+' <b>'+esc(arrival.name)+'</b> '+t('s\'installe : ','moves in: ')+esc(where)
      +'<br><i style="color:var(--dim)">« '+esc(t(arrival.bio||'',arrival.bioe||''))+' »</i>');
  }else if(it.id==='chemin'){
    const n2=nOwned('chemin'), key=n2>1?'chemin#'+(n2-1):'chemin';
    const a=orientPath(key); if(a!=null) save();
    toast(it.ic+' '+t('Dalle posée au centre du village — touche <b>DÉPLACER</b> pour la glisser où tu veux.',
                      'Slab laid at the centre of the village — tap <b>MOVE</b> to drag it wherever you like.'));
  }else if(HOUSED[id]){
    const j=JOBS.find(x=>x.k===HOUSED[id]);
    const who=(S.people||[]).find(x=>x.job===HOUSED[id]&&!isChild(x));
    toast(it.ic+' '+t('« '+t(it.n,it.ne)+' » construit ! ','"'+t(it.n,it.ne)+'" built! ')
      +(who?t('<b>'+esc(nameOf(who))+'</b> y prend son poste de '+t(j.n,j.ne).toLowerCase()+'.',
              '<b>'+esc(nameOf(who))+'</b> takes up the post of '+t(j.n,j.ne).toLowerCase()+'.')
           :t('Un poste de '+t(j.n,j.ne).toLowerCase()+' attend un habitant — construis une hutte.',
              'A '+t(j.n,j.ne).toLowerCase()+' post is waiting for a villager — build a hut.')));
  }else{
    toast(it.ic+' '+t('« '+t(it.n,it.ne)+' » construit au village !','"'+t(it.n,it.ne)+'" built in the village!'));
  }
  render();
}

// Score de douleur : privilégie les questions ratées souvent ET avec un fort taux d'échec.
/* ---------- questions marquées à la main ----------
   « J'ai eu bon, mais je ne la sens pas » : un clic et elle rejoint la Bête Noire. */
function isFlagged(i){ return !!(S.flag&&S.flag[i]); }
function flagCount(){ return Object.keys(S.flag||{}).length; }
function toggleFlag(i,ev){
  if(ev&&ev.stopPropagation) ev.stopPropagation();
  S.flag=S.flag||{};
  if(S.flag[i]){ delete S.flag[i]; SFX.click();
    toast(t('☆ Retirée de ta Bête Noire.','☆ Removed from your Nemesis list.')); }
  else{ S.flag[i]=Date.now(); SFX.ok();
    toast(t('⭐ Ajoutée à ta Bête Noire — tu la reverras à l\'entraînement.',
            '⭐ Added to your Nemesis list — you\'ll see it again in drills.')); }
  save(); render();
}
/* bouton compact, réutilisé partout où une réponse est révélée */
function flagBtn(i,compact){
  const on=isFlagged(i);
  return '<button class="flagbtn'+(on?' on':'')+'" onclick="G.toggleFlag('+i+',event)" '
   +'aria-pressed="'+(on?'true':'false')+'" title="'+t('Marquer comme difficile','Mark as hard')+'">'
   +(on?'★ ':'☆ ')
   +(compact?'':(on?t('Dans ma Bête Noire','In my Nemesis'):t('Trop dure — à revoir','Too hard — review it')))
   +'</button>';
}
function nemesisPool(){
  return allTrackable()
    .map(o=>{ const s=S.qstat[o.i], man=isFlagged(o.i);
      if((!s||!s.ko)&&!man) return null;
      const ko=(s&&s.ko)||0, ok=(s&&s.ok)||0, tot=ok+ko, rate=tot?ko/tot:0;
      // une question marquée à la main compte comme deux échecs : elle remonte
      // en tête même si tu ne l'as jamais ratée
      return {...o, ko, ok, tot, rate, box:(s&&s.box)||0, man,
              score:ko*(0.5+rate)+(man?2.2:0)}; })
    .filter(Boolean)
    .sort((a,b)=>b.score-a.score);
}

/* les pires N, PLUS tout ce que tu as marqué à la main : une question
   marquée ne doit jamais se faire éjecter par des erreurs plus récentes */
function nemesisDeck(n){
  const pool=nemesisPool();
  const top=pool.slice(0,n);
  pool.forEach(o=>{ if(o.man&&!top.includes(o)) top.push(o); });
  return top;
}

}

function nextDrill(){
  const c=CUR;
  if(c.di>=c.deck.length){ c.deck=blitzDeck(); c.di=0; }

    c.t--;

    if(c.t<=0){ endBlitz(); return; }
    const el=$('#timer'); if(el){ el.textContent=c.t+'s'; el.classList.toggle('low',c.t<=10); }

  recordAnswer(drillId(entry.i), good);
  if(good){

  c.di++; nextDrill(); render();

function examAnswer(pos){
  const c=CUR;
  SFX.click();
  const good=c.order[pos]===0;
  c.answers.push({qi:c.qs[c.i].i, good});
  recordAnswer(c.qs[c.i].i, good);
  bumpCombo(good);
  if(c.i+1<c.qs.length){ c.i++; c.order=null; render(); }
  else{
    S.examsTaken++;
    const score=c.answers.filter(a=>a.good).length;
    const pass=score>=c.need;
    questEvent('exam',Math.round(score/c.qs.length*100));
    if(c.mode==='hard'){ if(score>S.examHardBest) S.examHardBest=score; }
    else if(c.mode==='nemesis'){ /* pas de record : le pool change tout le temps */ }
    else if(c.mode==='eclair'){ if(score>S.examEclairBest) S.examEclairBest=score; }
    else{ if(score>S.examBest) S.examBest=score; if(pass) S.examPassed=true; }
    gainCoins(score+(pass?50:0));
    villageReact('exam',score/c.qs.length); checkDreams();
    save(); checkBadges();
    gainXp(score*2+(pass?(c.mode==='full'?200:100):0));
    go('examEnd',{score, answers:c.answers, mode:c.mode, need:c.need, total:c.qs.length,
      res0:c.res0, coins0:c.coins0});
  }
}

    const idx=Q.map((q,i)=>i).filter(i=>Q[i].w===w.id);
    idx.forEach(i=>{ const st=S.qstat[i]; if(!st) return;
      seen++; ok+=st.ok||0; ko+=st.ko||0;
      if(st.box>=3) tamed++; if(st.box===1&&st.ko>0) hot++; });
    const tot=ok+ko;
    return {id:w.id, ic:w.icon, name:wn(w), total:idx.length, seen, ok, ko, tot,
            acc:tot?ok/tot:null, mastery:mastery(w.id), tamed, hot};
  });
  // le Blitz compte comme un domaine à part entière
  let bok=0, bko=0, bseen=0, btamed=0, bhot=0;
  DRILLS.forEach((d,i)=>{ const st=S.qstat[drillId(i)]; if(!st) return;
    bseen++; bok+=st.ok||0; bko+=st.ko||0;
    if(st.box>=3) btamed++; if(st.box===1&&st.ko>0) bhot++; });
  const btot=bok+bko;
  out.push({id:'blitz', ic:'⚡', name:t('Les Petites Règles','The Little Rules'),
            total:DRILLS.length, seen:bseen, ok:bok, ko:bko, tot:btot,
            acc:btot?bok/btot:null, mastery:DRILLS.length?Math.round(btamed/DRILLS.length*100):0,
            tamed:btamed, hot:bhot});
  return out;
}
/* couverture globale de la banque */
function coverage(){
  const total=Q.length+DRILLS.length;
  let seen=0, tamed=0, hot=0, warm=0;
  const scan=id=>{ const st=S.qstat[id]; if(!st) return;
    seen++; if(st.box>=3) tamed++; else if(st.box===1&&st.ko>0) hot++; else warm++; };
  Q.forEach((q,i)=>scan(i));
  DRILLS.forEach((d,i)=>scan(drillId(i)));
  return {total, seen, tamed, hot, warm, never:total-seen};
}
/* estimation de la préparation, honnête : couverture ET fiabilité */
function readiness(){
  const c=coverage();
  const tot=S.totalOk+S.totalKo;
  const acc=tot?S.totalOk/tot:0;
  const cov=c.total?c.seen/c.total:0;
  const solid=c.total?c.tamed/c.total:0;
  const exam=S.examBest?Math.min(1,S.examBest/45):0;
  const r=Math.round((cov*0.2+acc*0.3+solid*0.3+exam*0.2)*100);
  return {pct:Math.max(0,Math.min(100,r)), cov, acc, solid, exam};
}

/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='4'){
    const pos=+e.key-1;
    if(CUR.screen==='run'&&!CUR.answered) answer(pos,{});
    else if(CUR.screen==='boss'&&!CUR.answered) bossAnswer(pos,{});
    else if(CUR.screen==='exam') examAnswer(pos);
    else if(CUR.screen==='blitz'&&CUR.phase==='play'&&pos<CUR.opts.length) blitzAnswer(pos,{});
  }
  if(e.key==='Escape'){
    if($('#overlay').classList.contains('show')){ hideOverlay(); return; }
    goHome(); return; }
  if(e.key==='Enter'){
    if(CUR.screen==='run'&&CUR.answered) next();
    else if(CUR.screen==='boss'&&CUR.answered) bossNext();
  }
});
