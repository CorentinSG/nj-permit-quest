{w:'dist',q:"The distance your vehicle travels between the moment you SEE a hazard and the moment you press the brake is called:",

{w:'dist',q:"You must use your turn signal:",

 x:"Le clignotant sert à ANNONCER, pas à commenter : virage, changement de voie, et même en quittant une place de stationnement.",

{w:'dist',q:"Before you leave your parked vehicle, New Jersey law requires you to:",

 x:"Moteur coupé, clé retirée, frein de stationnement serré. Laisser tourner le moteur sans surveillance est une infraction.",
 xe:"Engine off, key out, parking brake set. Leaving it running unattended is a violation."},
{w:'dist',q:"If you must leave a disabled vehicle on the roadway at night, you should:",

 x:"Feux de détresse + triangles/fusées en arrière du véhicule. Toi, tu attends HORS de la chaussée, derrière la glissière.",
 xe:"Hazards on and warning devices set out behind the vehicle. You wait OFF the roadway, behind the barrier."},

{w:'booze',q:"A DWI committed on or within 1,000 feet of school property brings:",

{w:'booze',q:"Can you be charged with DWI in New Jersey while the car is parked?",

 xe:"'Operating' does not mean 'moving'. Drunk, behind the wheel, key in hand and meaning to drive: that's enough."},

{w:'points',q:"The insurance surcharge for accumulating 6 or more points is billed:",
 a:["Every year for three years","Once only","Every year for life","Only if you are convicted again"],
 x:"La surtaxe tombe chaque année pendant TROIS ans. Un mauvais trimestre se paie trois fois.",
 xe:"The surcharge is billed every year for THREE years. One bad quarter gets paid for three times."},
{w:'points',q:"Parking tickets in New Jersey add:",

 x:"Le stationnement coûte de l'argent, pas des points. Les points ne sanctionnent que les infractions en mouvement.",

{w:'share',q:"You come upon a funeral procession. You must:",

{w:'share',q:"You come up behind slow-moving farm equipment on a rural road. You should:",

{w:'share',q:"A vehicle is merging onto the highway from an entrance ramp. If it is safe, you should:",

 x:"Se décaler d'une voie est la courtoisie qui évite l'accident. Si c'est impossible, ajuste ta vitesse pour ouvrir un trou.",
 xe:"Moving over one lane is the courtesy that prevents the crash. If you can't, adjust your speed to open a gap."},
{w:'share',q:"A vehicle is already in the intersection when you arrive. You must:",

{w:'share',q:"You are turning right and a bicyclist is going straight in a bike lane on your right. You must:",

{w:'share',q:"A school bus ahead turns on its flashing YELLOW lights. You should:",

{w:'surv',q:"Your accelerator sticks while driving. You should:",

{w:'surv',q:"Your vehicle catches fire. You should:",

{w:'surv',q:"At the scene of a crash, you should:",

 xe:"Moving an injured person can worsen a spinal injury. Call, protect the scene, and only move someone if there is fire."},

/* nombre d'exemplaires possédés (1 max sauf articles empilables) */
function nOwned(id){
  const it=SHOP.find(x=>x.id===id);
  if(it&&it.stack) return (S.stack&&S.stack[id])||0;
  return S.village.includes(id)?1:0;
}
/* prix courant : augmente à chaque exemplaire acheté */
function priceOf(it){
  if(!it.stack) return it.p;
  return Math.round(it.p*Math.pow(it.rate||1.22,nOwned(it.id)));
}
function hutCount(){ return nOwned('hutte'); }
/* coût en ressources : croît lui aussi pour les articles empilables */
function resCost(it){
  if(!it.rc) return null;
  const m=it.stack?Math.pow(1.18,nOwned(it.id)):1, out={};
  Object.keys(it.rc).forEach(k=>{ out[k]=Math.round(it.rc[k]*m); });
  return out;
}
function canAfford(it){
  const rc=resCost(it); if(!rc) return true;
  S.res=S.res||{food:0,wood:0,iron:0};
  return Object.keys(rc).every(k=>(S.res[k]||0)>=rc[k]);
}
function resLabel(rc){
  const ic={food:'🌾',wood:'🪵',iron:'⚙️'};
  return Object.keys(rc).map(k=>rc[k]+' '+ic[k]).join(' ');
}
const ARMY_MAX=132;   // puissance totale si tout est acheté
function armyPower(){ return SHOP.filter(i=>i.cat==='army'&&S.village.includes(i.id))
  .reduce((n,i)=>n+i.pw,0); }
function armyPct(){ return Math.min(100,Math.round(armyPower()/ARMY_MAX*100)); }

   ROUTE 440 — moteur de jeu
   Vanilla JS, aucun réseau, sauvegarde en localStorage.
   ============================================================ */

const DAILY_GOAL=30;

  xp:0, totalOk:0, totalKo:0, bestCombo:0, runsDone:0,

  quests:{day:'', list:[]},   // les doléances du jour
  vrot:{},             // clé de bâtiment -> orientation choisie (radians)
  vacated:{},          // logement libéré par un emménagement -> quand
  army:{x:null, z:null, f:'ligne'},   // point de rassemblement et formation
  flag:{},             // qid -> date : questions marquées « trop dure » à la main
  bossWins:{},         // worldId -> true
  blitzBest:0,
  examBest:0, examPassed:false, examsTaken:0,
  examEclairBest:0, examHardBest:0,
  coins:0, coinsTotal:0,   // sesterces 🪙
  res:{food:0,wood:0,iron:0},   // ressources gagnées en répondant juste
  needDay:'',                   // jour du dernier ravitaillement
  lastTribute:0,                // horodatage du dernier versement horaire
  lastProd:0,                   // horodatage de la dernière récolte automatique
  village:[],              // ids d'objets achetés, dans l'ordre
  vpos:{},                 // id -> [x,z] : placement libre par le joueur
  stack:{},                // id -> nombre d'exemplaires (huttes)
  people:[],               // habitants nommés et persistants
  arenaWins:0,
  daily:{date:'', ok:0, rewarded:false},
  dayStreak:0, lastGoalDate:'',
  badges:{},           // badgeId -> timestamp
  sound:true,
  lang:'fr',            // 'fr' = français + mètres · 'en' = anglais + unités US
  examDate:'2026-08-04', examTime:'14:00'
});
let S=load();
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return defaults();
    const parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)) return defaults();
    const d=defaults(), st=Object.assign(d, parsed);
    // une sauvegarde tronquée (écriture interrompue sur mobile) peut contenir
    // des null / mauvais types : on retombe sur la valeur par défaut champ par champ
    Object.keys(d).forEach(k=>{
      const ref=defaults()[k], v=st[k];
      if(v==null){ st[k]=ref; return; }
      if(Array.isArray(ref)!==Array.isArray(v)||typeof ref!==typeof v) st[k]=ref;
    });
    st.res=Object.assign({food:0,wood:0,iron:0},st.res);
    ['food','wood','iron'].forEach(k=>{ if(typeof st.res[k]!=='number'||!isFinite(st.res[k])) st.res[k]=0; });
    ['xp','coins','coinsTotal','totalOk','totalKo'].forEach(k=>{ if(typeof st[k]!=='number'||!isFinite(st[k])) st[k]=0; });
    st.people=st.people.filter(x=>x&&typeof x==='object');
    st.village=st.village.filter(x=>typeof x==='string');
    return st;
  }catch(e){ return defaults(); }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- langue & unités ---------- */
// t('français','english') → renvoie la chaîne dans la langue active
function t(fr,en){ return S.lang==='en' ? en : fr; }
function applyLang(){
  try{ document.documentElement.lang=(S.lang==='en'?'en':'fr'); }catch(e){}
}
// Convertit les unités impériales en métrique quand la langue est le français.
// En anglais, on garde les unités officielles US (ft, mph, lb, in).
function nfr(n){ // formate un nombre à la française (virgule, sans .0 inutile)
  let s=(Math.round(n*10)/10).toString();
  return S.lang==='en' ? s : s.replace('.',',');
}
function toMetric(s){
  if(typeof s!=='string'||S.lang==='en') return s;
  // Convertit les distances impériales (feet, inches) en métrique.
  // Les mph et lb restent tels quels (unités natives de la conduite au NJ).
  return s.replace(
    /(\d+(?:[.,]\d+)?)(?:\s*(?:–|—|-|to|à)\s*(\d+(?:[.,]\d+)?))?\s*(feet|foot|ft|inches|inch|in)\b/gi,
    (m,a,b,unit)=>{
      const u=unit.toLowerCase();
      const n1=parseFloat(a.replace(',','.'));
      const n2=(b!=null)?parseFloat(b.replace(',','.')):null;
      const rng=(f,suf)=> nfr(f(n1))+(n2!=null?'–'+nfr(f(n2)):'')+' '+suf;
      if(u==='in'||u==='inch'||u==='inches')  return rng(v=>Math.round(v*2.54),'cm');
      return rng(v=>v*0.3048,'m'); // feet / foot / ft
    }
  );
}
// U() : à passer sur toute chaîne contenant des unités avant affichage.
function U(s){ return toMetric(s); }

/* Accesseurs bilingues pour les données de jeu */
function wn(w){ return t(w.n, w.ne||w.n); }               // nom de zone
function wd(w){ return t(w.d, w.de||w.d); }               // description de zone
function wboss(w){ return t(w.boss, w.bosse||w.boss); }   // nom du boss
function bn(b){ return t(b.n, b.ne||b.n); }               // nom de badge
function bd(b){ return t(b.d, b.de||b.d); }               // description de badge
// Explication d'une question : française par défaut, anglaise via xe inline ou XEN.
function qx(q){ return S.lang==='en' ? (q.xe||XEN[q.q]||q.x) : q.x; }

// Affichage d'une option de Blitz : anglais mappé, sinon conversion métrique.
function dshow(o){ return S.lang==='en' ? U(DOPT[o]||o) : U(o); }
// Affichage du prompt d'un drill (bilingue).
function dp(d){ return t(d.p, d.pe||d.p); }
/* ---------- les chiffres du Blitz entrent dans le circuit des questions ----------
   Un drill n'a ni énoncé complet ni explication : on en fabrique une question
   à la volée, avec l'identifiant stable « d<index> ». Elle peut alors être
   ratée, classée, marquée et ré-entraînée comme n'importe quelle autre. */
function stripTags(x){ return String(x).replace(/<[^>]+>/g,''); }
function drillId(i){ return 'd'+i; }
function isDrillId(id){ return typeof id==='string' && /^d\d+$/.test(id); }
function drillIndex(id){ return isDrillId(id) ? +id.slice(1) : -1; }
function drillQ(i){
  const d=DRILLS[i]; if(!d) return null;
  const ask=stripTags(t(d.p, d.pe||d.p)).replace(/\s*:\s*$/,'');
  return {
    w:'blitz', drill:i,
    q: ask + (/___/.test(ask) ? '' : ' :'),
    a: [dshow(d.a)].concat(d.o.map(dshow)),
    x: '⚡ ' + t('Chiffre du Blitz. La bonne réponse est ','Blitz number. The correct answer is ')
       + '<b>'+dshow(d.a)+'</b>. '
       + t('Ces valeurs tombent telles quelles à l\'examen : apprends-les par cœur.',
           'These values appear verbatim on the test: learn them by heart.'),
    xe:'⚡ Blitz number. The correct answer is <b>'+dshow(d.a)+'</b>. '
       +'These values appear verbatim on the test: learn them by heart.'
  };
}
/* accès unifié : un identifiant est soit un index de Q, soit « d<n> » */
function qById(id){ return isDrillId(id) ? drillQ(drillIndex(id)) : Q[id]; }

/* ---------- audio (WebAudio, zéro asset) ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,t0,dur,type,vol){
  const c=ac(); if(!c||!S.sound) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.08, c.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.02);
}
const SFX={
  ok(){ tone(660,0,.09); tone(990,.08,.12); },
  combo(){ tone(660,0,.07); tone(880,.06,.07); tone(1320,.12,.14,'square',.09); },

  lvl(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.16,'square',.09)); },
  win(){ [523,659,784,880,1047,1319].forEach((f,i)=>tone(f,i*.09,.14,'square',.09)); },
  hit(){ tone(220,0,.06,'square',.1); tone(90,.04,.14,'sawtooth',.12); },

/* ---------- confettis ---------- */
const FX={cv:null,ctx:null,parts:[],raf:0};
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!FX.cv){ FX.cv=document.getElementById('fx'); FX.ctx=FX.cv.getContext('2d'); }
  const cv=FX.cv; cv.width=innerWidth; cv.height=innerHeight;
  const colors=['#FFC61A','#33B268','#4A8DE8','#F58220','#E5383B','#EFF3F8'];
  for(let i=0;i<(n||120);i++){
    FX.parts.push({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.3,
      vx:(Math.random()-.5)*3, vy:2+Math.random()*4, s:4+Math.random()*6,
      c:colors[i%colors.length], r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3});
  }
  if(!FX.raf) fxLoop();
}
function fxLoop(){
  const {ctx,cv}=FX; if(!ctx){FX.raf=0;return;}
  ctx.clearRect(0,0,FX.cv.width,FX.cv.height);
  FX.parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  FX.parts=FX.parts.filter(p=>p.y<FX.cv.height+30);
  if(FX.parts.length){ FX.raf=requestAnimationFrame(fxLoop); }
  else{ ctx.clearRect(0,0,FX.cv.width,FX.cv.height); FX.raf=0; }
}

/* ---------- besoins du village ----------
   Chaque bonne réponse produit une ressource (blé / bois / fer) au hasard.
   Les besoins montent avec la taille du village : il faut continuer à
   réviser pour nourrir, chauffer et armer les habitants. */
const NEEDS=[
 {k:'food',ic:'🌾',n:'Nourriture',ne:'Food',per:2.2,
  src:'Missions de campagne',srce:'Campaign missions',go:"G.go('worlds')",btn:'Mission',btne:'Mission'},
 {k:'wood',ic:'🪵',n:'Bois',ne:'Wood',per:1.5,

  src:'Boss & Arène',srce:'Bosses & Arena',go:"G.startArena()",btn:'Arène',btne:'Arena'}
];
/* une bonne réponse produit la ressource liée à l'activité en cours */
function gainRes(kind){
  S.res=S.res||{food:0,wood:0,iron:0};
  if(!kind){                     // examens : on remplit ce qui manque le plus
    let worst=NEEDS[0], wp=2;
    NEEDS.forEach(n=>{ const st=needState(n); if(st.pct<wp){ wp=st.pct; worst=n; } });
    kind=worst.k;
  }
  S.res[kind]=(S.res[kind]||0)+1;
}
function popCount(){ return Math.floor(S.village.length/2)+1+hutCount()
  + SHOP.filter(i=>i.cat==='army'&&S.village.includes(i.id)).length*2; }
function needOf(n){ return Math.round(popCount()*n.per); }
function needState(n){
  const have=(S.res&&S.res[n.k])||0, want=needOf(n);
  return {have, want, miss:Math.max(0,want-have), pct:want?Math.min(100,Math.round(have/want*100)):100, ok:have>=want};
}
function villageHappy(){
  const a=NEEDS.map(needState);
  return Math.round(a.reduce((s2,x)=>s2+x.pct,0)/a.length);
}
function allNeedsMet(){ return NEEDS.every(n=>needState(n).ok); }
/* production horaire des bâtiments (chasseurs, fermes, bûcherons) */
function prodPerHour(){
  const out={food:0,wood:0,iron:0};
  SHOP.forEach(it=>{ if(!it.prod) return;
    const n=nOwned(it.id); if(!n) return;
    Object.keys(it.prod).forEach(k=>{ out[k]+=it.prod[k]*n; });
  });
  return out;
}
/* le village mange : consommation horaire proportionnelle à la population */
function upkeepPerHour(){ return Math.max(1,Math.round(popCount()*0.4)); }
function foodBalance(){ return prodPerHour().food-upkeepPerHour(); }
/* applique production et consommation depuis le dernier passage (12 h max) */
function collectProduction(){
  if(!S.village||!S.village.length) return null;
  const now=Date.now();
  if(!S.lastProd){ S.lastProd=now; save(); return null; }
  const hours=Math.min(12,Math.floor((now-S.lastProd)/36e5));
  if(hours<1) return null;
  S.lastProd+=hours*36e5;
  S.res=S.res||{food:0,wood:0,iron:0};
  const p=prodPerHour(), up=upkeepPerHour()*hours;
  const gained={food:p.food*hours, wood:p.wood*hours, iron:p.iron*hours};
  S.res.food=Math.max(0,(S.res.food||0)+gained.food-up);
  S.res.wood=(S.res.wood||0)+gained.wood;
  S.res.iron=(S.res.iron||0)+gained.iron;
  save();
  return {hours, gained, up};
}
/* Village prospère = 1 🪙 par heure, même hors-ligne (12 h de report maximum). */
function collectTribute(){
  if(!S.village||!S.village.length) return 0;
  const now=Date.now();
  if(!S.lastTribute){ S.lastTribute=now; save(); return 0; }
  if(!allNeedsMet()){ S.lastTribute=now; save(); return 0; }
  const hours=Math.floor((now-S.lastTribute)/36e5);
  if(hours<1) return 0;
  const paid=Math.min(hours,12);
  S.lastTribute+=paid*36e5;
  gainCoins(paid); save();
  return paid;
}
function tributeIn(){          // minutes avant la prochaine pièce
  if(!S.lastTribute||!allNeedsMet()) return null;
  const ms=36e5-((Date.now()-S.lastTribute)%36e5);
  return Math.max(0,Math.ceil(ms/6e4));
}

/* ============================================================
   LES DOLÉANCES DU VILLAGE
   ------------------------------------------------------------
   Jusqu'ici le village ne demandait jamais rien : on y venait pour dépenser,
   puis on repartait. Chaque jour, trois habitants formulent maintenant une
   requête concrète — et ces requêtes visent ce que tu révises le moins bien.
   Le village devient la raison de retourner travailler, et le travail vise
   juste. Tout est calculé à partir des compteurs déjà existants : aucune
   boucle, aucun timer, rien qui puisse faire ramer.
   ============================================================ */
const QUEST_SLOTS=3;
/* le domaine où tu es le plus faible, celui qu'on te fera travailler */
function weakestWorld(){
  let worst=null, wm=101;
  WORLDS.forEach(w=>{
    const m=mastery(w.id);
    if(m<wm){ wm=m; worst=w; }
  });
  return worst?{id:worst.id, name:wn(worst), ic:worst.icon, m:wm}:null;
}
/* un bâtiment dont quelqu'un rêve et qui n'existe pas encore */
function dreamedBuilding(){
  const wanted=(S.people||[]).map(r=>dreamOf(r)).filter(d=>d&&d.need&&!nOwned(d.need));
  for(const d of wanted){
    const it=SHOP.find(x=>x.id===d.need);
    if(it&&(!it.req||S.village.includes(it.req))) return it;
  }
  return null;
}
/* fabrique une doléance d'un type donné, ou null si elle n'a pas de sens ici */

    const it=dreamedBuilding(); if(!it) return null;
    return {k:'build', bld:it.id, who, need:1, got:0, ic:it.ic, coins:40, res:'wood', amt:6,
      fr:nm+' rêve de voir « '+t(it.n,it.ne)+' » sortir de terre.',
      en:nm+' dreams of seeing "'+t(it.n,it.ne)+'" built.'};
  }
  return null;
}
const QUEST_KINDS=['domain','fix','tame','combo','blitz','exam','build'];
/* trois doléances par jour : le domaine faible d'abord, puis au hasard */
function rollQuests(){
  // le recensement d'abord : sinon personne n'a de nom à mettre sur la demande
  if((S.village||[]).length&&!(S.people||[]).length) syncPeople();
  const folk=(S.people||[]).filter(x=>!isChild(x));
  const pool=shuffle(QUEST_KINDS.filter(k=>k!=='domain'));
  const kinds=['domain'].concat(pool);
  const out=[], used={};
  for(const k of kinds){
    if(out.length>=QUEST_SLOTS) break;
    if(used[k]) continue;
    const asker=folk.length?folk[Math.floor(Math.random()*folk.length)]:null;
    const q=makeQuest(k, asker);
    if(!q) continue;
    used[k]=1; q.id=k+'-'+Date.now().toString(36)+out.length;
    out.push(q);
  }
  return out;
}
function questsToday(){
  S.quests=S.quests||{day:'', list:[]};
  if(S.quests.day!==todayStr()){
    S.quests={day:todayStr(), list:rollQuests()};
    save();
  }
  return S.quests.list||[];
}
function questDone(q){ return q.got>=q.need; }
function questClaimable(){ return questsToday().filter(q=>questDone(q)&&!q.claimed).length; }
/* un seul point d'entrée : chaque épreuve signale ce qu'elle vient de produire */
function questEvent(kind,val,extra){
  const list=(S.quests&&S.quests.list)||[];
  if(!list.length) return;
  let touched=false;
  list.forEach(q=>{
    if(q.claimed||questDone(q)) return;
    let v=null;
    if(kind==='answer'&&q.k==='domain'&&extra&&extra.w===q.w) v=q.got+1;
    else if(kind==='tamed'&&q.k==='tame') v=q.got+1;
    else if(kind==='fixed'&&q.k==='fix') v=q.got+1;
    else if(kind==='combo'&&q.k==='combo') v=Math.max(q.got,val);
    else if(kind==='blitz'&&q.k==='blitz') v=Math.max(q.got,val);
    else if(kind==='exam'&&q.k==='exam') v=Math.max(q.got,val);
    else if(kind==='build'&&q.k==='build'&&val===q.bld) v=1;
    if(v==null||v===q.got) return;
    q.got=v; touched=true;
    if(questDone(q)){
      SFX.win();
      toast('📜 '+t('Doléance accomplie — le village t\'attend !','Request fulfilled — the village awaits you!'));
    }
  });
  if(touched) save();
}
/* on encaisse : pièces, matériaux, et un habitant plus heureux */
function claimQuest(id){
  const list=(S.quests&&S.quests.list)||[];
  const q=list.find(x=>x.id===id);
  if(!q||!questDone(q)||q.claimed) return;
  q.claimed=true;
  gainCoins(q.coins);
  S.res=S.res||{food:0,wood:0,iron:0};
  S.res[q.res]=(S.res[q.res]||0)+q.amt;
  gainXp(40);
  const asker=(S.people||[]).find(x=>x.id===q.who);
  if(asker){
    nudgeMood(asker,0.3);
    remember(asker,'📜 '+t('Le chef a répondu à sa doléance.','The chief answered their request.'),
                   '📜 The chief answered their request.');
    chron('📜 '+nameOf(asker)+t(' est comblé : sa doléance a été entendue.',' is delighted: their request was heard.'),
          '📜 '+nameOf(asker)+' is delighted: their request was heard.');
  }
  (S.people||[]).forEach(r=>nudgeMood(r,0.05));
  save(); SFX.win(); confetti(70);
  toast('📜 '+t('Doléance récompensée : <b>+'+q.coins+' 🪙</b> et +'+q.amt+' '+RES_IC[q.res],
                'Request rewarded: <b>+'+q.coins+' 🪙</b> and +'+q.amt+' '+RES_IC[q.res]));
  render();
}

function award(id){

function checkBadges(){

  if(S.bestCombo>=5) award('combo5');
  if(S.bestCombo>=10) award('combo10');

  const bw=Object.keys(S.bossWins).length;
  if(bw>=1) award('boss1');
  if(bw>=WORLDS.length) award('bossall');
  if(S.blitzBest>=15) award('blitz15');
  if(S.blitzBest>=25) award('blitz25');
  const tot=S.totalOk+S.totalKo;
  if(tot>=100) award('q100');
  if(tot>=250) award('q250');
  if(S.fixedErrors>=10) award('errors');
  if(S.examPassed) award('exam');

  if(S.dayStreak>=3) award('daily3');
  if(S.examPassed && WORLDS.every(w=>mastery(w.id)>=80)) award('bayonne');
  if(S.village.length>=1) award('shop1');
  if(S.village.length>=8) award('village8');
  if(S.village.length>=SHOP.length) award('village16');
  if(S.arenaWins>=1) award('arena1');
  if(S.arenaWins>=3) award('arena3');
  if(S.examHardBest>=24) award('hardpass');
  if(S.coinsTotal>=1000) award('rich');
  const tamed=Object.keys(S.qstat).filter(k=>{ const s=S.qstat[k]; return s&&s.ko>0&&s.box>=3; }).length;
  if(tamed>=10) award('nem10');
  if(tamed>=30) award('nem30');
  if(tot>=500) award('menhir100');
  if(tot>=1000) award('q1000');
  if(tot>=100&&S.totalOk/tot>=0.9) award('sanglier');
  if(S.bestCombo>=15) award('potion');
  if(armyPct()>=100) award('romains');

  if(tot>0&&hr>=22) award('nuit');
  if(tot>0&&hr<7) award('aube');
  if(S.vpos&&Object.keys(S.vpos).length) award('archi');
  if(S.examHardBest>=28) award('hard45');
}

/* ---------- SRS / sélection de questions ---------- */
function qstat(i){ return S.qstat[i]||(S.qstat[i]={box:0,ok:0,ko:0}); }
function mastery(wid){
  const idx=Q.map((q,i)=>({q,i})).filter(o=>o.q.w===wid);
  if(!idx.length) return 0;
  const got=idx.filter(o=>{ const s=S.qstat[o.i]; return s&&s.box>=2; }).length;
  return Math.round(got/idx.length*100);
}
function pickQuestions(wid,n){
  const pool=Q.map((q,i)=>({q,i})).filter(o=>!wid||o.q.w===wid);
  const weighted=pool.map(o=>{
    const s=S.qstat[o.i];
    let w;
    if(!s||s.box===0) w=80;               // jamais vue
    else if(s.box===1) w=100+s.ko*10;     // ratée → priorité max
    else if(s.box===2) w=40;
    else w=10;
    return {o, w:w+Math.random()*30};
  });
  weighted.sort((a,b)=>b.w-a.w);
  return shuffle(weighted.slice(0,n).map(x=>x.o));
}
function errorPool(){
  return allTrackable().filter(o=>{ const s=S.qstat[o.i]; return s&&s.box===1&&s.ko>0; });
}
/* toutes les questions pistables : la banque principale + les chiffres du Blitz */
function allTrackable(){
  const out=Q.map((q,i)=>({q,i}));
  DRILLS.forEach((d,i)=>{ const id=drillId(i);
    if(S.qstat[id]||isFlagged(id)) out.push({q:drillQ(i), i:id}); });
  return out;
}

function flushSave(){ save(); }
addEventListener('pagehide',flushSave);
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });
function recordAnswer(qi,good){
  const s=qstat(qi);
  const wasError=s.box===1&&s.ko>0, wasTamed=s.box>=3;
  if(good){ s.ok++; s.box=Math.min(3,(s.box||0)===0?2:s.box+1); if(wasError) S.fixedErrors++;
    gainCoins(CUR.screen==='blitz' ? (allNeedsMet()?1:0) : 2+(allNeedsMet()?1:0));
    gainRes(CUR.screen==='run'?'food':CUR.screen==='boss'?'iron':CUR.screen==='blitz'?'wood':null); }
  else{ s.ko++; s.box=1; }
  if(good){
    S.totalOk++; touchDaily(); S.daily.ok++;
    if(S.daily.ok>=DAILY_GOAL&&!S.daily.rewarded){
      S.daily.rewarded=true;
      const y=new Date(Date.now()-864e5), ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      S.dayStreak=(S.lastGoalDate===ys)?S.dayStreak+1:1;
      S.lastGoalDate=todayStr();
      gainXp(50); toast(t('🎯 Objectif du jour atteint ! <b>+50 XP</b> · Série : '+S.dayStreak+' j','🎯 Daily goal reached! <b>+50 XP</b> · Streak: '+S.dayStreak+' d'));
    }
  } else S.totalKo++;
  // les doléances se nourrissent des mêmes compteurs, sans boucle supplémentaire
  if(good){
    const w=isDrillId(qi)?'blitz':((Q[qi]&&Q[qi].w)||null);
    if(w) questEvent('answer',1,{w});
    if(wasError) questEvent('fixed',1);
    if(!wasTamed&&s.box>=3) questEvent('tamed',1);
  }
  save();
}

/* ---------- HUD ---------- */
function daysToExam(){
  if(!S.examDate) return null;
  const [y,m,d]=S.examDate.split('-').map(Number);
  const ex=new Date(y,m-1,d), now=new Date();
  now.setHours(0,0,0,0);
  return Math.round((ex-now)/864e5);
}
/* instant exact de l'attaque romaine (date + heure de l'examen) */
function examMoment(){
  if(!S.examDate) return null;
  const [y,m,d]=S.examDate.split('-').map(Number);
  const [hh,mm]=(S.examTime||'14:00').split(':').map(Number);
  return new Date(y,m-1,d,hh||0,mm||0,0,0);
}
function countdown(){
  const ex=examMoment(); if(!ex) return null;
  let ms=ex-new Date();
  const past=ms<0; if(past) ms=-ms;
  return {past, d:Math.floor(ms/864e5), h:Math.floor(ms/36e5)%24,
          m:Math.floor(ms/6e4)%60, s:Math.floor(ms/1e3)%60};
}

function signFor(q){
  if(q.s) return q.s;
  const txt=((q.q||'')+' '+(q.a&&q.a[0]||'')).toLowerCase();
  const vehicle=/school bus|ice cream truck|emergency vehicle|tow truck/.test(txt);
  for(let i=0;i<SIGN_RULES.length;i++){
    const k=SIGN_RULES[i][0];
    if(vehicle&&(k==='sigred'||k==='sigyel'||k==='arrow'||k==='yellowarrow')) continue;
    if(SIGN_RULES[i][1].test(txt)) return k;
  }
  return '';
}

function optOrder(q){
  const idx=shuffle([0,1,2,3].slice(0,q.a.length));

/* ---------- le combo est global ----------
   Il se poursuit d'une série à l'autre — campagne, boss, arène, blitz, examen
   blanc, boîte à erreurs — et ne retombe à zéro que sur une mauvaise réponse.
   Chaque épreuve garde son propre compteur (c.combo) pour l'affichage, mais
   les deux avancent ensemble. */
function bumpCombo(good){
  S.combo=good?((S.combo||0)+1):0;
  if(S.combo>S.bestCombo) S.bestCombo=S.combo;
  if(good) questEvent('combo',S.combo);
  return S.combo;
}
function startCombo(){ return S.combo||0; }
function comboMult(c){ return c>=10?3 : c>=5?2 : c>=3?1.5 : 1; }
function scrRun(){
  const c=CUR, q=c.qs[c.i].q;
  if(!c.order) c.order=optOrder(q);
  const w=WORLDS.find(x=>x.id===q.w);
  const wic=w?w.icon:(q.drill!=null?'⚡':'🎯');
  let html='<div class="qmeta"><div class="qprog">'+wic+' '+(c.i+1)+'/'+c.qs.length+'</div>'
   +(c.combo>=3?'<div class="combo"><span class="f">🔥</span>COMBO ×'+comboMult(c.combo)+'</div>':'')
   +'</div>'
   +'<div class="qbar"><i style="width:'+(c.i/c.qs.length*100)+'%"></i></div>'
   +'<div class="qcard" id="qcard">'
   +(q.s?'<div class="qsign">'+signSvg(q.s)+'</div>':'')
   +'<div class="qtext">'+esc(U(q.q))+'</div><div class="opts">';
  c.order.forEach((optIdx,pos)=>{
    let cls='opt', dis=c.answered?' disabled':'';
    if(c.answered){
      if(optIdx===0&&pos===c.picked) cls+=' sel-ok';
      else if(optIdx===0) cls+=' reveal';
      else if(pos===c.picked) cls+=' sel-ko';
      else cls+=' fade';
    }
    html+='<button class="'+cls+'"'+dis+' onclick="G.answer('+pos+',event)"><span class="key">'+String.fromCharCode(65+pos)+'</span><span>'+esc(U(q.a[optIdx]))+'</span></button>';
  });
  html+='</div>';
  if(c.answered){
    const good=c.order[c.picked]===0;
    html+='<div class="verdict '+(good?'ok':'ko')+'">'+(good?t(['✅ EXACT !','✅ NICKEL !','✅ PROPRE !','✅ BOOM !'][c.i%4],['✅ EXACT!','✅ NAILED IT!','✅ CLEAN!','✅ BOOM!'][c.i%4]):t('❌ RATÉ !','❌ MISSED!'))+'</div>'
     +'<div class="exp"><span class="tag">'+t('📌 LA RÈGLE','📌 THE RULE')+'</span>'+U(qx(q))+'</div>'
     +signReveal(q)
     +'<div class="flagrow">'+flagBtn(c.qs[c.i].i)+'</div>'
     +'<div class="nextbar"><button class="btn btn-bus" style="justify-content:center" onclick="G.next()" id="nextbtn">'+(c.i+1<c.qs.length?t('SUIVANT →','NEXT →'):t('RÉSULTAT 🏁','RESULT 🏁'))+'</button></div>';
  }
  return html+'</div>';
}
function answer(pos,ev){
  const c=CUR; if(c.answered) return;
  c.answered=true; c.picked=pos;
  const qi=c.qs[c.i].i;
  const good=c.order[pos]===0;
  recordAnswer(qi,good);
  if(good){
    c.ok++; c.combo=bumpCombo(true); save();
    const xp=Math.round(10*comboMult(c.combo));
    (c.combo>=3?SFX.combo:SFX.ok)();
    gainXp(xp,ev);
  }else{
    c.combo=bumpCombo(false); save(); SFX.ko();
    const shk=$('#app'); shk.classList.add('shake');
    setTimeout(()=>shk.classList.remove('shake'),380);
  }
  checkBadges();
  render();
  const nb=$('#nextbtn'); if(nb) nb.focus();
}
function next(){
  const c=CUR;
  if(c.i+1<c.qs.length){ c.i++; c.answered=false; c.picked=-1; c.order=null; render(); }
  else endRun();
}
/* Multiplicateur de butin : il ne compte QUE si le combo tient encore à la
   fin de la série. Une faute en dernière question et tout retombe à ×1. */
function lootMult(combo){
  if(combo>=10) return 4;
  if(combo>=9)  return 3;
  if(combo>=7)  return 2.5;
  if(combo>=5)  return 2;
  if(combo>=3)  return 1.5;
  return 1;
}
const LOOT_STEPS=[[3,1.5],[5,2],[7,2.5],[9,3],[10,4]];
/* ce que la session a rapporté, bonus de combo compris */
function sessionLoot(c,combo){
  const base={}, bonus={};
  const r0=c.res0||{food:0,wood:0,iron:0};
  let anyBase=0;
  ['food','wood','iron'].forEach(k=>{
    const g=Math.max(0,((S.res&&S.res[k])||0)-(r0[k]||0));
    base[k]=g; anyBase+=g;
  });
  const mult=combo===null?1:lootMult(combo||0);
  ['food','wood','iron'].forEach(k=>{ bonus[k]=Math.round(base[k]*(mult-1)); });
  const coins=Math.max(0,S.coins-(c.coins0||0));
  return {base, bonus, mult, coins, any:anyBase>0||coins>0};
}
/* on verse le bonus et on rend le récapitulatif */
function lootHtml(c,combo){
  if(c._loot!==undefined) return c._loot;      // le bilan peut être re-rendu : on ne verse qu'une fois
  const L=sessionLoot(c,combo);
  ['food','wood','iron'].forEach(k=>{ if(L.bonus[k]) S.res[k]=(S.res[k]||0)+L.bonus[k]; });
  save();
  const IC={food:'🌾',wood:'🪵',iron:'⚙️'}, NM={food:t('Nourriture','Food'),wood:t('Bois','Wood'),iron:t('Fer','Iron')};
  let rows='';
  ['food','wood','iron'].forEach(k=>{
    if(!L.base[k]&&!L.bonus[k]) return;
    rows+='<div class="lootrow"><span class="lic">'+IC[k]+'</span><span class="lnm">'+NM[k]+'</span>'
      +'<span class="lval">+'+(L.base[k]+L.bonus[k])+'</span>'
      +(L.bonus[k]?'<span class="lbon">'+t('dont +','incl. +')+L.bonus[k]+'</span>':'<span class="lbon"></span>')
      +'</div>';
  });
  if(L.coins) rows+='<div class="lootrow"><span class="lic">🪙</span><span class="lnm">'+t('Sesterces','Sesterces')
      +'</span><span class="lval">+'+L.coins+'</span><span class="lbon"></span></div>';
  // session blanche : on le dit au lieu de masquer le panneau
  if(!rows) rows='<div class="lootrow"><span class="lic">🕳️</span><span class="lnm">'
      +t('Aucune ressource — il faut des bonnes réponses.','No resources — you need correct answers.')
      +'</span><span class="lval">+0</span><span class="lbon"></span></div>';
  const nxt=combo===null?null:LOOT_STEPS.find(x=>x[0]>(combo||0));
  const html='<div class="panel loot"><div class="eyebrow">'+t('BUTIN DE LA SESSION','SESSION LOOT')+'</div>'
   +'<div class="lootmult'+(L.mult>1?' on':'')+'">'
     +(combo===null ? t('Butin de l\'épreuve','Loot from this test')
       : L.mult>1
       ? '🔥 '+t('COMBO ×'+combo+' TENU → BUTIN ×'+L.mult,'COMBO ×'+combo+' HELD → LOOT ×'+L.mult)
       : c.deck ? t('Aucune série en cours au coup de sifflet → butin ×1','No streak running at the buzzer → loot ×1')
       : t('Combo perdu en route → butin ×1','Combo broken along the way → loot ×1'))
   +'</div>'
   +rows
   +'<p class="small" style="margin-top:10px">'
   +(combo===null
      ? t('Les examens blancs ne comptent pas de combo — le butin y est toujours ×1.',
          'Mock exams have no streak — loot is always ×1 there.')
      : nxt?t('Termine la prochaine série avec '+nxt[0]+' bonnes réponses d\'affilée pour un butin ×'+nxt[1]+'.',
             'Finish the next run on a '+nxt[0]+'-answer streak for ×'+nxt[1]+' loot.')
        :t('Multiplicateur maximum atteint. Impeccable.','Maximum multiplier reached. Flawless.'))
   +'</p></div>';
  c._loot=html; return html;
}

   +'<button class="btn btn-ghost" onclick="G.go(\'worlds\')"><span class="ic">🗺️</span>'+t('Carte','Map')+'</button>'
   +'</div></div></div>';

  pop.className='dmgpop'+(win?'':' bad');

/* bulle de dialogue : un villageois « parle » au-dessus de la scène */
/* ce qu'un habitant a envie de dire MAINTENANT : son rêve, son amour, son
   mentor, la faim du village, César qui approche… le métier n'arrive qu'après. */
/* ---------- répliques ----------
   Chaque réplique porte un identifiant. Un habitant ne redit pas ce qu'il a
   déjà dit tant qu'il lui reste autre chose à raconter ; quand il a tout dit,
   son carnet se vide et il peut recommencer. Le carnet est sauvegardé, donc
   revenir au village ne le remet pas à zéro. */
const SAID_MAX=40;
function lineDeck(rec,job){
  const L=[];                                   // {id, w, fr, en}
  const push=(id,w,fr,en)=>L.push({id,w,fr,en});
  if(rec&&isChild(rec)){
    const par=parentsOf(rec);
    if(par.length){
      push('kid.parent',6,'Quand je serai grand, je ferai comme '+nameOf(par[0])+' !',
                          'When I grow up, I want to be like '+nameOf(par[0])+'!');
      push('kid.hide',4,'On a le droit de se cacher dans la grange, dis ?','Are we allowed to hide in the barn?');
    }
    const sib=childrenOf(par[0]||{}).filter(k=>k!==rec);
    if(sib.length) push('kid.sib',4,'Attends-moi, '+nameOf(sib[0])+' !','Wait for me, '+nameOf(sib[0])+'!');
    push('kid.grow',5,'Je grandis vite, tu as vu ?','I am growing fast, have you seen?');
    push('kid.frog',4,'J\'ai trouvé une grenouille. Je l\'appelle Bulle.','I found a frog. I call her Bubble.');
    push('kid.why',4,'Pourquoi les menhirs sont lourds ?','Why are menhirs so heavy?');
    push('kid.roman',4,'C\'est vrai que les Romains ont des jupes ?','Is it true the Romans wear skirts?');
    push('kid.race',3,'Je cours plus vite que toi. Presque.','I run faster than you. Almost.');
  }else if(rec){
    const d=dreamOf(rec), lv=loveOf(rec), mt=mentorOf(rec), st=studentsOf(rec), bf=bestFriend(rec);
    const m=moodOf(rec), tr=rec.tr;
    if(d&&rec.dreamAt&&Date.now()-rec.dreamAt<6*36e5)
      push('dream.done',9,'Je n\'y croyais plus : '+d.fr+'… merci, chef.','I had given up hope: '+d.en+'… thank you, chief.');
    else if(d&&!rec.dreamAt){
      push('dream.wish',4,'Un jour, '+d.fr+'. Un jour.','One day, '+d.en+'. One day.');
      push('dream.ask',3,'Tu crois qu\'on verra ça de notre vivant ? '+d.fr+'…','Do you think we will live to see it? '+d.en+'…');
    }
    if(lv){
      push('love.1',5,'Tu as vu '+nameOf(lv)+' ce matin ? Moi oui.','Have you seen '+nameOf(lv)+' this morning? I have.');
      push('love.2',4,'Je garde toujours la meilleure part pour '+nameOf(lv)+'.','I always keep the best portion for '+nameOf(lv)+'.');
      push('love.3',3,'On s\'est rencontrés près du feu. Je m\'en souviens comme d\'hier.',
                     'We met by the fire. I remember it like yesterday.');
    }
    if(mt){
      push('mentor.1',3,nameOf(mt)+' m\'a tout appris. Je lui dois bien ça.',nameOf(mt)+' taught me everything. I owe them that much.');
      push('mentor.2',3,'La première fois, '+nameOf(mt)+' a bien ri de moi.','The first time, '+nameOf(mt)+' laughed at me plenty.');
    }
    if(st.length){
      push('stu.1',3,'Je forme '+nameOf(st[0])+'. Ça rentre, doucement.','I\'m training '+nameOf(st[0])+'. It\'s sinking in, slowly.');
      push('stu.2',3,nameOf(st[0])+' a failli y laisser un doigt. Il apprend.',nameOf(st[0])+' nearly lost a finger. They are learning.');
    }
    if(bf&&bf.n>=10){
      push('bf.1',3,'Avec '+nameOf(bf.p)+', on se comprend sans parler.','With '+nameOf(bf.p)+', we understand each other without a word.');
      push('bf.2',3,nameOf(bf.p)+' me doit trois tournées. Je compte.',nameOf(bf.p)+' owes me three rounds. I am counting.');
    }
    if(rec.rival){
      const rv=(S.people||[]).find(x=>x.id===rec.rival);
      if(rv){ push('rival.1',4,'Ne me parle pas de '+nameOf(rv)+'.','Do not mention '+nameOf(rv)+' to me.');
              push('rival.2',3,'Un jour '+nameOf(rv)+' comprendra. Pas aujourd\'hui.','One day '+nameOf(rv)+' will understand. Not today.'); }
    }
    const kids=childrenOf(rec);
    if(kids.length){
      push('kids.1',4,nameOf(kids[0])+' a encore désobéi. Comme moi à son âge.',nameOf(kids[0])+' misbehaved again. Just like me at that age.');
      push('kids.2',3,'Je bâtis tout ça pour eux, au fond.','I am building all this for them, really.');
    }
    if(m<0.3){
      push('mood.low1',6,'Rien ne va aujourd\'hui. Rien.','Nothing is right today. Nothing.');
      push('mood.low2',4,'J\'ai mal dormi. Et ça se voit, je sais.','I slept badly. And it shows, I know.');
    }else if(m>0.85){
      push('mood.hi1',4,'Quelle journée ! Tout me réussit.','What a day! Everything is going my way.');
      push('mood.hi2',3,'Si tous les jours pouvaient ressembler à celui-là…','If only every day were like this one…');
    }
    if(S.res&&S.res.food===0){
      push('hungry.1',8,'Il n\'y a plus rien à manger, chef…','There is nothing left to eat, chief…');
      push('hungry.2',6,'On a fini les réserves hier soir. Hier SOIR.','We finished the stores last night. Last NIGHT.');
    }
    const dj=daysToExam();
    if(dj!==null&&dj>=0&&dj<=3){
      push('exam.1',7,'Plus que '+dj+' jour'+(dj>1?'s':'')+' avant César. Tu es prêt ?','Only '+dj+' day'+(dj>1?'s':'')+' until Caesar. Are you ready?');
      push('exam.2',5,'J\'ai aiguisé ma faux. On ne sait jamais.','I sharpened my scythe. One never knows.');
    }
    const dd=daysIn(rec);
    if(dd>=7) push('here.'+Math.floor(dd/7),3,'Déjà '+dd+' jours que je suis ici. Le temps file.','Already '+dd+' days here. Time flies.');
    // couleur de caractère : chacun a ses marottes
    const TRLINE={
      bavard:[['tr.bav1','Je te raconte ? Bon, je te raconte.','Shall I tell you? Right, I shall.'],
              ['tr.bav2','On m\'a dit que… non, je ne devrais pas.','I heard that… no, I should not.']],
      travailleur:[['tr.trav1','Il reste de la lumière, il reste du travail.','Daylight left means work left.'],
                   ['tr.trav2','Le repos, c\'est pour l\'hiver.','Rest is for the winter.']],
      gourmand:[['tr.gou1','On mange à quelle heure, au juste ?','So what time do we eat, exactly?'],
                ['tr.gou2','J\'ai senti du sanglier. Je ne me trompe jamais.','I smelled boar. I am never wrong.']],
      reveur:[['tr.rev1','Ce nuage a la forme d\'un casque romain.','That cloud looks like a Roman helmet.'],
              ['tr.rev2','Tu crois qu\'il y a un village de l\'autre côté de la mer ?','Do you think there is a village across the sea?']],
      grognon:[['tr.gro1','C\'était mieux avant. Bien mieux.','Things were better before. Much better.'],
               ['tr.gro2','Ne me demande pas mon avis, tu ne l\'aimerais pas.','Do not ask my opinion, you would not like it.']],
      courageux:[['tr.cou1','Qu\'ils viennent. Je serai devant.','Let them come. I will be at the front.'],
                 ['tr.cou2','J\'ai déjà vu pire qu\'une légion.','I have seen worse than a legion.']],
      curieux:[['tr.cur1','Pourquoi le ciel change de couleur, à ton avis ?','Why does the sky change colour, do you think?'],
               ['tr.cur2','Et si on essayait autrement, pour voir ?','What if we tried it another way, just to see?']]
    };
    (TRLINE[tr]||[]).forEach(x=>push(x[0],4,x[1],x[2]));
  }
  // les répliques de métier, chacune avec son identifiant
  const jl=t(job.say,job.saye), jk=job.k;
  jl.forEach((txt,i)=>push('job.'+jk+'.'+i, 6, txt, txt));
  return L;
}
/* tire une réplique jamais dite récemment */
function lineFor(rec,job){
  const L=lineDeck(rec,job);
  if(!L.length) return '';
  const said=(rec&&rec.said)||[];
  let pool=L.filter(x=>said.indexOf(x.id)<0);
  if(!pool.length){                       // tout a été dit : on repart d'une page blanche
    if(rec) rec.said=[];
    pool=L;
  }
  const tot=pool.reduce((a,x)=>a+x.w,0);
  let r=Math.random()*tot, pick=pool[pool.length-1];
  for(const x of pool){ r-=x.w; if(r<=0){ pick=x; break; } }
  if(rec){
    rec.said=(rec.said||[]).concat(pick.id);
    if(rec.said.length>SAID_MAX) rec.said=rec.said.slice(-SAID_MAX);
    V3.saveSoon=1;
  }
  return t(pick.fr,pick.en);
}
function villagerSay(p){
  const el=$('#v3dsay'); if(!el) return;
  const j=p.userData.job;
  const txt=lineFor(p.userData.rec,j);
  const nm=p.userData.rec?nameOf(p.userData.rec):t(j.n,j.ne);
  el.innerHTML='<b>'+j.ic+' '+esc(nm)+'</b> <i style="color:var(--dim);font-style:normal">('+esc(t(j.n,j.ne))+')</i> — '+esc(txt);
  el.classList.add('show');
  clearTimeout(V3.sayT); V3.sayT=setTimeout(()=>el.classList.remove('show'),3200);
}

  grass:0x63a02a, grassDark:0x4a7a20, dirt:0xc9a468, dirtDark:0xac8449,
  wall:0xe6d3ab, wallDark:0xcdb488, beam:0x6b4a28, wood:0x8a6236, woodDark:0x6b4a28,
  thatch:0xbe8c3e, thatchDark:0x8f6526, stone:0x9aa3a8, stoneDark:0x7d858a,
  leaf:0x4f9128, leaf2:0x66ab34, leaf3:0x3c7a20, water:0x3f7fa8, fire:0xff8c1a,
  skin:0xf0c9a0, cloth:[0xc0463c,0x3f6fb0,0x8a5aa8,0xd08a2a,0x4a9a6a,0xb0503a,0x5a6ab0,0xc07a3a]
};
function mat(c){ return new THREE.MeshPhongMaterial({color:c,shininess:4,specular:0x0d0d0d,flatShading:false}); }

/* ---------- textures procédurales (canvas, zéro fichier externe) ---------- */
let TX=null;
function mkTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx||1,ry||rx||1);
  t.anisotropy=4;
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function buildTextures(){
  if(TX) return TX;
  TX={};
  // herbe : fond bruité + brins
  TX.grass=mkTex(128,128,(x,w,h)=>{
    x.fillStyle='#5f9a2a'; x.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){ x.fillStyle='rgba('+(60+rnd(0,70)|0)+','+(130+rnd(0,70)|0)+','+(30+rnd(0,40)|0)+','+rnd(.15,.55)+')';
      x.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3)); }
    for(let i=0;i<600;i++){ x.strokeStyle='rgba('+(90+rnd(0,80)|0)+','+(170+rnd(0,60)|0)+',60,'+rnd(.12,.4)+')';
      x.lineWidth=rnd(.6,1.4); const px=rnd(0,w),py=rnd(0,h);
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+rnd(-2,2),py-rnd(3,7)); x.stroke(); }
  },26);
  // terre battue
  TX.dirt=mkTex(128,128,(x,w,h)=>{
    x.fillStyle='#bc9a63'; x.fillRect(0,0,w,h);
    for(let i=0;i<2200;i++){ const g=rnd(-30,26)|0;
      x.fillStyle='rgba('+(188+g)+','+(154+g)+','+(99+g)+','+rnd(.2,.7)+')';
      x.fillRect(rnd(0,w),rnd(0,h),rnd(1,4),rnd(1,3)); }
    for(let i=0;i<70;i++){ x.fillStyle='rgba(120,98,62,'+rnd(.15,.4)+')';
      x.beginPath(); x.ellipse(rnd(0,w),rnd(0,h),rnd(2,7),rnd(1,4),rnd(0,3),0,7); x.fill(); }
  },14);
  // chaume : mèches horizontales
  TX.thatch=mkTex(128,128,(x,w,h)=>{
    x.fillStyle='#b9873c'; x.fillRect(0,0,w,h);
    for(let r=0;r<22;r++){ const y=r*(h/22);
      x.fillStyle='rgba(0,0,0,'+rnd(.07,.16)+')'; x.fillRect(0,y,w,rnd(1.5,3));
      for(let i=0;i<90;i++){ x.strokeStyle='rgba('+(200+rnd(-45,40)|0)+','+(155+rnd(-40,35)|0)+','+(80+rnd(-30,30)|0)+','+rnd(.25,.7)+')';
        x.lineWidth=rnd(.5,1.3); const px=rnd(0,w);
        x.beginPath(); x.moveTo(px,y); x.lineTo(px+rnd(-3,3),y+rnd(3,7)); x.stroke(); } }
  },3,2);
  // bois : veines verticales
  TX.wood=mkTex(64,128,(x,w,h)=>{
    x.fillStyle='#8a6236'; x.fillRect(0,0,w,h);
    for(let i=0;i<80;i++){ x.strokeStyle='rgba('+(120+rnd(-45,50)|0)+','+(85+rnd(-35,40)|0)+','+(48+rnd(-25,30)|0)+','+rnd(.2,.6)+')';
      x.lineWidth=rnd(.6,2.4); const px=rnd(0,w);
      x.beginPath(); x.moveTo(px,0); x.bezierCurveTo(px+rnd(-4,4),h/3,px+rnd(-4,4),2*h/3,px+rnd(-3,3),h); x.stroke(); }
  },1,2);
  // torchis clair (murs)
  TX.plaster=mkTex(128,128,(x,w,h)=>{
    x.fillStyle='#e3cfa4'; x.fillRect(0,0,w,h);
    for(let i=0;i<2400;i++){ const g=rnd(-22,16)|0;
      x.fillStyle='rgba('+(227+g)+','+(207+g)+','+(164+g)+','+rnd(.2,.6)+')';
      x.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3)); }
    for(let i=0;i<26;i++){ x.strokeStyle='rgba(150,128,92,'+rnd(.1,.28)+')'; x.lineWidth=rnd(.5,1.2);
      x.beginPath(); x.moveTo(rnd(0,w),rnd(0,h)); x.lineTo(rnd(0,w),rnd(0,h)); x.stroke(); }
  },2);
  // rondins verticaux (palissade / muraille)
  TX.logs=mkTex(160,128,(x,w,h)=>{
    x.fillStyle='#4a3520'; x.fillRect(0,0,w,h);
    const n=8, lw=w/n;
    for(let i=0;i<n;i++){
      const gd=x.createLinearGradient(i*lw,0,(i+1)*lw,0);
      gd.addColorStop(0,'#5b3f22'); gd.addColorStop(.28,'#a1743f');
      gd.addColorStop(.55,'#8c6335'); gd.addColorStop(1,'#4f381f');
      x.fillStyle=gd; x.fillRect(i*lw+1,0,lw-2,h);
      for(let k=0;k<9;k++){ x.strokeStyle='rgba(74,52,28,'+rnd(.16,.44)+')'; x.lineWidth=rnd(.5,1.5);
        const px=i*lw+rnd(2.5,lw-2.5);
        x.beginPath(); x.moveTo(px,0); x.bezierCurveTo(px+rnd(-2,2),h/3,px+rnd(-2,2),2*h/3,px+rnd(-2,2),h); x.stroke(); }
      x.strokeStyle='rgba(255,226,170,.16)'; x.lineWidth=1.4;
      x.beginPath(); x.moveTo(i*lw+lw*0.3,0); x.lineTo(i*lw+lw*0.3,h); x.stroke();
    }
    for(let k=0;k<3;k++){ const y=rnd(0,h);      // ligatures horizontales
      x.fillStyle='rgba(58,40,22,.5)'; x.fillRect(0,y,w,rnd(2,4)); }
  },1,1);
  // pierre : moellons
  TX.stone=mkTex(128,128,(x,w,h)=>{
    x.fillStyle='#8f979c'; x.fillRect(0,0,w,h);
    const rows=6;
    for(let r=0;r<rows;r++){ const y=r*(h/rows), off=(r%2)*18;
      for(let c=0;c<5;c++){ const bx=off+c*(w/5)+rnd(-2,2), bw=w/5-rnd(3,6), bh=h/rows-rnd(3,5), g=rnd(-24,22)|0;
        x.fillStyle='rgb('+(150+g)+','+(158+g)+','+(163+g)+')';
        x.beginPath(); x.roundRect?x.roundRect(bx,y+2,bw,bh,3):x.rect(bx,y+2,bw,bh); x.fill();
        x.strokeStyle='rgba(60,66,70,.45)'; x.lineWidth=1.2; x.stroke(); } }
  },4,3);
  return TX;
}
/* matériau texturé */
function matT(c,map,rx,ry){
  const m=new THREE.MeshPhongMaterial({color:c,shininess:3,specular:0x0a0a0a});
  if(map){ const t=map.clone(); t.needsUpdate=true;
    if(rx){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry||rx); }
    m.map=t; }
  return m;
}
/* ---------- cycle jour / nuit calé sur l'heure réelle du joueur ---------- */
function dayPhase(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  // lever 6 h, coucher 20 h
  const t=(h-6)/14;                       // 0 → 1 sur la journée
  const el=Math.sin(Math.max(0,Math.min(1,t))*Math.PI);   // hauteur du soleil
  const night=(h<5.2||h>20.8);
  const dusk=(!night&&(h<7.5||h>18.5));
  return {h, el, night, dusk, t};
}
function applyTimeOfDay(scene,sun,hemi,fill,stars){
  const p=dayPhase();
  const lerp=(a,b,k)=>a+(b-a)*k;
  const azim=Math.PI*(0.15+p.t*1.2);
  if(p.night){
    sun.position.set(Math.cos(azim)*90,42,Math.sin(azim)*90);
    sun.color.setHex(0xaec4ee); sun.intensity=0.34;
    hemi.color.setHex(0x2a3a6a); hemi.groundColor.setHex(0x101c14); hemi.intensity=0.34;
    fill.intensity=0.05;
    scene.background.setHex(0x0d1730); if(scene.fog) scene.fog.color.setHex(0x16233c);
    if(stars) stars.visible=true;
  }else{
    sun.position.set(Math.cos(azim)*-110, 30+el(p)*110, Math.sin(azim)*90);
    const warm=p.dusk?1:Math.max(0,1-p.el);
    sun.color.setRGB(1, lerp(1,0.78,warm*0.85), lerp(1,0.52,warm));
    sun.intensity=lerp(0.55,1.35,p.el);
    hemi.color.setHex(p.dusk?0xd8b48c:0x9fc8ee); hemi.groundColor.setHex(0x35601a);
    hemi.intensity=lerp(0.34,0.52,p.el);
    fill.intensity=0.14;
    const sky=p.dusk? new THREE.Color(0xe8a86a) : new THREE.Color(0x8fc9e6);
    const day=new THREE.Color(0x8fc9e6);
    scene.background.copy(day).lerp(sky,p.dusk?0.8:0);
    if(scene.fog) scene.fog.color.copy(new THREE.Color(0xc4dfd0)).lerp(new THREE.Color(0xe0b58c),p.dusk?0.7:0);
    if(stars) stars.visible=false;
  }
  return p;
}
function el(p){ return p.el; }
function makeStars(){
  const g=new THREE.BufferGeometry(), n=260, a=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const th=Math.random()*Math.PI*2, ph=Math.random()*0.5+0.05, r=380;
    a[i*3]=Math.cos(th)*Math.cos(ph)*r; a[i*3+1]=Math.sin(ph)*r+60; a[i*3+2]=Math.sin(th)*Math.cos(ph)*r; }
  g.setAttribute('position',new THREE.BufferAttribute(a,3));
  const m=new THREE.PointsMaterial({color:0xffffff,size:2.6,sizeAttenuation:false,transparent:true,opacity:.9});
  const pts=new THREE.Points(g,m); pts.visible=false; return pts;
}

/* ---------- briques de construction ---------- */
function box(w,h,d,c){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)); m.castShadow=m.receiveShadow=true; return m; }
function cyl(rt,rb,h,c,seg){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||8),mat(c)); m.castShadow=m.receiveShadow=true; return m; }
function cone(r,h,c,seg){ const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||4),mat(c)); m.castShadow=m.receiveShadow=true; return m; }
function sph(r,c,d){ const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,d==null?0:d),mat(c)); m.castShadow=m.receiveShadow=true; return m; }
function at(o,x,y,z){ o.position.set(x,y,z); return o; }

/* toit à DEUX PENTES : prisme triangulaire extrudé + bandeau de chaume + faîtage */
function gable(w,len,h,c,cDark){
  const g=new THREE.Group();
  const prism=(ww,ll,hh,col)=>{
    const sh=new THREE.Shape();
    sh.moveTo(-ww/2,0); sh.lineTo(ww/2,0); sh.lineTo(0,hh); sh.closePath();
    const geo=new THREE.ExtrudeGeometry(sh,{depth:ll,bevelEnabled:false});
    geo.translate(0,0,-ll/2);
    const m=new THREE.Mesh(geo,matT(0xffffff,TX.thatch,1.6,1)); m.castShadow=m.receiveShadow=true; return m;
  };
  g.add(prism(w,len,h,c));                        // pente principale
  g.add(prism(w+3.2,len+2.6,h*0.3,cDark||c));     // bandeau bas plus épais et plus sombre
  const rg=new THREE.Mesh(new THREE.BoxGeometry(3.4,2.2,len+1.6),mat(cDark||c));
  rg.castShadow=true; rg.position.y=h-1; g.add(rg);   // faîtage
  return g;
}
/* bâtiment à colombage, toit à deux pentes */
function house(w,d,h,rh,thatchC,simple){
  const g=new THREE.Group(), C=thatchC||COL.thatch, CD=COL.thatchDark;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),matT(0xffffff,TX.plaster,2,1.4));
  b.castShadow=b.receiveShadow=true; b.position.y=h/2; g.add(b);
  const bw=1.5;
  // sablière basse + haute
  g.add(at(box(w+1.2,bw*1.5,d+1.2,COL.beam),0,0.9,0));
  g.add(at(box(w+1.2,bw*1.5,d+1.2,COL.beam),0,h-0.9,0));
  // poteaux d'angle
  [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]].forEach(p=>
    g.add(at(box(bw*1.7,h,bw*1.7,COL.beam),p[0],h/2,p[1])));
  if(!simple){
    // poteaux intermédiaires + croix de Saint-André sur les longs pans
    const nb=Math.max(1,Math.round(w/9));
    for(let i=1;i<nb;i++) g.add(at(box(bw,h,d+0.6,COL.beam),-w/2+i*(w/nb),h/2,0));
    for(let s2=-1;s2<=1;s2+=2) for(let k=-1;k<=1;k+=2){
      const br=box(w*0.42,bw,0.9,COL.beam);
      br.position.set(k*w*0.24,h*0.5,s2*(d/2+0.35)); br.rotation.z=k*0.62; g.add(br);
    }
    g.add(at(box(w*0.24+1.6,h*0.62+1.2,0.7,COL.beam),0,h*0.31,d/2+0.35));
  }
  // porte + fenêtre lumineuse (toujours présentes : c'est ce qui donne vie la nuit)
  g.add(at(box(w*0.24,h*0.62,1.1,COL.woodDark),0,h*0.3,d/2+0.5));
  const nWin=simple?1:2;
  for(let i=0;i<nWin;i++){
    const wx=(nWin===1?-1:(i?1:-1))*w*0.3;
    if(!simple) g.add(at(box(w*0.17+1.2,h*0.2+1.2,0.7,COL.beam),wx,h*0.63,d/2+0.35));
    const win=new THREE.Mesh(new THREE.PlaneGeometry(w*0.17,h*0.2),
      new THREE.MeshBasicMaterial({color:0xffcf6e}));
    g.add(at(win,wx,h*0.63,d/2+0.72));
  }
  // toit
  const r=gable(w+4,d+3.5,rh,C,CD); r.position.y=h; g.add(r);
  return g;
}
/* ---------- accessoires de village ---------- */
function barrel(s){ s=s||1; const g=new THREE.Group();
  g.add(at(cyl(2.1*s,2.4*s,5*s,COL.wood,10),0,2.5*s,0));
  [1.3,3.7].forEach(y=>{ const b=cyl(2.35*s,2.35*s,0.6*s,COL.woodDark,10); g.add(at(b,0,y*s,0)); });
  return g; }
function crate(s){ s=s||1; const g=new THREE.Group();
  g.add(at(box(4*s,3.6*s,4*s,0xb2854a),0,1.8*s,0));
  g.add(at(box(4.3*s,0.5*s,4.3*s,COL.woodDark),0,3.4*s,0));
  g.add(at(box(4.3*s,0.5*s,4.3*s,COL.woodDark),0,0.5*s,0));
  return g; }
function haybale(s){ s=s||1; const g=new THREE.Group();
  const c=cyl(2.4*s,2.4*s,4.4*s,0xd9be62,10); c.rotation.z=Math.PI/2;
  g.add(at(c,0,2.4*s,0)); return g; }
function logpile(s){ s=s||1; const g=new THREE.Group();
  for(let i=0;i<3;i++){ const l=cyl(1.1*s,1.1*s,7*s,COL.wood,8); l.rotation.z=Math.PI/2;
    g.add(at(l,0,1.1*s,(i-1)*2.4*s)); }
  for(let i=0;i<2;i++){ const l=cyl(1.1*s,1.1*s,7*s,0x7a5630,8); l.rotation.z=Math.PI/2;
    g.add(at(l,0,3.1*s,(i-0.5)*2.4*s)); }
  return g; }
function fenceRun(n,step,s){ s=s||1; const g=new THREE.Group();
  for(let i=0;i<n;i++) g.add(at(cyl(0.7*s,0.9*s,7*s,COL.wood,6),i*step,3.5*s,0));
  [2.2,5].forEach(y=>g.add(at(box((n-1)*step,0.8*s,0.6*s,COL.woodDark),(n-1)*step/2,y*s,0)));
  return g; }
function stall(){ const g=new THREE.Group();
  [[-5,-3],[5,-3],[-5,3],[5,3]].forEach(p=>g.add(at(cyl(0.7,0.9,9,COL.wood,6),p[0],4.5,p[1])));
  const aw=box(13,0.8,9,0xc0543c); aw.rotation.x=0.16; g.add(at(aw,0,9.4,0));
  g.add(at(box(12,0.9,6,0xb2854a),0,5,0));
  [[-3.4,0xd0603a],[0,0xe8c05a],[3.4,0x6aa832]].forEach(p=>g.add(at(sph(1.3,p[1],0),p[0],6,0)));
  return g; }
function cart(){ const g=new THREE.Group();
  g.add(at(box(9,3,5.6,0xb2854a),0,4.2,0));
  g.add(at(box(9,1.2,6,COL.woodDark),0,5.9,0));
  [-1,1].forEach(k=>{ const w=cyl(2.6,2.6,0.9,COL.woodDark,12); w.rotation.x=Math.PI/2;
    g.add(at(w,k*3,2.6,3.2)); });
  g.add(at(cyl(0.5,0.5,7,COL.wood,6).rotateZ(Math.PI/2),-7,3.4,0));
  return g; }
function flowers(n,c){ const g=new THREE.Group();
  for(let i=0;i<n;i++){ const a=i*2.4, r=1+((i*7)%5)*0.7;
    g.add(at(cyl(0.18,0.18,1.8,0x4a8a2e,4),Math.cos(a)*r,0.9,Math.sin(a)*r));
    g.add(at(sph(0.75,c,0),Math.cos(a)*r,2,Math.sin(a)*r)); }
  return g; }
function tuft(s){ s=s||1; const g=new THREE.Group();
  for(let i=0;i<4;i++){ const a=i*1.6, t=cone(0.55*s,2.6*s,COL.leaf2,4);
    t.position.set(Math.cos(a)*0.8*s,1.3*s,Math.sin(a)*0.8*s);
    t.rotation.z=Math.cos(a)*0.32; t.rotation.x=Math.sin(a)*0.32; t.castShadow=false; g.add(t); }
  return g; }

/* arbre feuillu (canopée en grappe) ou sapin */
function tree(s,pine){
  const g=new THREE.Group(), th=12*s;
  const tr=cyl(1.6*s,2.6*s,th,COL.wood,7); tr.rotation.z=(s%0.3)*0.3; g.add(at(tr,0,th/2,0));
  if(pine){
    for(let i=0;i<4;i++) g.add(at(cone(9.5*s-i*1.9*s,10*s-i*1.1*s,i%2?COL.leaf3:COL.leaf,8),0,th*0.6+i*4.9*s,0));
  }else{
    const c=[COL.leaf,COL.leaf2,COL.leaf3][Math.floor(s*7)%3];
    const blobs=[[0,7.4,0,8.8],[3.4,4.8,2,5.8],[-3.4,9.2,-1.6,5.4]];
    blobs.forEach((b,i)=>{ const o=sph(b[3]*s,i%2?c:COL.leaf3,1);
      o.scale.y=0.86; g.add(at(o,b[0]*s,th+b[1]*s,b[2]*s)); });
  }
  return g;
}

/* quel bâtiment loge quel métier */
/* HOUSED : quel métier chaque bâtiment fait vivre. Un champ donne du travail,
   il ne donne pas un toit — voir DWELL juste en dessous. */
const HOUSED={hutte:null, chasseur:'chasse', fermier:'ferme', bucheron:'bois', forge:'forge', taverne:'boire', ble:'moisson', poule:'poules',
  puits:'eau', chaudron:'potion', camp:'garde', entrainement:'garde', banquet:'boire', feu:'feu'};
/* ---------- où l'on DORT ----------
   Seuls ces bâtiments sont des logements, et eux seuls font venir un habitant
   de plus au village. On n'habite ni un champ, ni un puits, ni une forge : on
   y travaille. Les noms de la boutique le disent déjà — hutte, maison de
   chasseur, ferme, cabane du bûcheron. */
const DWELL={hutte:1, chasseur:1, fermier:1, bucheron:1};
function isDwelling(key){ return !!DWELL[String(key||'').split('#')[0]]; }
/* un poste de travail par bâtiment de métier construit */
function jobSlots(){
  const out=[];
  Object.keys(HOUSED).forEach(k=>{ const j=HOUSED[k]; if(!j) return;
    const n=nOwned(k); for(let i=0;i<n;i++) out.push(j); });
  return out;
}
/* Un nouveau lieu de travail ne fait venir personne : il ouvre un poste, et
   c'est un habitant déjà là — en surnombre sur son métier — qui le prend. */
function staffJobs(){
  const slots=jobSlots();
  const posts=j=>slots.filter(x=>x===j).length;
  let moved=0;
  for(let guard=0;guard<12;guard++){
    const j=freeJob(); if(!j) break;
    const taken={};
    (S.people||[]).forEach(x=>{ if(!isChild(x)) taken[x.job]=(taken[x.job]||0)+1; });
    const spare=(S.people||[]).find(x=>!isChild(x)&&x.job!==j
      &&(taken[x.job]||0)>Math.max(1,posts(x.job)));
    if(!spare) break;
    if(!setJob(spare,j)) break;
    moved++;
  }
  if(moved) V3.saveSoon=1;
  return moved;
}
/* un métier dont le bâtiment existe et que personne ne tient encore */
function freeJob(){
  const slots=jobSlots(); if(!slots.length) return null;
  const taken={};
  (S.people||[]).forEach(x=>{ if(!isChild(x)) taken[x.job]=(taken[x.job]||0)+1; });
  const seen={};
  for(const j of shuffle(slots.slice())){
    if(seen[j]||!jobAvailable(j)) continue;
    seen[j]=1;
    const posts=slots.filter(x=>x===j).length;
    if((taken[j]||0)<posts) return j;
  }
  return null;
}
/* un métier n'est possible que si le bâtiment correspondant existe */
function jobAvailable(k){
  const j=JOBS.find(x=>x.k===k);
  return !!j && (!j.need || nOwned(j.need)>0);
}
/* métiers ouverts aux habitants des huttes : bûcheron et conteur toujours,
   moisson/eau seulement si le champ et le puits ont été construits */
function hutJobPool(){
  const pool=['bois','feu'];
  ['moisson','eau','poules'].forEach(k=>{ if(jobAvailable(k)&&!pool.includes(k)) pool.push(k); });
  return pool;
}
function jobForBuilding(id){
  const base=id.split('#')[0];
  if(base==='hutte'){ const pool=hutJobPool(); return pool[Math.floor(Math.random()*pool.length)]; }
  return HOUSED[base]||'bois';
}
/* on évite que trois habitants partagent le même rêve */
function pickDream(){
  const taken=(S.people||[]).map(x=>x.dream);
  const free=DREAMS.filter(d=>!taken.includes(d.k));
  const pool=free.length?free:DREAMS;
  return pool[Math.floor(Math.random()*pool.length)].k;
}
function newPerson(i,home,jobK){
  const used=(S.people||[]).map(x=>x.name);
  const free=ROSTER.filter(r=>!used.includes(r.n)&&r.n!=='Vercingétorix');
  const pick=free.length?free[Math.floor(Math.random()*free.length)]
    :{n:'Villageois '+(used.length+1),f:Math.random()<.5?1:0,tr:'travailleur',bio:'Arrivé récemment.',bioe:'Newly arrived.'};
  return {id:'p'+Date.now().toString(36)+i+Math.floor(Math.random()*999), name:pick.n, f:!!pick.f,
          ci:Math.floor(Math.random()*8), tr:pick.tr, bio:pick.bio, bioe:pick.bioe,
          home:home||null, job:jobK||'feu', love:null, born:Date.now(), bond:{}, chats:0,
          mood:0.55+Math.random()*0.25, mem:[]};
}
/* la population découle des bâtiments : 1 fondateur + 1 habitant par bâtiment habité */
function housingKeys(){
  const keys=['founder'];
  SHOP.forEach(it=>{
    if(!DWELL[it.id]) return;
    if(it.stack){ for(let i=0;i<nOwned(it.id);i++) keys.push(i?it.id+'#'+i:it.id); }
    else if(S.village.includes(it.id)) keys.push(it.id);
  });
  return keys;
}
/* toutes les clés de bâtiment existantes, logement ou non : sert à ne jamais
   effacer un habitant installé dans un ancien village */
function allBuildingKeys(){
  const keys=['founder'];
  SHOP.forEach(it=>{
    if(it.stack){ for(let i=0;i<nOwned(it.id);i++) keys.push(i?it.id+'#'+i:it.id); }
    else if(S.village.includes(it.id)) keys.push(it.id);
  });
  return keys;
}
/* un logement peut abriter un couple et ses enfants, pas une colocation */
function dwellingHasRoom(key){
  return (S.people||[]).filter(x=>x.home===key&&!isChild(x)).length<2;
}
/* Anciennes sauvegardes : ceux qui « habitaient » un champ ou une forge sont
   relogés dès qu'un vrai toit se libère. Personne n'est supprimé : tant qu'il
   n'y a pas de place, ils restent où ils sont. */
function rehouseWorkers(){
  const stuck=(S.people||[]).filter(x=>x.home&&x.home!=='founder'&&!isDwelling(x.home)&&!isChild(x));
  if(!stuck.length) return 0;
  const homes=housingKeys().filter(k=>k!=='founder');
  let n=0;
  stuck.forEach(r=>{
    const free=homes.find(k=>dwellingHasRoom(k));
    if(!free) return;
    const old=r.home;
    r.home=free;
    childrenOf(r).forEach(k=>{ if(k.home===old) k.home=free; });
    remember(r,'🏡 '+t('A enfin un vrai toit.','Finally has a real roof.'),'🏡 Finally has a real roof.');
    n++;
  });
  if(n) V3.saveSoon=1;
  return n;
}
function syncPeople(){
  S.people=S.people||[];
  const keys=housingKeys();
  // le fondateur d'abord
  if(!S.people.length){ const r=ROSTER[0], f=newPerson(0,'founder','feu');
    f.name=r.n; f.tr=r.tr; f.f=!!r.f; f.bio=r.bio; f.bioe=r.bioe; S.people.push(f); }
  // les couples qui durent emménagent ensemble AVANT le recensement :
  // le toit qu'ils libèrent est aussitôt proposé à un nouveau venu
  settleCouples();
  keys.forEach(k=>{ if(k==='founder') return;
    if(!S.people.some(p=>p.home===k)){
      const np=newPerson(S.people.length,k,freeJob()||jobForBuilding(k));
      S.people.push(np);
      np.dream=pickDream();
      const libre=S.vacated&&S.vacated[k];
      if(libre){ delete S.vacated[k];
        remember(np,'🏡 '+t('S\'est installé dans un logement laissé libre.','Settled into a home left empty.'),
                    '🏡 Settled into a home left empty.');
        chron('🏡 '+nameOf(np)+t(' s\'installe dans le logement libéré.',' settles into the freed-up home.'),
              '🏡 '+nameOf(np)+' settles into the freed-up home.');
      }else remember(np,'🏡 '+t('Est arrivé au village.','Arrived in the village.'),'🏡 Arrived in the village.');
      assignMentor(np);
    } });
  S.people.forEach(r=>{ if(isChild(r)) return;
    if(!r.dream) r.dream=pickDream(); if(r.mentor===undefined||r.mentor===null&&r.grown) assignMentor(r); });
  healRivalries(); growChildren(); checkDreams();
  const alive=allBuildingKeys();
  S.people=S.people.filter(p=>p.home==='founder'||alive.includes(p.home));
  rehouseWorkers();
  // un habitant dont le métier n'a plus de bâtiment se reconvertit
  S.people.forEach(p=>{
    if(isChild(p)||jobAvailable(p.job)) return;
    setJob(p, freeJob()||jobForBuilding(p.home||'hutte'));
  });
  staffJobs();
  save(); return S.people;
}
/* chroniques du village : amours, amitiés, disputes */
function chron(fr,en){
  S.events=S.events||[];
  S.events.unshift({t:Date.now(),fr,en});
  if(S.events.length>24) S.events.length=24;
}
/* évolution d'une relation après une discussion */
function relate(A,B){
  A.bond[B.id]=(A.bond[B.id]||0)+1; B.bond[A.id]=(B.bond[A.id]||0)+1;
  A.chats++; B.chats++;
  const n=A.bond[B.id];
  if(n===6){ chron(A.name+' et '+B.name+' sont devenus amis.',A.name+' and '+B.name+' became friends.');
    remember(A,'🤝 '+t('Est devenu ami avec ','Became friends with ')+B.name+'.','🤝 Became friends with '+B.name+'.');
    remember(B,'🤝 '+t('Est devenu ami avec ','Became friends with ')+A.name+'.','🤝 Became friends with '+A.name+'.'); }
  if(n===14){ chron(A.name+' et '+B.name+' sont désormais inséparables.',A.name+' and '+B.name+' are now inseparable.');
    remember(A,'💫 '+t('Inséparable de ','Inseparable from ')+B.name+'.','💫 Inseparable from '+B.name+'.');
    remember(B,'💫 '+t('Inséparable de ','Inseparable from ')+A.name+'.','💫 Inseparable from '+A.name+'.'); }
  // coup de foudre : lien fort, pas déjà en couple, et sexes différents
  if(n>=20&&!A.love&&!B.love&&A.f!==B.f&&Math.random()<0.35){
    A.love=B.id; B.love=A.id; A.loveAt=B.loveAt=Date.now();
    chron('💛 '+A.name+' et '+B.name+' filent le parfait amour !','💛 '+A.name+' and '+B.name+' have fallen in love!');
    remember(A,'💛 '+t('Est tombé amoureux de ','Fell in love with ')+B.name+'.','💛 Fell in love with '+B.name+'.');
    remember(B,'💛 '+t('Est tombé amoureux de ','Fell in love with ')+A.name+'.','💛 Fell in love with '+A.name+'.');
    checkDreams();
  }
  // petite dispute
  if(n>8&&Math.random()<0.045){
    A.bond[B.id]=Math.max(0,n-4); B.bond[A.id]=A.bond[B.id];
    const why=[['une histoire de sanglier mal partagé','a badly shared boar'],
               ['un menhir posé de travers','a crooked menhir'],
               ['la fraîcheur du poisson','the freshness of the fish'],
               ['qui parle le plus fort à la veillée','who talks loudest at the gathering']];
    const w=why[Math.floor(Math.random()*why.length)];
    chron('⚡ '+A.name+' s\'est disputé avec '+B.name+' pour '+w[0]+'.',
          '⚡ '+A.name+' argued with '+B.name+' over '+w[1]+'.');
    noteClash(A,B);
    if(A.love===B.id&&Math.random()<0.4){ A.love=null; B.love=null;
      chron('💔 '+A.name+' et '+B.name+' se sont séparés…','💔 '+A.name+' and '+B.name+' have broken up…');
      remember(A,'💔 '+t('S\'est séparé de ','Broke up with ')+B.name+'.','💔 Broke up with '+B.name+'.');
      remember(B,'💔 '+t('S\'est séparé de ','Broke up with ')+A.name+'.','💔 Broke up with '+A.name+'.'); }
  }
  V3.saveSoon=1;
}

 {k:'banquet', need:'banquet', fr:'un banquet où tout le village tient',        en:'a banquet big enough for the whole village'},
 {k:'muraille',need:'muraille',fr:'dormir derrière de vraies murailles',        en:'sleeping behind real ramparts'},

 {k:'examen',  goal:'exam',    fr:'te voir décrocher ce fichu permis',          en:'seeing you land that blasted licence'},
 {k:'prospere',goal:'happy',   fr:'un village qui ne manque plus de rien',      en:'a village that wants for nothing'}
];
function dreamOf(rec){ return DREAMS.find(d=>d.k===(rec&&rec.dream))||null; }
function dreamDone(rec){
  const d=dreamOf(rec); if(!d) return false;
  if(d.need) return nOwned(d.need)>0;
  if(d.goal==='friends3') return Object.values(rec.bond||{}).filter(v=>v>=6).length>=3;
  if(d.goal==='pop12')    return (S.people||[]).length>=12;
  if(d.goal==='love')     return !!rec.love;
  if(d.goal==='exam')     return !!S.examPassed;
  if(d.goal==='happy')    return villageHappy()>=100;
  return false;
}
/* un rêve accompli marque durablement l'habitant */
function checkDreams(){
  (S.people||[]).forEach(r=>{
    if(!r.dream||r.dreamAt) return;
    if(!dreamDone(r)) return;
    r.dreamAt=Date.now(); nudgeMood(r,0.35);
    const d=dreamOf(r);
    remember(r,'✨ '+t('A enfin vu '+d.fr+'.','Finally saw '+d.en+'.'),
                '✨ Finally saw '+d.en+'.');
    chron('✨ '+r.name+t(' réalise son rêve : ',' fulfils a dream: ')+d.fr+'.',
          '✨ '+r.name+' fulfils a dream: '+d.en+'.');
  });
}
/* mémoire : les 6 moments qui ont compté pour cet habitant */
function remember(rec,fr,en){
  rec.mem=rec.mem||[];
  // on ne réécrit pas deux fois le même souvenir (amitié perdue puis retrouvée)
  if(rec.mem.some(m=>m.fr===fr)) return;
  rec.mem.unshift({t:Date.now(),fr,en});
  if(rec.mem.length>6) rec.mem.length=6;
}
/* un nouvel arrivant se met dans les pas d'un ancien du même métier */
/* Changer de métier, c'est changer d'atelier : le mentorat suit. On ne reste
   pas l'élève d'un forgeron quand on part aux champs, et on ne garde pas des
   élèves d'un métier qu'on ne pratique plus. */
function setJob(rec,j){
  if(!rec||!j||rec.job===j) return false;
  rec.job=j;
  rec.mentor=undefined; assignMentor(rec);
  (S.people||[]).forEach(x=>{
    if(x.mentor===rec.id&&x.job!==rec.job){ x.mentor=undefined; assignMentor(x); }
  });
  V3.saveSoon=1;
  return true;
}

/* ---------- emménager ensemble ----------
   Un couple qui dure finit par ne plus faire qu'un feu : l'un rejoint l'autre,
   et le toit laissé vide accueillera un nouveau venu au prochain recensement.
   On choisit le logement le plus « beau » (l'ordre de la boutique fait foi),
   et à égalité celui du plus ancien du village, pour que ce soit stable. */
const MOVE_IN_DELAY=6*36e5;               // six heures d'amour avant le déménagement
function homeRank(key){
  const base=String(key||'').split('#')[0];
  if(base==='founder') return 1e6;        // on ne déloge jamais le chef
  const i=SHOP.findIndex(x=>x.id===base);
  return i<0?-1:i;
}
function moveInTogether(A,B){
  if(!A||!B||A.love!==B.id||B.love!==A.id) return false;
  if(isChild(A)||isChild(B)) return false;
  if(!A.home||!B.home||A.home===B.home) return false;
  if(Date.now()-Math.max(A.loveAt||0,B.loveAt||0)<MOVE_IN_DELAY) return false;
  // qui garde son toit ?
  let keep=A, leave=B;
  const ra=homeRank(A.home), rb=homeRank(B.home);
  if(rb>ra||(rb===ra&&(B.born||0)<(A.born||0))){ keep=B; leave=A; }
  const old=leave.home;
  leave.home=keep.home;
  // les enfants suivent le parent qui déménage
  childrenOf(leave).forEach(k=>{ if(k.home===old) k.home=keep.home; });
  S.vacated=S.vacated||{};
  S.vacated[old]=Date.now();              // le prochain habitant saura pourquoi c'est libre
  const hn=homeLabel(keep);
  remember(leave,'📦 '+t('A emménagé avec ','Moved in with ')+nameOf(keep)+'.','📦 Moved in with '+nameOf(keep)+'.');
  remember(keep,'📦 '+nameOf(leave)+t(' a emménagé ici.',' moved in here.'),'📦 '+nameOf(leave)+' moved in here.');
  nudgeMood(A,0.25); nudgeMood(B,0.25);
  chron('📦 '+nameOf(leave)+t(' a emménagé chez ',' moved in with ')+nameOf(keep)+' ('+hn+').',
        '📦 '+nameOf(leave)+' moved in with '+nameOf(keep)+' ('+hn+').');
  V3.saveSoon=1;
  return true;
}
/* tous les couples séparés qui doivent se rejoindre le font */
function settleCouples(){
  const P=S.people||[]; const done={};
  P.forEach(A=>{
    if(!A.love||done[A.id]) return;
    const B=P.find(x=>x.id===A.love);
    if(!B||B.love!==A.id) return;
    done[A.id]=done[B.id]=1;
    moveInTogether(A,B);
  });
}
/* un couple installé sous le même toit peut fonder une famille */
function tryBaby(A,B){
  if(!A||!B||A.love!==B.id) return false;
  if(isChild(A)||isChild(B)) return false;
  if(A.home!==B.home) return false;                          // on fonde un foyer, pas un couloir
  if((S.people||[]).length>=40) return false;
  if(childrenOf(A).filter(k=>!k.grown).length>=2) return false;
  if(Date.now()-(A.lastBaby||0)<12*36e5) return false;       // pas plus d'un enfant par demi-journée
  if(Math.random()>=0.16) return false;

  S.people.push(k);
  nudgeMood(A,0.3); nudgeMood(B,0.3);
  remember(A,'👶 '+t('Est devenu parent de ','Became a parent to ')+k.name+'.','👶 Became a parent to '+k.name+'.');
  remember(B,'👶 '+t('Est devenu parent de ','Became a parent to ')+k.name+'.','👶 Became a parent to '+k.name+'.');
  remember(k,'🍼 '+t('Est né au village.','Was born in the village.'),'🍼 Was born in the village.');
  chron('👶 '+A.name+t(' et ',' and ')+B.name+t(' ont eu un enfant : ',' had a child: ')+k.name+' !',

/* humeur : 0 = maussade, 1 = ravi. Persistée sur la fiche de l'habitant. */
function moodOf(rec){ const m=rec&&rec.mood; return (typeof m==='number'&&isFinite(m))?Math.max(0,Math.min(1,m)):0.6; }
function nudgeMood(rec,d){ if(rec) rec.mood=Math.max(0,Math.min(1,moodOf(rec)+d)); }

/* envie de discuter : caractère d'abord, puis liens, humeur et contexte */
const CHATTINESS={bavard:0.9, curieux:0.75, gourmand:0.6, reveur:0.5, courageux:0.5, travailleur:0.28, grognon:0.22};
function wantsToTalk(A,B,mode){
  if(!A||!B) return false;
  if(mode==='sleep') return false;           // entre 23 h et 7 h, on dort
  let w=CHATTINESS[A.tr]!=null?CHATTINESS[A.tr]:0.5;
  const bond=(A.bond&&A.bond[B.id])||0;
  if(A.rival===B.id) return false;           // une rancune tenace : on ne s'adresse plus la parole
  if(A.love===B.id) w+=0.45;                 // on ne rate jamais l'occasion de croiser son amour
  else if(A.mentor===B.id||B.mentor===A.id) w+=0.25;   // maître et élève se cherchent
  else if(bond>=14) w+=0.3;
  else if(bond>=6)  w+=0.18;
  else if(bond===0) w-=0.05;                 // un inconnu, on hésite un peu
  w+=(moodOf(A)-0.5)*0.35;                   // de mauvaise humeur, on parle moins
  if(mode==='social'||mode==='eat') w+=0.3;  // à la veillée, tout le monde se parle
  else if(mode==='work') w-=0.22;            // en pleine tâche, on décline plus souvent
  if(A.tr==='travailleur'&&mode==='work') w-=0.2;
  return Math.random()<Math.max(0.02,Math.min(0.95,w));
}
/* réaction d'une rencontre : influence mutuelle */
function meetOutcome(A,B){
  const bond=(A.bond&&A.bond[B.id])||0;
  if(A.love===B.id||B.love===A.id) return 'love';
  const grump=(A.tr==='grognon')+(B.tr==='grognon');
  const risk=0.05+grump*0.09+Math.max(0,0.5-Math.min(moodOf(A),moodOf(B)))*0.3-(bond>=14?0.06:0);
  if(Math.random()<risk) return 'clash';
  return bond>=6?'warm':'chat';
}
/* une brouille de plus. Trois accrochages sans que l'amitié n'ait pris,
   et les deux cessent tout simplement de s'adresser la parole. */
function noteClash(A,B){
  if(!A||!B) return;
  A.rows=(A.rows||0)+1; B.rows=(B.rows||0)+1;
  const bond=(A.bond&&A.bond[B.id])||0;
  if(A.rival===B.id||A.love===B.id||bond>=12) return;
  if(Math.min(A.rows,B.rows)<3) return;
  A.rival=B.id; B.rival=A.id; A.rivalAt=B.rivalAt=Date.now();
  remember(A,'⚔️ '+t('Ne parle plus à ','No longer speaks to ')+B.name+'.','⚔️ No longer speaks to '+B.name+'.');
  remember(B,'⚔️ '+t('Ne parle plus à ','No longer speaks to ')+A.name+'.','⚔️ No longer speaks to '+A.name+'.');
  chron('⚔️ '+A.name+t(' et ',' and ')+B.name+t(' ne se parlent plus.',' are no longer on speaking terms.'),
        '⚔️ '+A.name+' and '+B.name+' are no longer on speaking terms.');

function healRivalries(){

/* ---------- bonheur individuel ----------
   L'humeur d'un habitant est la moyenne de ce qu'il ressent. On liste chaque
   facteur, ce qu'il coûte ou rapporte, et ce que TU peux y faire. */
function happinessOf(rec){
  const f=[];                          // {ic, why, whye, fix, fixe, d} d = points (−/+)
  const add=(ic,why,whye,fix,fixe,d)=>f.push({ic,why,whye,fix,fixe,d});
  const res=S.res||{food:0,wood:0,iron:0};

  // — la faim, avant tout
  const bal=foodBalance();
  if(res.food<=0)
    add('🍽️','Il a le ventre vide.','They are going hungry.',
        'Réponds juste ou construis une ferme / maison de chasseur.',
        'Answer correctly, or build a farm / hunter\'s lodge.',-30);
  else if(bal<0)
    add('📉','Les réserves baissent : '+bal+' 🌾/h.','Stores are shrinking: '+bal+' 🌾/h.',
        'Construis une ferme ou une maison de chasseur.','Build a farm or a hunter\'s lodge.',-12);

  // — les besoins du village
  const miss=NEEDS.filter(n2=>!needState(n2).ok);
  if(miss.length)
    add('🏺','Le village manque de '+miss.map(m=>t(m.n,m.ne)).join(', ')+'.',
             'The village is short of '+miss.map(m=>m.ne).join(', ')+'.',
        'Va chercher ces ressources : chaque bonne réponse en produit une.',
        'Go get those resources: every correct answer produces one.',-6*miss.length);

  // — la vie sociale
  const bf=bestFriend(rec);
  if(!bf||bf.n<6)
    add('🫥','Il n\'a encore aucun véritable ami.','They have no real friend yet.',
        'Laisse le village tourner : les rencontres se font toutes seules. Une taverne ou un banquet les accélère.',
        'Let the village run: encounters happen on their own. A tavern or a banquet speeds them up.',-10);
  else add('🤝','Il peut compter sur '+bf.p.name+'.','They can count on '+bf.p.name+'.','','',+8);

  if(rec.rival){
    const rv=(S.people||[]).find(x=>x.id===rec.rival);
    add('⚔️','Il ne parle plus à '+((rv&&rv.name)||'quelqu\'un')+'.','They are not speaking to '+((rv&&rv.name)||'someone')+'.',
        'Le temps fait son œuvre : ils finiront par se réconcilier.','Time heals it: they will make peace eventually.',-12);
  }
  const lv=loveOf(rec);
  if(lv) add('💛','Il file le parfait amour avec '+lv.name+'.','They are in love with '+lv.name+'.','','',+12);

  // — son rêve
  const dr=dreamOf(rec);
  if(dr&&!rec.dreamAt){
    const it=dr.need?SHOP.find(x=>x.id===dr.need):null;
    add('🌙','Son rêve n\'est pas réalisé : '+t(dr.fr,dr.en)+'.','Their dream is unfulfilled: '+dr.en+'.',
        it?('Construis : '+t(it.n,it.ne)+' ('+priceOf(it)+' 🪙).'):'Continue à faire vivre le village.',
        it?('Build: '+it.ne+' ('+priceOf(it)+' 🪙).'):'Keep the village going.',-8);
  }else if(dr&&rec.dreamAt) add('✨','Son rêve s\'est réalisé.','Their dream came true.','','',+10);

  // — le confort du village
  if(!nOwned('taverne')&&!nOwned('banquet'))
    add('🍺','Aucun endroit où se retrouver le soir.','Nowhere to gather in the evening.',
        'Construis une taverne ou une table de banquet.','Build a tavern or a banquet table.',-8);
  if(!nOwned('feu'))
    add('🔥','Pas de feu au centre du village.','No fire at the heart of the village.',
        'Construis un feu de camp.','Build a campfire.',-6);
  if(nOwned('muraille')||nOwned('palissade')||nOwned('camp'))
    add('🛡️','Il se sent en sécurité.','They feel safe.','','',+6);
  else add('😨','Rien ne protège le village de César.','Nothing shields the village from Caesar.',
        'Construis une palissade, une muraille ou un camp militaire.',
        'Build a palisade, ramparts or a military camp.',-8);

  // — sa famille
  const kids=childrenOf(rec);
  if(kids.length) add('👶','Il élève '+kids.length+' enfant'+(kids.length>1?'s':'')+'.',
      'They are raising '+kids.length+' child'+(kids.length>1?'ren':'')+'.','','',+10);

  // — son caractère colore tout
  if(rec.tr==='grognon') add('😠','Il est grognon de nature.','They are grumpy by nature.',
      'Rien à faire — c\'est lui.','Nothing to do — that is just them.',-6);
  if(rec.tr==='travailleur'&&bal>=0) add('💪','Le travail avance, il est content.','Work is going well, they are pleased.','','',+5);

  const raw=f.reduce((a,x)=>a+x.d,0);
  const pct=Math.max(0,Math.min(100,Math.round(52+raw*0.8+(moodOf(rec)-0.5)*46)));
  return {pct, factors:f.sort((a,b)=>a.d-b.d)};
}
