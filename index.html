  --edge:#2B3850;         /* bordures discrètes */
  --retro:#EFF3F8;        /* texte rétro-réfléchissant */
  --dim:#93A3B8;          /* texte secondaire */
  --bus:#FFC61A;          /* jaune school-bus : XP, accent principal */
  --busD:#8F6D00;
  --exit:#33B268;         /* vert guide-sign : correct, GO */
  --exitD:#155C33;
  --exitP:#0F4A28;        /* fond panneau exit */
  --stop:#E5383B;         /* rouge STOP : erreur, boss */
  --stopD:#7C1215;
  --zone:#F58220;         /* orange work-zone : combo, streak */
  --shield:#4A8DE8;       /* bleu interstate : info, niveaux */
  --shieldD:#1D4E94;
  --px:'Press Start 2P',ui-monospace,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, #16233A 0%, transparent 60%),
    var(--asphalt);
  color:var(--retro);
  font-family:var(--sans);
  font-size:16px;line-height:1.5;
  min-height:100vh;
  padding-bottom:56px;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px dashed var(--bus);outline-offset:3px;border-radius:4px}
input,select{font-family:inherit;font-size:inherit;color:var(--retro);background:var(--lane2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}

/* ---------- structure ---------- */
#wrap{max-width:600px;margin:0 auto;padding:0 14px}
main#app{display:block;padding-top:14px}
.screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(#0C1118F2,#0C1118E6);
  backdrop-filter:blur(6px);
  border-bottom:3px solid var(--edge);
}
.hud-in{max-width:600px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.lvl-shield{
  flex:none;width:46px;height:50px;display:grid;place-items:center;
  background:var(--shield);
  clip-path:polygon(0 12%,15% 0,85% 0,100% 12%,100% 55%,50% 100%,0 55%);
  box-shadow:inset 0 0 0 3px #fff3;
  font-family:var(--px);font-size:13px;color:#fff;text-shadow:0 2px 0 #0006;
  padding-top:2px;
}
.hud-mid{flex:1;min-width:0}
.hud-title{font-family:var(--px);font-size:8px;letter-spacing:.5px;color:var(--bus);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.xp-lane{position:relative;height:14px;background:#000A;border:2px solid var(--edge);border-radius:7px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--busD),var(--bus));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-dash{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 14px,#0C111866 14px 22px)}
.hud-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.jchip{
  font-family:var(--px);font-size:9px;padding:5px 8px;border-radius:5px;
  background:var(--exitP);border:2px solid #fff;color:#fff;letter-spacing:.5px;
  box-shadow:0 2px 0 #0008;
}
.jchip.hot{background:var(--stopD);border-color:var(--stop);animation:pulse 1.4s infinite}
.hudlang{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:15px;line-height:1;padding:5px 7px;border:2px solid var(--bus);border-radius:9px;background:#3A2F00;box-shadow:0 2px 0 #0008}
.hudlang i{font-style:normal;font-family:var(--px);font-size:7px;color:var(--bus);letter-spacing:.5px}
.hudlang:active{transform:translateY(1px)}
.goalchip{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.goalchip b{color:var(--bus)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ---------- typographic bits ---------- */
.px{font-family:var(--px)}
h1.logo{font-family:var(--px);font-size:clamp(22px,7vw,34px);color:var(--bus);text-align:center;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 24px #FFC61A44;margin:10px 0 2px}
.logo-sub{font-family:var(--px);font-size:9px;color:var(--dim);text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
.eyebrow{font-family:var(--px);font-size:9px;color:var(--zone);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.small{font-size:13px;color:var(--dim)}

/* dashed center-line divider */
.centerline{border:none;height:4px;margin:18px 0;background:repeating-linear-gradient(90deg,var(--bus) 0 26px,transparent 26px 46px);opacity:.5;border-radius:2px}

/* ---------- panels & buttons ---------- */
.panel{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:16px;box-shadow:0 5px 0 #00000066}
.panel+.panel{margin-top:12px}

.btn{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  font-family:var(--px);font-size:11px;line-height:1.6;letter-spacing:.5px;
  padding:15px 16px;border-radius:10px;border:3px solid;
  transition:transform .06s,box-shadow .06s;text-transform:uppercase;
}
.btn:active{transform:translateY(3px)}
.btn .ic{font-size:20px;flex:none;font-family:var(--sans)}
.btn .sub{display:block;font-family:var(--sans);font-size:12.5px;color:#FFFFFFB0;text-transform:none;letter-spacing:0;font-weight:400;margin-top:3px}
.btn-exit{background:var(--exitP);border-color:#fff;color:#fff;box-shadow:0 4px 0 #00000088}
.btn-exit:active{box-shadow:0 1px 0 #00000088}
.btn-bus{background:#3A2F00;border-color:var(--bus);color:var(--bus);box-shadow:0 4px 0 #00000088}
.btn-shield{background:#12253F;border-color:var(--shield);color:#CFE2FB;box-shadow:0 4px 0 #00000088}
.btn-stop{background:#2E0D0E;border-color:var(--stop);color:#FFD7D8;box-shadow:0 4px 0 #00000088}
.btn-ghost{background:var(--lane2);border-color:var(--edge);color:var(--dim);box-shadow:0 4px 0 #00000055}
.btnrow{display:flex;gap:10px}
.btnrow .btn{justify-content:center;text-align:center}
.menu{display:flex;flex-direction:column;gap:11px}

/* ---------- world cards ---------- */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.wcard{
  position:relative;background:var(--lane);border:3px solid var(--edge);border-radius:12px;
  padding:14px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;
  box-shadow:0 4px 0 #00000066;transition:transform .06s;text-align:left;
}
.wcard:active{transform:translateY(3px)}
.wcard .ic{font-size:26px}
.wcard .nm{font-family:var(--px);font-size:9px;line-height:1.7;color:var(--retro);text-transform:uppercase;min-height:31px}
.wcard .mastery{width:100%;display:flex;align-items:center;gap:7px}
.mring{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--exit) calc(var(--p)*1%),#000A 0);border:2px solid var(--edge)}
.mring i{width:20px;height:20px;border-radius:50%;background:var(--lane);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:8.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.wcard .beaten{position:absolute;top:8px;right:9px;font-size:15px;filter:drop-shadow(0 2px 0 #000)}
.wcard.done{border-color:var(--exit)}

/* ---------- quiz ---------- */
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.qprog{font-family:var(--px);font-size:9px;color:var(--dim);letter-spacing:1px}
.combo{font-family:var(--px);font-size:10px;color:var(--zone);display:flex;align-items:center;gap:5px}
.combo .f{font-size:15px;animation:flame .5s infinite alternate}
@keyframes flame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.18) rotate(4deg)}}
.qbar{height:8px;background:#000A;border:2px solid var(--edge);border-radius:5px;overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--shield);transition:width .3s}
.qcard{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:18px 16px;box-shadow:0 5px 0 #00000066}
.qtext{font-size:17.5px;font-weight:650;line-height:1.45;text-wrap:balance}
.qsign{display:flex;justify-content:center;margin:4px 0 12px}
.qsign svg{filter:drop-shadow(0 4px 6px #000A)}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--lane2);border:3px solid var(--edge);border-radius:10px;
  padding:12px 13px;font-size:15px;line-height:1.4;color:var(--retro);
  box-shadow:0 3px 0 #00000055;transition:transform .05s,border-color .1s,background .1s;
}
.opt:not(:disabled):active{transform:translateY(2px)}
.opt .key{
  flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:6px;
  font-family:var(--px);font-size:10px;background:#000A;color:var(--dim);border:2px solid var(--edge);
}
.opt.sel-ok{background:#0F3A22;border-color:var(--exit);animation:popOk .3s}
.opt.sel-ok .key{background:var(--exit);color:#fff;border-color:var(--exit)}
.opt.sel-ko{background:#3A1113;border-color:var(--stop)}
.opt.sel-ko .key{background:var(--stop);color:#fff;border-color:var(--stop)}
.opt.reveal{border-color:var(--exit);border-style:dashed}
.opt:disabled{opacity:.92;cursor:default}
.opt.fade{opacity:.45}
@keyframes popOk{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

.verdict{font-family:var(--px);font-size:13px;margin-top:15px;letter-spacing:.5px}
.verdict.ok{color:var(--exit)}
.verdict.ko{color:var(--stop)}
.exp{
  margin-top:11px;background:#241C05;border:2px dashed var(--bus);border-radius:10px;
  padding:12px 13px;font-size:14.5px;line-height:1.5;color:#F5E8BE;
}
.exp .tag{font-family:var(--px);font-size:8px;color:var(--bus);display:block;margin-bottom:6px;letter-spacing:1px}
.nextbar{margin-top:14px}

/* shake on wrong */
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* floating +XP */
.floatxp{
  position:fixed;z-index:80;font-family:var(--px);font-size:14px;color:var(--bus);
  text-shadow:0 2px 0 #000;pointer-events:none;animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}

/* ---------- boss ---------- */
.bosshead{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.bossface{font-size:42px;filter:drop-shadow(0 3px 0 #000);animation:bossIdle 2.2s ease-in-out infinite}
@keyframes bossIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bossface.hit{animation:bossHit .35s}
@keyframes bossHit{0%{transform:scale(1) rotate(0);filter:drop-shadow(0 3px 0 #000) brightness(2)}50%{transform:scale(.86) rotate(-8deg)}100%{transform:scale(1)}}
.bossname{font-family:var(--px);font-size:11px;color:var(--stop);line-height:1.7}
.hpbar{height:18px;background:#000A;border:3px solid var(--stopD);border-radius:9px;overflow:hidden;position:relative}
.hpfill{height:100%;background:linear-gradient(90deg,#8C1013,var(--stop));transition:width .4s cubic-bezier(.2,.8,.2,1)}
.hplabel{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--px);font-size:8px;color:#fff;text-shadow:0 1px 0 #000}
.hearts{font-size:19px;letter-spacing:3px;margin-top:8px}
.hearts .off{opacity:.22;filter:grayscale(1)}

/* ---------- blitz ---------- */
.blitzhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.timer{font-family:var(--px);font-size:22px;color:var(--bus);font-variant-numeric:tabular-nums}
.timer.low{color:var(--stop);animation:pulse .5s infinite}
.blitzscore{font-family:var(--px);font-size:14px;color:var(--retro)}
.drillp{font-size:18px;font-weight:700;line-height:1.45;text-wrap:balance;min-height:80px;display:flex;align-items:center}
.drillp b{color:var(--bus)}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opts.grid2 .opt{justify-content:center;text-align:center;font-family:var(--mono);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:16px 8px}

/* ---------- results / big numbers ---------- */
.bigscore{font-family:var(--px);font-size:40px;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.bigscore.ok{color:var(--exit)}
.bigscore.ko{color:var(--stop)}
.stamp{
  font-family:var(--px);font-size:19px;text-align:center;padding:14px 10px;margin:14px auto;
  max-width:340px;border:4px solid;border-radius:10px;transform:rotate(-3deg);letter-spacing:2px;
}
.stamp.ok{color:var(--exit);border-color:var(--exit);background:#0F3A2244;text-shadow:0 0 16px #33B26866}
.stamp.ko{color:var(--stop);border-color:var(--stop);background:#3A111344}
.statrow{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--lane2);border:2px solid var(--edge);border-radius:10px;padding:11px 8px;text-align:center}
.stat .v{font-family:var(--px);font-size:15px;color:var(--bus);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
.stars{text-align:center;font-size:34px;letter-spacing:8px;margin:6px 0}
.stars .off{opacity:.2;filter:grayscale(1)}

/* ---------- grimoire ---------- */
.gsec{margin-bottom:16px}
.gsec h3{font-family:var(--px);font-size:10px;color:var(--zone);margin-bottom:9px;letter-spacing:1px;text-transform:uppercase}
.gtable{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
.gtable td{padding:8px 10px;border-bottom:1px dashed var(--edge);vertical-align:top;overflow-wrap:anywhere;word-break:break-word}
.gtable td:first-child{width:52%}
.gtable td:last-child{text-align:right;font-family:var(--mono);font-weight:700;color:var(--bus);font-variant-numeric:tabular-nums}
.gtable tr:last-child td{border-bottom:none}

/* ---------- village 3D ---------- */
.v3d{position:relative;height:320px;margin-bottom:12px;border:3px solid #7BAE3F;border-radius:14px;overflow:hidden;
  background:linear-gradient(#0B1729 0%,#16233A 26%,#24351A 26%,#1A2711 100%);
  touch-action:none;cursor:grab;box-shadow:0 5px 0 #00000066}
.v3d.dragging{cursor:grabbing}
.v3d-cam{position:absolute;inset:0;perspective:760px;perspective-origin:50% 44%}
.v3d-world{position:absolute;left:50%;top:60%;width:0;height:0;transform-style:preserve-3d;
  transform:scale(1.22) rotateX(var(--tilt,56deg)) rotateZ(var(--rot,-26deg))}
.g-obj{position:absolute;transform-style:preserve-3d}
.g-face{position:absolute;left:50%;top:50%;backface-visibility:visible}
.g-tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.g-ground{position:absolute;left:50%;top:50%;width:290px;height:290px;margin:-145px 0 0 -145px;border-radius:34px;
  background:radial-gradient(circle at 38% 32%,#43642A,#31501E 62%,#26401A);
  box-shadow:0 0 0 3px #1D3312,0 0 46px #000 inset}
.g-path{background:#7A6647;border-radius:11px;opacity:.75}
.g-bill{position:absolute;left:50%;top:50%;transform-origin:50% 100%;line-height:1;white-space:nowrap;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.55));pointer-events:none}
.g-plot{position:absolute;left:50%;top:50%;border:2px dashed rgba(123,174,63,.45);border-radius:7px}
.g-glow{border-radius:50%;background:radial-gradient(circle,rgba(255,168,40,.55),rgba(255,120,20,0) 70%);animation:v3glow 1.6s ease-in-out infinite}
/* --- animations des sprites (à l'intérieur du billboard) --- */
.g-bill i{display:inline-block;transform-origin:50% 90%}
@keyframes v3glow{0%,100%{opacity:.55;transform:translateZ(.8px) scale(1)}50%{opacity:.9;transform:translateZ(.8px) scale(1.18)}}
@keyframes v3fire{0%,100%{transform:scale(1) rotate(-3deg)}35%{transform:scale(1.14,.94) rotate(4deg)}70%{transform:scale(.93,1.12) rotate(-2deg)}}
.g-bill i.fire{animation:v3fire .55s ease-in-out infinite}
@keyframes v3sm{0%{opacity:0;transform:translateY(0) scale(.45)}18%{opacity:.6}100%{opacity:0;transform:translateY(-34px) scale(1.5)}}
.g-bill i.sm{animation:v3sm 2.6s linear infinite;opacity:0}
@keyframes v3sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.g-bill i.sway{animation:v3sway 2.4s ease-in-out infinite}
@keyframes v3peck{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(3px) rotate(16deg)}}
.g-bill i.peck{animation:v3peck 1.7s ease-in-out infinite}
@keyframes v3trot{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-2px) scaleX(.94)}}
.g-bill i.trot{animation:v3trot 1.1s ease-in-out infinite}
@keyframes v3hammer{0%,100%{transform:rotate(-16deg)}45%{transform:rotate(22deg)}}
.g-bill i.hammer{animation:v3hammer .7s ease-in-out infinite}
@keyframes v3spark{0%,100%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.2)}60%{opacity:0;transform:scale(.7) translateY(-6px)}}
.g-bill i.spark{animation:v3spark .7s linear infinite}
@keyframes v3hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.g-bill i.hop{animation:v3hop 1s ease-in-out infinite}
@keyframes v3note{0%{opacity:0;transform:translateY(2px) rotate(-8deg)}25%{opacity:1}100%{opacity:0;transform:translateY(-16px) rotate(10deg)}}
.g-bill i.note{animation:v3note 2.2s ease-out infinite}
@keyframes v3swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.g-bill i.swing{animation:v3swing 2.8s ease-in-out infinite}
@keyframes v3bubble{0%,100%{transform:scale(1)}50%{transform:scale(1.1,.92)}}
.g-bill i.bubble{animation:v3bubble 1.4s ease-in-out infinite}
@keyframes v3idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.g-bill i.idle{animation:v3idle 2.2s ease-in-out infinite}
@keyframes v3work{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}}
.g-bill i.work{animation:v3work 1.2s ease-in-out infinite}
@keyframes v3walk{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-3px) rotate(4deg)}}
.g-bill i.walk{animation:v3walk .62s ease-in-out infinite}
@keyframes v3boom{0%,100%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
.g-bill i.boom{animation:v3boom 1.5s ease-in-out infinite}

/* --- miniatures 3D de la boutique --- */
@property --rot{syntax:'<angle>';inherits:true;initial-value:0deg}
@property --tilt{syntax:'<angle>';inherits:true;initial-value:56deg}
@keyframes v3spin{from{--rot:0deg}to{--rot:360deg}}
.v3mini{position:relative;flex:none;width:58px;height:50px;perspective:320px;overflow:hidden}
.v3mini .mw{position:absolute;left:50%;top:64%;width:0;height:0;transform-style:preserve-3d;--tilt:58deg;
  transform:scale(var(--ms,.7)) rotateX(58deg) rotateZ(var(--rot));animation:v3spin 18s linear infinite}
.shoprow:nth-child(odd) .mw{animation-duration:22s}
.shoprow.got .v3mini{opacity:.85}
@media (prefers-reduced-motion: reduce){
  .v3mini .mw{animation:none;--rot:-28deg}
  .g-bill i,.g-glow{animation:none!important}
}
.v3d-hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:#CFE3B5;opacity:.75;pointer-events:none;text-shadow:0 1px 2px #000}
.v3d-ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.v3d-ctl button{width:32px;height:32px;border:2px solid #7BAE3F;border-radius:8px;background:#1B2E10CC;color:#C9E8A5;font-size:15px;line-height:1}
.v3d-ctl button:active{transform:translateY(1px)}

/* ---------- village gaulois ---------- */
.vpanel{background:linear-gradient(#12253F 0%,#12253F 26%,#1E2A12 26%,#243617 100%);border-color:#7BAE3F}
.vsky{font-size:19px;letter-spacing:14px;padding:2px 4px 12px;opacity:.9}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vslot{aspect-ratio:1;display:grid;place-items:center;font-size:30px;border:2px dashed #7BAE3F55;border-radius:10px;background:#00000022}
.vslot.filled{border-style:solid;border-color:#7BAE3F;background:#2C441C;box-shadow:0 3px 0 #00000055;animation:popOk .35s}
.shoprow{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px dashed var(--edge)}
.shoprow:last-child{border-bottom:none}
.shoprow.got{opacity:.55}
.shoprow .sic{font-size:23px;flex:none;width:30px;text-align:center}
.shoprow .snm{flex:1;font-size:14px}
.shoprow .sgot{font-family:var(--px);font-size:8px;color:var(--exit)}
.sbuy{font-family:var(--px);font-size:9px;padding:9px 11px;border:2px solid var(--bus);border-radius:9px;background:#3A2F00;color:var(--bus);white-space:nowrap;box-shadow:0 2px 0 #0008}
.sbuy.cant{border-color:var(--edge);color:var(--dim);background:var(--lane2);opacity:.7}
.sbuy:active{transform:translateY(1px)}

/* ---------- incontournables ---------- */
.hcard{background:var(--lane);border:3px solid var(--edge);border-radius:11px;padding:0;margin-bottom:9px;overflow:hidden}
.hcard summary{cursor:pointer;list-style:none;padding:12px 13px;font-size:14.5px;font-weight:600;line-height:1.4;position:relative;padding-right:34px}
.hcard summary::after{content:'▾';position:absolute;right:13px;top:12px;color:var(--dim)}
.hcard[open]{border-color:var(--stop)}
.hcard[open] summary::after{content:'▴'}
.hcard .hans{padding:0 13px;color:var(--exit);font-size:13.5px;font-weight:700}
.hcard .small{padding:0 13px 12px}

/* ---------- bête noire ---------- */
.hcard.nem summary{padding-left:12px}
.nembadge{display:inline-block;min-width:44px;text-align:center;font-family:var(--px);font-size:9px;padding:5px 6px;border-radius:7px;margin-right:8px;vertical-align:middle;background:#3A1113;color:#FFB3B5;border:2px solid var(--stop)}
.hcard.nem.warm .nembadge{background:#3A2A05;color:#FFDD8A;border-color:var(--zone)}
.hcard.nem.tamed .nembadge{background:#0F3A22;color:#A9E8C4;border-color:var(--exit)}
.hcard.nem.tamed{opacity:.7}
.hcard.nem.hot{border-color:var(--stopD)}
.nemmeta{font-size:11.5px;color:var(--dim);font-weight:400;margin-top:6px}

/* ---------- progression globale ---------- */
.gprog{margin:4px 0 12px}
.gprog-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:6px}
.gprog-top b{color:var(--exit);font-size:11px}

/* ---------- badges ---------- */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--lane);border:3px solid var(--edge);border-radius:12px;padding:13px 11px;text-align:center;box-shadow:0 4px 0 #00000055}
.badge .bic{font-size:30px;display:block;margin-bottom:7px;filter:drop-shadow(0 2px 0 #000)}
.badge .bnm{font-family:var(--px);font-size:8px;line-height:1.7;color:var(--retro);text-transform:uppercase}
.badge .bds{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.35}
.badge.locked{opacity:.45}
.badge.locked .bic{filter:grayscale(1) drop-shadow(0 2px 0 #000)}
.badge.new{border-color:var(--bus);animation:popOk .4s}

/* ---------- level-up overlay ---------- */
#overlay{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:#0C1118E0;padding:20px;
}
#overlay.show{display:grid}
.ov-card{background:var(--lane);border:4px solid var(--bus);border-radius:16px;padding:28px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 0 60px #FFC61A33;animation:ovIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes ovIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-card .oic{font-size:52px;display:block;margin-bottom:10px;filter:drop-shadow(0 4px 0 #000)}
.ov-card h2{font-family:var(--px);font-size:15px;color:var(--bus);margin-bottom:10px;line-height:1.8}
.ov-card p{color:var(--dim);font-size:14.5px;margin-bottom:16px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);z-index:95;background:var(--lane2);border:3px solid var(--bus);color:var(--retro);border-radius:10px;padding:10px 16px;font-size:14px;transition:transform .3s;max-width:90vw;box-shadow:0 5px 0 #0008}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast b{color:var(--bus)}

/* ---------- fx canvas ---------- */
#fx{position:fixed;inset:0;z-index:85;pointer-events:none}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--edge)}
.setrow:last-child{border-bottom:none}
.setrow label{font-size:14.5px}
.langtoggle{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.langbtn{font-family:var(--px);font-size:8px;line-height:1.3;padding:8px 9px;border:2px solid var(--edge);border-radius:8px;background:var(--lane2);color:var(--dim);white-space:nowrap}
.langbtn.on{border-color:var(--bus);color:var(--bus);box-shadow:0 0 0 1px var(--bus) inset}
/* toggle langue mis en évidence sur l'accueil */
.langrow{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 0 16px}
.langrow .langbtn{font-size:9px;padding:11px 13px;background:var(--lane);box-shadow:0 3px 0 #00000055}
.langrow .langbtn.on{background:#3A2F00;box-shadow:0 3px 0 #00000055,0 0 0 1px var(--bus) inset}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.backbtn{font-family:var(--px);font-size:10px;color:var(--dim);padding:8px 10px;border:2px solid var(--edge);border-radius:8px;background:var(--lane)}
.scrtitle{font-family:var(--px);font-size:12px;color:var(--retro);letter-spacing:1px;text-transform:uppercase}

.footnote{margin-top:22px;font-size:11.5px;color:#5F6F84;line-height:1.55;text-align:center}
.footnote a{color:var(--shield)}

@media (min-width:640px){
  body{font-size:16.5px}
  .worlds{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>

const Q=[

{w:'booze',q:"Open containers of alcohol in the passenger area of a vehicle are:",a:["Prohibited for both the driver and passengers","Allowed for passengers only","Allowed if nearly empty","Allowed if kept in the glove box"],x:"Contenant ouvert = interdit pour TOUT le monde à bord. Sa place : le coffre."},
{w:'booze',q:"A first DUI conviction (BAC 0.08–0.10%) includes:",a:["A $250–$400 fine, 12–48 hours at the IDRC, up to 30 days jail, and an ignition interlock","A written warning","A $50 fine only","Community service only"],x:"1re condamnation : 250–400 $, 12–48 h de stage IDRC, jusqu'à 30 jours de prison, éthylotest anti-démarrage."},
{w:'booze',q:"Driving under the influence of drugs — including some prescription or over-the-counter medicines:",a:["Carries penalties like drunk driving","Is legal with a valid prescription","Only applies to illegal drugs","Is a minor offense"],x:"Somnifères, antihistaminiques, cannabis, etc. = DUI aussi. Lis les notices de tes médocs."},
{w:'booze',q:"A driver under 21 caught with any detectable alcohol (0.01%+) faces:",a:["30–90 days license suspension, community service and an alcohol program","A warning letter to their parents","Adult penalties only at 0.08%","A fine with no suspension"],x:"< 21 ans : suspension 30–90 jours + 15–30 jours de travaux d'intérêt général + programme IDRC."},
{w:'booze',q:"The best way to avoid driving under the influence is to:",a:["Decide before drinking: designated driver, ride service, or stay over","Drink coffee before leaving","Eat a large meal while drinking","Take back roads home"],x:"Le plan se décide AVANT de boire : sober driver, Uber, canapé. Un plan, pas un pari."},

/* ---------------- TRIBUNAL DES POINTS (17) ---------------- */
{w:'points',q:"Your license is suspended when you accumulate ___ points.",a:["12 points","6 points","10 points","15 points"],x:"12 points = suspension. Le compteur fatal."},
{w:'points',q:"You pay an annual insurance surcharge if you get ___ points within 3 years.",a:["6 points","12 points","3 points","9 points"],x:"6 points en 3 ans = surtaxe annuelle ($150 + $25 par point au-delà de 6)."},
{w:'points',q:"One full year with no violations or suspensions removes:",a:["3 points","1 point","5 points","All points"],x:"1 an sans infraction ni suspension = −3 points."},
{w:'points',q:"Completing a defensive driving course removes:",a:["2 points (once every 5 years)","3 points every year","5 points once","No points, only a discount"],x:"Stage « defensive driving » = −2 points, une fois tous les 5 ans. (Driver Improvement Program = −3, tous les 2 ans.)"},
{w:'points',q:"Speeding 1–14 mph over the limit costs:",a:["2 points","4 points","5 points","1 point"],x:"Barème excès de vitesse : 1–14 mph → 2 pts · 15–29 → 4 pts · 30+ → 5 pts."},
{w:'points',q:"Speeding 15–29 mph over the limit costs:",a:["4 points","2 points","5 points","6 points"],x:"15–29 mph au-dessus = 4 points."},
{w:'points',q:"Speeding 30 mph or more over the limit costs:",a:["5 points","4 points","8 points","10 points"],x:"30 mph et + = 5 points. Et sans doute une convocation au tribunal."},
{w:'points',q:"Tailgating (following too closely) costs:",a:["5 points","2 points","3 points","4 points"],x:"Coller le véhicule devant = 5 points. Autant que la conduite dangereuse."},
{w:'points',q:"Reckless driving costs ___ ; careless driving costs ___.",a:["5 points ; 2 points","2 points ; 5 points","5 points ; 5 points","3 points ; 1 point"],x:"Reckless (mépris délibéré du danger) = 5 pts. Careless (négligence) = 2 pts."},
{w:'points',q:"Improper passing costs:",a:["4 points","2 points","5 points","3 points"],x:"Dépassement interdit = 4 points."},
{w:'points',q:"Passing a stopped school bus costs:",a:["5 points and a fine of at least $100","2 points","8 points","A fine only, no points"],x:"Griller un bus scolaire = 5 points + amende ≥ 100 $ (+ travaux d'intérêt général possibles)."},
{w:'points',q:"Leaving the scene of a crash where someone was injured costs:",a:["8 points, plus license suspension","2 points","5 points","4 points and a fine"],x:"Délit de fuite avec blessé = 8 points + suspension. Le sommet du barème courant."},
{w:'points',q:"Failing to stop for a pedestrian in a crosswalk costs:",a:["2 points and a $200 fine","Nothing if the pedestrian was slow","5 points","1 point and a warning"],x:"Piéton non respecté = 200 $ + 2 points (+ 15 jours de TIG possibles). Au NJ on s'ARRÊTE pour les piétons."},
{w:'points',q:"Using a handheld phone while driving — the first offense fine is:",a:["$200–$400","$50–$100","$500 flat","$1,000"],x:"Téléphone en main : 1re fois 200–400 $ · 2e 400–600 $ · 3e 600–800 $ + 3 points + 90 jours de suspension possibles."},
{w:'points',q:"A third handheld-phone offense (within 10 years) adds:",a:["3 points and a possible 90-day suspension","1 point","Nothing beyond the fine","Vehicle impoundment"],x:"3e offense : 600–800 $ + 3 POINTS + suspension possible de 90 jours. Le mains-libres existe, utilise-le."},
{w:'points',q:"Driving without insurance (first offense) brings:",a:["A $300–$1,000 fine, community service, and a 1-year license loss","A $50 fine","A written warning","Nothing unless you crash"],x:"Sans assurance : 300–1 000 $ + TIG + 1 AN de suspension. L'une des sanctions les plus lourdes du code."},
{w:'points',q:"Seat belts in NJ: the driver is responsible for buckling up all passengers:",a:["Under 18","Under 21","Only in the front seat","Only under 8"],x:"Le conducteur répond de tous les passagers < 18 ans. Ceinture = primary offense : contrôle possible rien que pour ça."},

/* ---------------- ROUTE PARTAGÉE (16) ---------------- */
{w:'share',q:"When a pedestrian is in a marked crosswalk, NJ drivers must:",a:["Stop and remain stopped while the pedestrian is in the crosswalk","Slow down and drive around them","Sound the horn and proceed","Yield only at traffic lights"],x:"Passage MARQUÉ = arrêt COMPLET tant que le piéton y est. Passage non marqué = céder le passage."},
{w:'share',q:"A person with a white cane or a guide dog:",a:["Always has the right-of-way","Has priority only in crosswalks","Must wait for traffic","Has priority only at signals"],x:"Canne blanche / chien guide = priorité ABSOLUE, partout, toujours."},
{w:'share',q:"Two vehicles reach a four-way stop at the same time. Who goes first?",a:["The driver on the right","The driver on the left","The larger vehicle","Whoever moves first"],x:"Arrivée simultanée = priorité à DROITE."},
{w:'share',q:"When turning left, you must yield to:",a:["Oncoming traffic and pedestrians","No one, if you signaled","Only trucks and buses","Vehicles behind you"],x:"Tourner à gauche = céder au trafic d'en face ET aux piétons. Le clignotant ne donne aucun droit."},
{w:'share',q:"When entering a road from a driveway or private road, you must:",a:["Yield to all traffic and pedestrians","Proceed — road traffic must let you in","Yield only to traffic from the left","Enter as quickly as possible"],x:"Sortie de parking ou d'allée = tu cèdes à TOUT LE MONDE, trottoir compris."},
{w:'share',q:"When an emergency vehicle approaches with lights and siren, you must:",a:["Pull to the right edge of the road and stop","Speed up to clear the area","Stop immediately, even in the intersection","Slow down slightly and continue"],x:"À DROITE et STOP. Jamais s'arrêter au milieu d'une intersection — traverse-la d'abord, puis range-toi."},
{w:'share',q:"In NJ, when a bus signals to re-enter traffic from a stop, you must:",a:["Yield to the bus","Accelerate to pass it first","Sound your horn","Flash your lights and continue"],x:"Bus qui met son clignotant pour repartir = on le laisse sortir. C'est la loi au New Jersey."},
{w:'share',q:"When entering a roundabout, you must:",a:["Yield to traffic already in the circle","Enter — circle traffic yields to you","Always stop completely first","Enter from the left lane only"],x:"Rond-point : priorité à ceux qui Y SONT déjà. Circulation en sens anti-horaire."},
{w:'share',q:"A motorcycle is entitled to:",a:["The full width of a traffic lane","Half of a lane","The shoulder only","No specific lane rights"],x:"Une moto = une voie ENTIÈRE. On ne partage jamais sa voie avec elle."},
{w:'share',q:"If you cannot see a truck driver in the truck's side mirror:",a:["The driver cannot see you","The driver can still see you in the rearview","You are safe as long as you are behind","You should flash your lights"],x:"Pas de rétro visible = tu es dans le No-Zone (angles morts avant, côtés, arrière). Sors-en vite."},
{w:'share',q:"Trucks making a right turn often:",a:["Swing wide to the left first — never squeeze in on their right","Hug the curb tightly","Yield to cars on their right","Use the shoulder"],x:"Un camion qui tourne à droite déborde d'abord à gauche. Ne JAMAIS s'insérer à sa droite à ce moment-là."},
{w:'share',q:"Before turning right, you should check for:",a:["Cyclists coming up on your right side","Traffic in the left lane only","Your mirrors only","Nothing, if you signaled early"],x:"Le « right hook » est l'accident vélo classique : contrôle ton angle mort DROIT avant de tourner."},
{w:'share',q:"An orange triangle on the back of a vehicle means it:",a:["Moves slowly — 25 mph or less","Carries a wide load","Is a student driver","Carries hazardous materials"],x:"Triangle orange = véhicule lent (≤ 25 mph) : tracteurs, engins agricoles. Patience et dépassement propre."},
{w:'share',q:"When approaching a horse and rider, you should:",a:["Slow down, give plenty of room, and avoid honking","Sound your horn to warn them","Pass quickly and closely","Rev your engine so they hear you"],x:"Cheval = animal imprévisible : on ralentit, on s'écarte large, PAS de klaxon."},
{w:'share',q:"When turning left onto a road with multiple lanes, enter:",a:["The nearest lane going in your direction","Any available lane","The far right lane directly","The shoulder, then merge"],x:"On tourne dans la voie LA PLUS PROCHE de son sens, et on change de voie ensuite si besoin."},
{w:'share',q:"If a deer suddenly appears in front of your car, you should:",a:["Brake firmly but do not swerve","Swerve into the opposite lane","Speed up to pass before impact","Close your eyes and honk"],x:"Freine FORT, ne braque pas : le coup de volant (arbre, trafic d'en face) tue plus que l'animal."},

/* ---------------- ZONE DE SURVIE (16) ---------------- */
{w:'surv',q:"If the rear of your car starts to skid, you should:",a:["Ease off the gas and steer in the direction you want to go","Brake hard immediately","Steer opposite to the skid","Accelerate out of it"],x:"Dérapage : pied levé, pas de gros freinage, on braque DANS le sens du dérapage (là où on veut aller)."},
{w:'surv',q:"If your brakes fail, you should:",a:["Pump the brake pedal, downshift, and apply the parking brake gently","Turn off the engine right away","Jump out if possible","Swerve between lanes to slow down"],x:"Freins morts : pomper la pédale, rétrograder, frein à main PROGRESSIF. Moteur coupé = direction assistée morte."},
{w:'surv',q:"If a tire blows out, you should:",a:["Grip the wheel firmly, ease off the gas, and brake gently once under control","Brake as hard as possible","Steer sharply to the shoulder","Accelerate to stabilize the car"],x:"Éclatement : volant tenu FERME, décélération douce, freinage léger une fois la voiture stable."},
{w:'surv',q:"Your car stalls on railroad tracks and a train is approaching. You should:",a:["Get everyone out and run toward the train, angled away from the tracks","Keep trying to restart until the last moment","Push the car off the tracks","Stay inside and brace"],x:"On COURT VERS le train (en biais, loin des rails) : les débris volent dans l'autre sens. Contre-intuitif = adoré à l'exam."},
{w:'surv',q:"If your wheels drift off the pavement onto the shoulder, you should:",a:["Slow down, then ease back onto the road","Steer back onto the road immediately","Brake hard and stop on the spot","Accelerate to regain the pavement"],x:"Roues dans l'accotement : on RALENTIT d'abord, puis on revient en douceur. Le coup de volant = tonneau."},
{w:'surv',q:"If your car starts to hydroplane, you should:",a:["Ease off the gas and avoid hard braking","Brake hard right away","Accelerate through the water","Turn the wheel quickly side to side"],x:"Aquaplaning : pied levé, volant droit, pas de freinage brutal — on attend que les pneus remordent."},
{w:'surv',q:"Which road surfaces freeze FIRST?",a:["Bridges and overpasses","Sunny stretches","City streets","Gravel roads"],x:"Les PONTS gèlent en premier : le froid passe dessus ET dessous."},
{w:'surv',q:"Blinded by oncoming high beams at night? Look:",a:["Toward the right edge of the road","Directly at the headlights","At your dashboard","At the center line"],x:"On se guide sur le bord DROIT de la chaussée. Jamais fixer les phares d'en face."},
{w:'surv',q:"Highway hypnosis is best prevented by:",a:["Keeping your eyes moving and scanning the scene","Staring at the center line","Driving faster to stay alert","Turning up the heat"],x:"La transe d'autoroute se combat en bougeant les yeux : rétros, panneaux, miroirs — et des pauses."},
{w:'surv',q:"The only real cure for drowsiness while driving is:",a:["Stopping to sleep","Strong coffee","Opening the windows","Loud music"],x:"Fatigue = DORMIR. Le reste ne fait que retarder le micro-sommeil de quelques minutes."},
{w:'surv',q:"If you miss your exit on a highway, you should:",a:["Continue to the next exit — never back up","Reverse carefully along the shoulder","Make a U-turn through the median","Stop and wait for a gap"],x:"JAMAIS de marche arrière ni de demi-tour sur highway. Sortie suivante, point final."},
{w:'surv',q:"If your vehicle breaks down on a highway, you should:",a:["Pull off the road, turn on hazard flashers, and raise the hood","Stop in your lane with flashers on","Stand behind the car to warn traffic","Walk along the traffic lanes for help"],x:"Hors de la chaussée, warnings, capot levé = signal de détresse universel. Et on reste LOIN du trafic."},
{w:'surv',q:"Carbon monoxide is dangerous because it is:",a:["Colorless and odorless","Thick and visible","Only found outdoors","Smelly enough to detect quickly"],x:"Le CO ne se voit pas et ne se sent pas. Jamais de moteur allumé dans un garage fermé ; échappement dégagé (neige !)."},
{w:'surv',q:"You must report a crash to the police when:",a:["Someone is injured or killed, or damage exceeds $500","Only if someone is killed","Damage exceeds $5,000","Both drivers agree to report it"],x:"Blessé, mort OU dégâts > 500 $ = rapport obligatoire. En pratique : on appelle toujours."},
{w:'surv',q:"Before driving in winter, you must:",a:["Clear ALL ice and snow from the vehicle, including the roof","Clear just the windshield","Let the wind clear it while driving","Clear only the mirrors and lights"],x:"La glace qui s'envole du toit = amendes (et jusqu'à 1 000+ $ si elle cause des dégâts). On déneige TOUT."},
{w:'surv',q:"In city driving, you should scan the road about ___ ahead.",a:["12 seconds — about one city block","3 seconds","30 seconds","One car length"],x:"Regarde ~12 secondes devant toi : ≈ 1 pâté de maisons en ville, ≈ ¼ de mile sur highway."},

/* ---------------- LABYRINTHE GDL (17) ---------------- */
{w:'gdl',q:"The NJ knowledge test has ___ questions and requires ___ to pass.",a:["50 questions — 80% (40 correct)","25 questions — 70%","100 questions — 90%","50 questions — 50%"],x:"50 questions, 80% = 40 bonnes réponses. Tu as droit à 10 erreurs — la marge existe, construis-la ici."},
{w:'gdl',q:"The minimum vision requirement for a NJ license is:",a:["20/50, with or without corrective lenses","20/20 without glasses","20/100","There is no vision requirement"],x:"Vision 20/50 minimum (lunettes/lentilles OK → mention « corrective lenses » sur le permis)."},
{w:'gdl',q:"A GDL supervising driver must be:",a:["At least 21 years old with 3+ years of driving experience","Any licensed adult","At least 25 with 1 year of experience","A professional instructor only"],x:"Accompagnateur : 21 ans minimum ET 3 ans de permis, assis à l'AVANT."},
{w:'gdl',q:"With an examination permit, a driver aged 21+ must practice supervised driving for at least:",a:["3 months","20 days","6 months","1 year"],x:"21 ans et + : 3 MOIS de pratique supervisée avant l'épreuve route (règle actuelle du MVC — les vieux supports disent encore « 20 jours », piège !).",xe:"21 and over: 3 MONTHS of supervised practice before the road test (current MVC rule — older materials still say '20 days', trap!)"},
{w:'gdl',q:"With an examination permit, a driver under 21 must practice for at least:",a:["6 months","3 months","20 days","1 month"],x:"< 21 ans : 6 mois de pratique + depuis février 2025, 50 h de conduite loggées dont 10 de nuit.",xe:"Under 21: 6 months of practice + since February 2025, 50 logged driving hours including 10 at night."},
{w:'gdl',q:"GDL permit and probationary drivers under 21 may NOT drive between:",a:["11:01 p.m. and 5:00 a.m.","Midnight and 6:00 a.m.","10:00 p.m. and 7:00 a.m.","9:00 p.m. and 6:00 a.m."],x:"Couvre-feu GDL : 23 h 01 → 5 h 00. Exceptions travail/religion avec justificatif."},
{w:'gdl',q:"Besides dependents, a GDL driver may carry:",a:["Only 1 additional passenger, unless a parent or guardian is in the car","Up to 3 friends","Anyone during daylight","No passengers at all"],x:"Parent/tuteur + personnes à charge + 1 SEUL passager additionnel."},
{w:'gdl',q:"GDL holders under 21 must display on their vehicle:",a:["Red decals on both license plates","A sticker on the windshield","An orange flag","Nothing special"],x:"Les décalcomanies rouges (4 $ la paire) sur les DEUX plaques. Obligatoires pour les GDL de moins de 21 ans."},
{w:'gdl',q:"For GDL drivers, cell phones and electronic devices are:",a:["Completely banned — even hands-free","Allowed if hands-free","Allowed when stopped at lights","Allowed for navigation only"],x:"GDL = ZÉRO électronique, même en mains-libres. (Conducteurs classiques : mains-libres uniquement.)"},
{w:'gdl',q:"The probationary license phase (unsupervised, with restrictions) lasts:",a:["1 year","6 months","2 years","90 days"],x:"1 an de « probationary license » avant le permis de base (basic)."},
{w:'gdl',q:"After moving, you must notify the MVC of your address change within:",a:["1 week","1 month","60 days","6 months"],x:"Adresse : 1 SEMAINE. Oui, une semaine. Absurde et pourtant au programme."},
{w:'gdl',q:"You must report a legal name change to the MVC within:",a:["2 weeks","1 week","90 days","6 months"],x:"Changement de nom = 2 semaines. (Adresse 1 semaine, nom 2 semaines — dans cet ordre.)"},
{w:'gdl',q:"New NJ residents must transfer their out-of-state license within:",a:["60 days, or before it expires — whichever comes first","30 days","6 months","1 year"],x:"Nouveau résident : 60 jours pour transférer permis et immatriculation."},
{w:'gdl',q:"A child under age 2 and under 30 pounds must ride in:",a:["A rear-facing seat with a 5-point harness, in the back seat","Any child seat, front or back","A booster seat","A regular seat belt"],x:"< 2 ans ET < 30 lb = dos à la route, harnais 5 points, à l'ARRIÈRE."},
{w:'gdl',q:"A child under age 8 and under 57 inches tall must use:",a:["A booster or child seat in the back seat","Just a seat belt","The front seat with an airbag","No restraint after age 5"],x:"< 8 ans et < 1,45 m (57 in) = booster à l'arrière. Et < 13 ans : banquette arrière recommandée."},
{w:'gdl',q:"Studded snow tires are legal in New Jersey only between:",a:["November 15 and April 1","December 1 and March 1","October 1 and May 1","They are never legal"],x:"Pneus cloutés : 15 novembre → 1er avril. La question calendrier qui surprend tout le monde."},
{w:'gdl',q:"In New Jersey, driving is legally considered:",a:["A privilege that can be taken away — not a right","A constitutional right","A right after age 21","A right once insured"],x:"« Driving is a privilege, not a right » — LA phrase culte du manuel. Elle tombe régulièrement."},

/* ================ NIVEAU EXPERT — d'après le NJ Driver Manual ================ */
/* --- panneaux & signalisation avancée --- */
{w:'signs',q:"A traffic light is completely dark (power failure). You should treat the intersection as:",a:["An all-way stop — stop, then yield as at a stop sign","A yield intersection","A normal green — proceed with caution","Blocked — turn around"],x:"Feu ÉTEINT = STOP pour tout le monde : arrêt complet, puis priorité comme à un all-way stop.",xe:"A DARK signal = a stop sign for everyone: full stop, then proceed by right-of-way rules."},
{w:'signs',q:"A police officer directs you to proceed, but the traffic light is red. You must:",a:["Follow the officer's direction — it overrides the signal","Wait for the green light","Stop halfway and check","Follow the light — it's the law"],x:"L'agent PRIME sur les feux et panneaux. S'il te fait signe de passer au rouge, tu passes.",xe:"An officer OVERRIDES lights and signs. If they wave you through a red, you go."},
{w:'signs',q:"Two solid yellow lines in the center of the road mean:",a:["No passing in either direction","Passing allowed with care","Passing allowed only for the right lane","One-way traffic ahead"],x:"Double ligne jaune CONTINUE = interdiction de doubler dans les DEUX sens. On peut la franchir uniquement pour tourner (entrée, allée).",xe:"Double SOLID yellow = no passing in EITHER direction. You may only cross it to turn into a driveway."},
{w:'signs',q:"A broken (dashed) yellow center line means:",a:["Either direction may pass when it's safe","No passing at any time","Only trucks may pass","The road becomes one-way"],x:"Ligne jaune DISCONTINUE = dépassement autorisé des deux côtés, quand c'est sûr.",xe:"BROKEN yellow line = passing allowed for both directions, when safe."},
{w:'signs',q:"The center lane marked with two-way left-turn arrows is used for:",a:["Left turns only, by traffic from BOTH directions","Passing slower vehicles","Through travel at rush hour","Parking deliveries"],x:"Voie centrale de tourne-à-gauche : uniquement pour tourner à gauche, dans les deux sens. Jamais pour rouler ni doubler. On y entre juste avant de tourner.",xe:"Center two-way left-turn lane: left turns only, both directions. Never for travel or passing. Enter just before your turn."},
{w:'signs',q:"A lane marked with a white diamond symbol means:",a:["Reserved lane (HOV/bus) during posted hours","Hazardous cargo route","Diamond-shaped intersection ahead","Emergency stopping lane"],x:"Losange blanc peint = voie RÉSERVÉE (covoiturage HOV, bus) aux heures affichées. Vérifie le panneau : nombre d'occupants minimum.",xe:"Painted white diamond = RESERVED lane (HOV/bus) during posted hours. Check the sign for minimum occupancy."},
{w:'signs',q:"In New Jersey, turning LEFT at a red light is:",a:["Never permitted","Allowed from a one-way onto a one-way","Allowed after a full stop","Allowed outside rush hours"],x:"Piège : certains États autorisent le gauche-au-rouge de sens-unique à sens-unique. PAS le New Jersey. Au NJ : droite au rouge seulement (sauf panneau).",xe:"Trap: some states allow left-on-red one-way to one-way. NOT New Jersey. In NJ: right on red only (unless posted)."},
{w:'signs',q:"When stopping at an intersection with a stop line and crosswalk, you must stop:",a:["Before the stop line, then edge forward if needed to see","With your bumper over the line for visibility","Inside the crosswalk","Next to the signal pole"],x:"On s'arrête AVANT la ligne blanche (ou le crosswalk). Ensuite seulement, on avance doucement pour voir le trafic.",xe:"Stop BEFORE the white line (or crosswalk). Only then creep forward to see traffic."},

/* --- vitesse & physique --- */
{w:'speed',q:"Roads are MOST slippery:",a:["During the first few minutes of rain","After hours of heavy rain","Right after the rain stops","Only below freezing"],x:"Les premières minutes de pluie remontent l'huile et la gomme : film ultra-glissant avant d'être rincé. Question renard classique.",xe:"The first minutes of rain float the oil and rubber up: an ultra-slick film before it rinses away. Classic fox question."},
{w:'speed',q:"When passing another vehicle, exceeding the speed limit is:",a:["Illegal — the limit applies even while passing","Allowed by up to 10 mph","Allowed on rural roads","Allowed if the other driver speeds up"],x:"Doubler n'autorise JAMAIS à dépasser la limite. Si tu dois excéder la vitesse pour doubler, tu ne doubles pas.",xe:"Passing NEVER authorizes exceeding the limit. If you'd have to speed to pass, don't pass."},
{w:'speed',q:"On a multilane highway, slower traffic should:",a:["Keep right — the left lane is for passing","Use the center lane only","Keep left with hazards on","Match the fastest lane"],x:"Au NJ : on roule à DROITE, on double à gauche. Traîner à gauche = infraction (failure to keep right, 2 pts).",xe:"In NJ: travel RIGHT, pass left. Camping in the left lane = failure to keep right (2 pts)."},
{w:'speed',q:"A 'Safe Corridor' in New Jersey is:",a:["A highway stretch with high crash rates where fines are doubled","A school-zone pedestrian path","A truck-only corridor","An HOV express section"],x:"Safe Corridor = tronçon de highway à forte accidentalité : amendes DOUBLÉES pour les infractions. Comme les zones de travaux.",xe:"Safe Corridor = a high-crash highway stretch: fines DOUBLED for violations. Same as work zones."},
{w:'speed',q:"Cruise control should NEVER be used:",a:["On wet, icy, or slippery roads","On long straight highways","During daylight","Above 50 mph"],x:"Régulateur sur sol glissant = aquaplaning et perte de contrôle assurés. Sec et dégagé uniquement.",xe:"Cruise control on slick roads = hydroplaning and loss of control. Dry, clear roads only."},
{w:'speed',q:"The proper way to take a curve is to:",a:["Slow down BEFORE the curve, then accelerate gently through it","Brake hard mid-curve","Coast in neutral","Accelerate into it, brake out of it"],x:"On freine AVANT le virage, on réaccélère doucement dedans/en sortie. Freiner en plein virage = transfert de masse = dérapage.",xe:"Brake BEFORE the curve, gently accelerate through/out. Braking mid-curve shifts weight = skid."},
{w:'speed',q:"If you double your speed from 20 to 40 mph, your braking distance becomes about:",a:["4 times longer","2 times longer","3 times longer","The same with good brakes"],x:"Vitesse ×2 = distance de freinage ×4 (énergie au carré). À ×3, c'est ×9. La physique ne négocie pas.",xe:"Speed ×2 = braking distance ×4 (energy is squared). At ×3 it's ×9. Physics doesn't negotiate."},
{w:'speed',q:"When leaving a highway using a deceleration lane, you should:",a:["Keep highway speed until you're IN the lane, then slow down","Slow down on the highway first","Stop at the lane entrance","Cut across at the last moment"],x:"On ne ralentit PAS sur la voie rapide : on entre dans la voie de décélération, PUIS on freine.",xe:"Don't slow on the highway itself: enter the deceleration lane, THEN brake."},

/* --- distances expertes --- */
{w:'dist',q:"When an emergency vehicle responding to a call passes you, you may not follow it closer than:",a:["300 feet","100 feet","500 feet","50 feet"],x:"Interdit de COLLER un véhicule d'urgence en intervention : 300 ft minimum derrière lui.",xe:"You may not TAIL a responding emergency vehicle: stay at least 300 ft behind."},
{w:'dist',q:"You may not park or drive within ___ of where fire apparatus has stopped to answer an alarm.",a:["200 feet","100 feet","300 feet","75 feet"],x:"Camion de pompiers en intervention = bulle de 200 ft : ni s'approcher, ni stationner.",xe:"Fire apparatus at a fire = a 200-ft bubble: don't approach or park within it."},
{w:'dist',q:"With an average reaction time of ¾ second, a car at 60 mph travels about ___ before you even touch the brake.",a:["66 feet","20 feet","150 feet","10 feet"],x:"60 mph = 88 ft par seconde. ¾ s de réaction = 66 ft parcourus AVANT le début du freinage. Ajoute ensuite la distance de freinage…",xe:"60 mph = 88 ft per second. A ¾-second reaction = 66 ft traveled BEFORE braking even starts. Then add braking distance…"},
{w:'dist',q:"In fog, heavy rain, or snow, you should drive with:",a:["Low beams — high beams reflect back into your eyes","High beams for maximum range","Parking lights only","Hazard flashers while moving"],x:"Brouillard/neige : CODES. Les pleins phares se réfléchissent sur les particules et t'éblouissent toi-même.",xe:"Fog/snow: LOW beams. High beams bounce off the particles and blind YOU."},
{w:'dist',q:"Parking UPHILL next to a curb, turn your front wheels:",a:["Away from the curb, and set the parking brake","Toward the curb","Straight, brake on","Any direction with the brake set"],x:"Montée avec trottoir : roues vers la RUE (le trottoir bloque la roue si ça recule). Frein à main toujours.",xe:"Uphill with a curb: wheels toward the STREET (the curb catches the wheel if it rolls back). Parking brake always."},
{w:'dist',q:"Parking DOWNHILL, or on any hill with NO curb, turn your front wheels:",a:["Toward the curb or road edge","Away from the road edge","Straight ahead","Toward the center line"],x:"Descente : vers le trottoir. Pas de trottoir (montée OU descente) : vers le BORD de la route. La voiture doit fuir la circulation.",xe:"Downhill: toward the curb. No curb (up OR down): toward the road EDGE. The car must roll away from traffic."},
{w:'dist',q:"A load sticking out 4 feet or more beyond the rear of your vehicle must be marked with:",a:["A red flag by day, a red light at night","A white cloth","Reflective tape only","Nothing under 6 feet"],x:"Chargement dépassant de 4 ft et + : drapeau ROUGE le jour, feu ROUGE la nuit.",xe:"Load extending 4 ft or more: RED flag by day, RED light at night."},
{w:'dist',q:"Which of these parking spots is LEGAL?",a:["35 feet from a fire hydrant","On the sidewalk, half on the street","20 feet from a crosswalk at an intersection","40 feet from a stop sign"],x:"Fais le calcul : hydrant = 10 ft (35 ✔), crosswalk = 25 ft (20 ✘), stop = 50 ft (40 ✘), trottoir = jamais. L'examen adore ce piège arithmétique.",xe:"Do the math: hydrant = 10 ft (35 ✔), crosswalk = 25 ft (20 ✘), stop sign = 50 ft (40 ✘), sidewalk = never. The exam loves this arithmetic trap."},

/* --- alcool expert --- */
{w:'booze',q:"A SECOND DUI conviction includes:",a:["$500–$1,000 fine, 48 hours–90 days jail, 1–2 year suspension, interlock 2–4 years","A warning and a $200 fine","Only 30 days of community service","The same penalties as the first"],x:"2e DUI : 500–1 000 $, 48 h à 90 jours de prison, suspension 1–2 ANS, interlock 2–4 ans, 30 jours de TIG. Ça devient très sérieux.",xe:"2nd DUI: $500–$1,000, 48 hrs–90 days jail, 1–2 YEAR suspension, interlock 2–4 years, 30 days community service. It gets very serious."},
{w:'booze',q:"A THIRD DUI conviction brings:",a:["A $1,000 fine, up to 180 days in jail, and license loss for many years","A $500 fine only","House arrest for a week","Loss of license for 90 days"],x:"3e DUI : 1 000 $, jusqu'à 180 jours de prison, permis perdu pour des ANNÉES (8–10 ans) + interlock + surtaxes 1 500 $/an.",xe:"3rd DUI: $1,000, up to 180 days in jail, license gone for YEARS (8–10) + interlock + $1,500/yr surcharges."},
{w:'booze',q:"An open alcohol container in the passenger area — first offense — costs:",a:["$200 (second offense: $250 + 10 days community service)","$50","$500 + 2 points","Nothing if unopened bottles"],x:"Open container : 200 $ la 1re fois, 250 $ + 10 jours de TIG la 2e. Sa place reste le coffre.",xe:"Open container: $200 first time, $250 + 10 days community service the 2nd. It belongs in the trunk."},
{w:'booze',q:"Can you be convicted of DWI with a BAC BELOW 0.08%?",a:["Yes — if your driving shows you are impaired","No, 0.08% is an absolute floor","Only for CDL holders","Only in school zones"],x:"0.08 % n'est pas un bouclier : conduite visiblement altérée = condamnation possible EN DESSOUS. Le juge regarde le comportement, pas que le chiffre.",xe:"0.08% is not a shield: visibly impaired driving = possible conviction BELOW it. The court looks at behavior, not just the number."},
{w:'booze',q:"If you refuse the breath test, you will:",a:["Face separate refusal penalties — and can still be convicted of DWI on the officer's observations","Automatically avoid a DWI conviction","Get a reduced fine","Only lose 30 days of driving"],x:"Refuser = double peine : sanctions de refus (amendes, interlock) ET condamnation DWI toujours possible sur témoignage de l'agent. Le refus ne sauve personne.",xe:"Refusing = double penalty: refusal sanctions (fines, interlock) AND a DWI conviction still possible on the officer's observations. Refusal saves no one."},
{w:'booze',q:"Which factors actually affect your BAC?",a:["Body weight and how much you drink over how much time","Coffee, cold showers, and willpower","Only the type of alcohol","Your driving experience"],x:"BAC = poids, quantité, durée (et sexe). Café, douche, sport : zéro effet. Seul le temps élimine.",xe:"BAC = weight, amount, time (and sex). Coffee, showers, exercise: zero effect. Only time eliminates."},
{w:'booze',q:"Combining alcohol with another drug (even an over-the-counter antihistamine):",a:["Multiplies the impairment of both","Cancels the alcohol out","Is safe with a prescription","Only matters above 0.08%"],x:"Alcool + médicament = effets MULTIPLIÉS, pas additionnés. Antihistaminiques, somnifères, cannabis : cocktails redoutables au volant.",xe:"Alcohol + a drug = effects MULTIPLIED, not added. Antihistamines, sleep aids, cannabis: brutal cocktails behind the wheel."},
{w:'booze',q:"Driving drunk with a minor as a passenger brings:",a:["Additional charges: extra license loss and community service","No change to penalties","A fine paid to the minor's family","Double points only"],x:"DUI avec mineur à bord = infraction SUPPLÉMENTAIRE (disorderly persons) : suspension rallongée + TIG en plus.",xe:"DUI with a minor aboard = an ADDITIONAL offense (disorderly persons): extended suspension + extra community service."},

/* --- points expert --- */
{w:'points',q:"A moving violation committed in ANOTHER STATE adds to your NJ record:",a:["2 points, whatever the violation","The other state's points","Nothing","4 points minimum"],x:"Infraction hors NJ = forfait 2 points au NJ, peu importe la gravité là-bas. Ton dossier te suit partout.",xe:"Any out-of-state moving violation = a flat 2 points in NJ, whatever it was worth there. Your record follows you."},
{w:'points',q:"Leaving the scene of a crash with PROPERTY DAMAGE ONLY (no injury) costs:",a:["2 points","8 points","5 points","No points, only a fine"],x:"Délit de fuite : 2 pts si dégâts matériels seulement, 8 pts si blessé. Retiens la paire 2/8.",xe:"Leaving the scene: 2 pts if property damage only, 8 pts with injury. Remember the 2/8 pair."},
{w:'points',q:"An improper turn (or improper U-turn) costs:",a:["3 points","2 points","4 points","5 points"],x:"Virage irrégulier / demi-tour interdit = 3 points. Entre les 2 et les 4, facile à confondre — c'est 3.",xe:"Improper turn / improper U-turn = 3 points. Easy to mix with the 2s and 4s — it's 3."},
{w:'points',q:"Driving the wrong way on a one-way street costs:",a:["2 points","5 points","4 points","8 points"],x:"Sens interdit sur one-way = 2 points (et une belle frayeur).",xe:"Wrong way on a one-way = 2 points (and a good scare)."},
{w:'points',q:"Racing on a highway costs:",a:["5 points","2 points","3 points","10 points"],x:"Course sur route = 5 points, le sommet du barème avec reckless, tailgating et bus scolaire.",xe:"Highway racing = 5 points, the top of the scale with reckless, tailgating, and the school bus."},
{w:'points',q:"Failure to yield to an emergency vehicle costs:",a:["2 points","5 points","4 points","No points, only a fine"],x:"Ne pas céder à un véhicule d'urgence = 2 points (+ amende). Et le Move Over Law s'ajoute s'il est à l'arrêt.",xe:"Failing to yield to an emergency vehicle = 2 points (+ fine). The Move Over Law applies separately when it's stopped."},
{w:'points',q:"Passing on the right by driving OFF the roadway (shoulder) costs:",a:["4 points","2 points","3 points","6 points"],x:"Doubler par la droite en mordant l'accotement = 4 points. Le shoulder n'est pas une voie.",xe:"Passing on the right off the roadway (shoulder) = 4 points. The shoulder is not a lane."},
{w:'points',q:"The insurance surcharge for reaching 6 points within 3 years is:",a:["$150 a year, plus $25 for each point above 6","A flat $500 once","$50 per point, once","Nothing if you take a course"],x:"Surtaxe : 150 $/an (3 ans) + 25 $ par point au-delà de 6. À 9 points : 150 + 75 = 225 $/an. Fais le calcul à l'exam.",xe:"Surcharge: $150/yr (3 yrs) + $25 per point above 6. At 9 points: 150 + 75 = $225/yr. Do the math on the exam."},

/* --- route partagée expert --- */
{w:'share',q:"Approaching a stopped emergency or tow vehicle with flashing lights (Move Over Law), you must:",a:["Change to a non-adjacent lane if safe, or slow below the posted limit","Stop behind it","Sound your horn and continue","Speed up to clear the area"],x:"Move Over Law : change de voie pour laisser une voie vide, sinon RALENTIS sous la limite. Amende 100–500 $.",xe:"Move Over Law: change lanes to leave an empty lane, otherwise SLOW below the limit. $100–500 fine."},
{w:'share',q:"The rear blind spot ('No-Zone') of a large truck can extend back:",a:["Up to 200 feet","About 20 feet","About 50 feet","Trucks have no rear blind spot"],x:"Derrière un camion, l'angle mort peut atteindre 200 ft. Si tu ne vois pas ses rétros, il ne te voit pas.",xe:"A truck's rear blind spot can reach 200 ft. If you can't see its mirrors, it can't see you."},
{w:'share',q:"Driving over an unprotected fire hose at a fire scene is:",a:["Illegal, unless the fire department tells you to","Allowed at low speed","Allowed for small hoses","Required to clear the area"],x:"On ne roule JAMAIS sur un tuyau d'incendie non protégé (sauf ordre des pompiers). Question surprise du manuel.",xe:"NEVER drive over an unprotected fire hose (unless the fire department directs you). Surprise question from the manual."},
{w:'share',q:"At an intersection WITHOUT painted lines, pedestrians crossing:",a:["Are still in a crosswalk — you must yield to them","Have no crossing rights","Must wait for all cars","Can only cross at signals"],x:"Crosswalk NON marqué (prolongement des trottoirs) = crosswalk quand même : céder le passage. Marqué = arrêt complet tant qu'il y est.",xe:"An UNMARKED crosswalk (the sidewalk's extension) is still a crosswalk: yield. Marked = stop and stay stopped while occupied."},
{w:'share',q:"Before opening your door on the traffic side, you should:",a:["Check mirrors and look over your shoulder for cyclists and cars","Open it quickly to claim space","Turn on hazards first","Honk twice"],x:"Le « dooring » envoie des cyclistes à l'hôpital. Rétro + coup d'œil épaule AVANT d'ouvrir. (Astuce : ouvrir avec la main opposée force la rotation.)",xe:"'Dooring' puts cyclists in the hospital. Mirror + shoulder check BEFORE opening. (Tip: the far-hand 'Dutch reach' forces you to turn.)"},
{w:'share',q:"The most common car–motorcycle crash happens when:",a:["A car turns left in front of an oncoming motorcycle","A motorcycle rear-ends a car","Motorcycles run red lights","Cars change lanes on highways"],x:"Le classique mortel : la voiture tourne à gauche devant la moto qui arrive (vitesse/distance mal jugées — une moto paraît plus loin qu'elle ne l'est).",xe:"The deadly classic: a car turns left across an oncoming bike (speed/distance misjudged — a motorcycle looks farther than it is)."},
{w:'share',q:"At a T-intersection, the driver on the road that DEAD-ENDS must:",a:["Yield to all traffic on the through road","Take priority from the right","Enter — through traffic yields","Stop only if a sign says so"],x:"À un T : celui qui arrive de la branche qui se termine cède à TOUT le trafic de la route traversière.",xe:"At a T: the driver on the terminating road yields to ALL traffic on the through road."},
{w:'share',q:"When a school crossing guard holds up a stop signal, you must:",a:["Stop and stay stopped until the guard signals you through","Pass slowly at 10 mph","Yield only to children","Wait 3 seconds then go"],x:"Le crossing guard a autorité : arrêt COMPLET et on ne repart que sur SON signal, même si le passage semble vide.",xe:"The crossing guard has authority: FULL stop, and you go only on THEIR signal, even if the crossing looks clear."},

/* --- survie expert --- */
{w:'surv',q:"Your accelerator sticks while driving. You should:",a:["Shift to neutral, brake, and steer off the road — never turn the key to LOCK","Turn off the ignition immediately","Pump the gas pedal hard","Pull the parking brake at speed"],x:"Accélérateur coincé : point mort (neutral), freine, sors de la route. Couper la clé sur LOCK = volant verrouillé = crash.",xe:"Stuck accelerator: shift to NEUTRAL, brake, steer off. Turning the key to LOCK freezes the steering = crash."},
{w:'surv',q:"With ABS brakes in an emergency stop, you should:",a:["Press hard and HOLD — never pump ABS","Pump rapidly","Brake and release every second","Use the parking brake instead"],x:"ABS : on ÉCRASE et on TIENT (les vibrations sont normales). Pomper, c'est pour les vieux freins classiques sur sol glissant.",xe:"ABS: STOMP and HOLD (the pulsing is normal). Pumping is for old conventional brakes on slick roads."},
{w:'surv',q:"Your headlights suddenly fail at night. You should:",a:["Try the switch/dimmer, use parking and hazard lights, and pull off the road","Speed to the next exit","Follow another car's lights closely","Stop in your lane immediately"],x:"Phares morts : essaie l'interrupteur et l'inverseur codes/pleins phares, allume veilleuses + warnings, et sors de la chaussée.",xe:"Dead headlights: try the switch and dimmer, turn on parking + hazard lights, and get off the roadway."},
{w:'surv',q:"If your hood flies up while driving:",a:["Look through the gap under the hood or out the side window, brake smoothly, pull off","Brake as hard as possible","Open your door to see ahead","Accelerate so it closes"],x:"Capot levé : regarde par la fente sous le capot ou par la vitre latérale, freine progressivement, range-toi.",xe:"Hood up: look through the gap under the hood or out the side window, brake smoothly, pull over."},
{w:'surv',q:"After driving through deep water, you should:",a:["Dry your brakes by pressing them lightly while driving slowly","Speed up to blow the water off","Stop and wait 10 minutes","Pull the parking brake"],x:"Freins mouillés = freins morts. On roule doucement en freinant LÉGÈREMENT pour les sécher. Et jamais d'eau à profondeur inconnue.",xe:"Wet brakes = no brakes. Drive slowly while braking LIGHTLY to dry them. And never cross water of unknown depth."},
{w:'surv',q:"You brake on ice and the wheels lock (no ABS). To regain steering:",a:["Ease off the brakes so the wheels roll again","Brake harder","Pull the parking brake","Shift to reverse"],x:"Roues bloquées = plus de direction. On RELÂCHE le frein pour que les roues tournent et que le volant réponde à nouveau.",xe:"Locked wheels = no steering. RELEASE the brakes so the wheels roll and the steering answers again."},
{w:'surv',q:"Driving with snow/ice left on your car costs $25–$75. If it flies off and injures someone or damages property:",a:["$200–$1,000 per offense","The same $25–$75","Only civil liability","A warning first time"],x:"Toit non déneigé : 25–75 $. Si la plaque s'envole et blesse/casse : 200–1 000 $ par infraction. Déneige TOUT, y compris le toit.",xe:"Uncleared roof: $25–75. If the slab flies off and hurts/damages: $200–1,000 per offense. Clear EVERYTHING, roof included."},
{w:'surv',q:"Drowsy-driving crashes happen most often:",a:["Between midnight and 6 a.m. (and mid-afternoon)","At noon","During morning rush hour","Just after sunset"],x:"Pics de somnolence : minuit–6 h et milieu d'après-midi (rythme circadien). Seul remède : dormir.",xe:"Drowsiness peaks: midnight–6 a.m. and mid-afternoon (circadian rhythm). The only cure: sleep."},

/* --- GDL expert --- */
{w:'gdl',q:"Since February 2025, permit holders under 21 must log before their road test:",a:["50 hours of practice, including 10 at night","10 hours of practice","100 hours, all supervised","No hour requirement exists"],x:"Nouvelle loi (fév. 2025) : moins de 21 ans = 50 h de conduite enregistrées, dont 10 de NUIT. Les questions fraîches adorent tomber.",xe:"New law (Feb 2025): under 21 = 50 logged driving hours, 10 at NIGHT. Fresh rules love showing up on the test."},
{w:'gdl',q:"Failing to display the red GDL decals on your plates costs:",a:["$100","$25","$500 + 2 points","Nothing, decals are optional"],x:"Décalcos rouges absentes = 100 $ d'amende. Et toute violation des conditions GDL (couvre-feu, passagers, téléphone) = 100 $ aussi.",xe:"Missing red decals = a $100 fine. And any GDL condition violation (curfew, passengers, phone) = $100 too."},
{w:'gdl',q:"In a vehicle driven by a GDL permit/probationary driver, seat belts are required for:",a:["Every occupant, in every seat","Front-seat occupants only","The driver only","Occupants under 18 only"],x:"Règle GDL spéciale : TOUS les occupants bouclés, à toutes les places — plus strict que la règle générale.",xe:"Special GDL rule: EVERY occupant belted, in every seat — stricter than the general rule."},
{w:'gdl',q:"To drive during GDL curfew hours (11:01 p.m.–5 a.m.) for work or religious reasons, you must:",a:["Carry legible documentation proving the exception","Call the MVC each time","Have a parent's verbal OK","Nothing — exceptions are automatic"],x:"Exception travail/religion : il faut une PREUVE écrite lisible sur toi (attestation employeur, etc.).",xe:"Work/religion exception: carry legible WRITTEN proof (employer statement, etc.)."},
{w:'gdl',q:"For your road test, your vehicle must:",a:["Be properly registered, insured, and in safe working order — or the test is refused","Be a driving-school car","Have dual brake pedals","Be less than 10 years old"],x:"Épreuve route : véhicule immatriculé, assuré, en bon état (frein à main accessible). Papiers manquants = test refusé, rendez-vous perdu.",xe:"Road test: registered, insured vehicle in safe condition (reachable parking brake). Missing papers = test refused, appointment lost."},
{w:'gdl',q:"To get a NJ license or permit, you must prove your identity through:",a:["The 6 Point ID Verification system","Two passport photos","A birth certificate only","A sworn statement"],x:"6 Point ID : combinaison de documents (passeport, SS card, factures…) totalisant 6 points d'identification. Sans ça, pas de permis.",xe:"6 Point ID: a combination of documents (passport, SS card, bills…) totaling 6 identification points. No points, no license."},
{w:'gdl',q:"After your 1-year probationary period, the basic license requires that you:",a:["Are at least 18 and completed probation without issue","Pass a second road test","Wait until age 21","Buy a new vehicle registration"],x:"Basic license : minimum 18 ans ET 1 an de probatoire propre. Les violations GDL peuvent prolonger la peine.",xe:"Basic license: at least 18 AND a clean 1-year probationary period. GDL violations can extend the wait."},

/* ================ FOURNÉE PRACTICE-TESTS (inspirée des tests en ligne) ================ */
{w:'signs',q:"On a highway, a broken white line between lanes means:",a:["Traffic moves in the same direction and you may change lanes with care","Traffic moves in opposite directions","Lane changes are prohibited","The lane is reserved for buses"],x:"Ligne blanche = même sens de circulation. Discontinue = tu peux changer de voie prudemment.",xe:"White line = same-direction traffic. Broken = you may change lanes with care."},
{w:'signs',q:"A solid white line between lanes of traffic means:",a:["Stay in your lane — crossing it is discouraged","You may cross it freely to pass","Traffic moves in opposite directions","The road narrows ahead"],x:"Ligne blanche continue = reste dans ta voie, la franchir est déconseillé.",xe:"Solid white line = stay in your lane; crossing is discouraged."},
{w:'signs',q:"An overhead lane signal shows a steady red X above your lane. You must:",a:["Not drive in that lane","Slow to 25 mph in that lane","Use that lane for left turns only","Stop under the signal and wait for green"],x:"X rouge au-dessus d'une voie = voie interdite. Change de voie dès que possible.",xe:"A red X over a lane means that lane is closed to you — move out of it."},
{w:'signs',q:"A DO NOT ENTER sign is posted to:",a:["Keep you from entering a road or ramp against traffic","Mark a dead-end street","Mark a private driveway","Warn of a low bridge ahead"],x:"DO NOT ENTER = tu entrerais à contresens (sortie d'autoroute, sens unique). Interdit d'y entrer.",xe:"DO NOT ENTER means you'd be going against traffic (exit ramps, one-way streets). Never enter."},
{w:'signs',q:"White rectangular signs with black letters are:",a:["Regulatory signs — they state laws you must obey","Warning signs about road hazards","Guide signs showing destinations","Service signs for food and fuel"],x:"Rectangle blanc = panneau de réglementation : c'est la loi, pas un conseil.",xe:"White rectangles are regulatory signs — they state the law, not a suggestion."},
{w:'signs',q:"At a red light with a NO TURN ON RED sign, the intersection is completely clear. You may:",a:["Not turn until the light turns green","Turn right after a full stop","Turn right without stopping since it's clear","Turn if no pedestrians are present"],x:"Le panneau NO TURN ON RED interdit le virage au rouge même si tout est dégagé. Attends le vert.",xe:"NO TURN ON RED bans the turn even when clear. Wait for green."},
{w:'signs',q:"You are in a lane with a large white arrow painted on the pavement pointing left. You must:",a:["Turn in the direction of the arrow","Treat the arrow as a suggestion","Go straight unless a sign says otherwise","Merge left only if traffic allows"],x:"Une flèche peinte au sol est obligatoire : tu dois suivre sa direction.",xe:"A pavement arrow is mandatory — you must move in the direction it shows."},
{w:'signs',q:"The red lights at a railroad crossing are flashing but you don't see a train. You must:",a:["Stop — a train is approaching; proceed only when the lights stop and it's safe","Slow down and cross quickly","Cross if you can't hear a horn","Stop, then cross within 10 seconds"],x:"Feux rouges clignotants au passage à niveau = un train arrive. Arrête-toi et attends que ça s'éteigne.",xe:"Flashing red lights at a crossing mean a train is coming. Stop and wait until they stop."},
{w:'speed',q:"A yellow sign under a curve warning reads '35 M.P.H.'. This number is:",a:["The recommended safe speed for the curve","The legal maximum enforced by radar","The minimum speed for the curve","Only valid at night"],x:"Panneau jaune = vitesse conseillée pour aborder le virage en sécurité, pas la limite légale.",xe:"Yellow advisory panels show the recommended safe speed for the curve, not the legal limit."},
{w:'speed',q:"You drive exactly 55 mph in a 55 mph zone during dense fog. You can still be ticketed because:",a:["You must adjust speed to conditions — the limit applies to ideal conditions only","Fog automatically lowers all limits to 25 mph","Radar doesn't work in fog","You cannot — driving the posted limit is always legal"],x:"La limite vaut par conditions idéales. Par brouillard, rouler à la limite peut être « trop vite pour les conditions ».",xe:"Posted limits assume ideal conditions. In fog, driving the limit can be 'too fast for conditions'."},
{w:'speed',q:"To reduce the risk of hydroplaning, you should:",a:["Slow down, keep good tread and proper tire pressure, avoid standing water","Drive with slightly underinflated tires for grip","Brake firmly through puddles","Use cruise control to keep speed steady"],x:"Contre l'aquaplaning : ralentis, pneus bien gonflés avec de la gomme, évite les flaques. Jamais de régulateur sous la pluie.",xe:"Against hydroplaning: slow down, good tread, proper pressure, avoid puddles. Never cruise control in rain."},
{w:'speed',q:"In a 65 mph zone, fines are doubled if you exceed the limit by:",a:["10 mph or more","5 mph or more","15 mph or more","20 mph or more"],x:"Dans les zones à 65 mph, dépasser de 10 mph ou plus = amende doublée.",xe:"In 65 mph zones, going 10+ mph over doubles the fine."},
{w:'speed',q:"A highway posts a minimum speed of 45 mph. Driving slower is:",a:["Illegal unless conditions make the minimum unsafe","Always legal — minimums are advisory","Legal in the right lane only","Legal with hazard lights on"],x:"Rouler sous la vitesse minimale affichée est illégal, sauf si les conditions l'exigent.",xe:"Driving below a posted minimum is illegal unless conditions require it."},
{w:'speed',q:"To control your speed on a long, steep downgrade, you should:",a:["Shift to a lower gear and use the engine to help slow you","Ride the brakes steadily all the way down","Shift to neutral to save fuel","Use cruise control"],x:"Longue descente : rétrograde et laisse le frein moteur travailler. Freiner en continu surchauffe les freins.",xe:"On long downgrades, shift to a lower gear and let the engine slow you. Riding the brakes overheats them."},
{w:'speed',q:"On an expressway, 'wolf packs' are dangerous. You should:",a:["Avoid driving in tight clusters of vehicles — spread out or drop back","Stay inside the pack for wind protection","Speed up to lead the pack","Match the pack's speed exactly"],x:"Les « wolf packs » sont des grappes de voitures : reste à l'écart, garde de l'espace autour de toi.",xe:"Wolf packs are tight vehicle clusters — stay out of them and keep space around you."},
{w:'dist',q:"Tires are legally worn out and unsafe when tread depth reaches:",a:["2/32 of an inch","4/32 of an inch","1/32 of an inch","6/32 of an inch"],x:"2/32 de pouce de gomme = pneu mort. En dessous, adhérence et évacuation d'eau s'effondrent.",xe:"2/32 inch of tread = worn out. Below that, grip and water evacuation collapse."},
{w:'dist',q:"Tire pressure should be checked when the tires are:",a:["Cold — before driving or after only a mile or two","Hot — right after highway driving","Warm — after about 20 minutes of driving","It makes no difference"],x:"Vérifie la pression à froid : la chaleur de la route fausse la mesure vers le haut.",xe:"Check pressure cold — driving heats tires and inflates the reading."},
